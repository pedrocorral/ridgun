  <script>
    const CHAPTERS = [{"num":"00","slug":"00-perche-ho-bisogno-di-ridgun","file":"00-perche-ho-bisogno-di-ridgun.md","title":"Capitolo 00: Perché ho bisogno di Ridgun? Ah sì? Non lo sapevo... Raccontami di più!","short_title":"Perché ho bisogno di Ridgun? Ah sì? Non lo sapevo... Raccontami di più!","markdown":"# Capitolo 00: Perché ho bisogno di Ridgun? Ah sì? Non lo sapevo... Raccontami di più!\n\nSiamo sinceri: quando qualcuno ti dice *\"abbiamo creato un nuovo linguaggio di programmazione\"*, la tua prima reazione naturale — e sanissima — è inarcare un sopracciglio e pensare:\n\n> *\"Un altro? Ma se ho già Python per andare veloce, Rust o C per quando mi serve velocità pura, e Bash per incollare cose nel terminale. Perché diavolo dovrei imparare Ridgun?\"*\n\nÈ una domanda eccellente. E la risposta breve è: **perché ti sei abituato a soffrire quattro dolori quotidiani pensando che fossero inevitabili**.\n\nDiamo loro un nome.\n\n---\n\n## Dolore n.º 1: \"La sindrome dei due mondi\" (Prototipare in uno, riscrivere nell'altro)\n\nSicuramente hai già vissuto questo film:\n\n1. Inizi uno strumento o un motore di calcolo in **Python**, **JavaScript** o **Ruby** perché vuoi pensare al problema, non ai puntatori né al compilatore.\n2. Il codice viene corto e bello... ma quando gli passi un file da 500 MB o provi a usare i 16 core della tua macchina, si trascina. E se vuoi distribuire il tuo programma su un server pulito, devi impacchettare mezzo gigabyte di ambiente virtuale, interprete e librerie dinamiche.\n3. Rassegnato, decidi di riscriverlo in **C**, **C++** o **Rust**. Ora vola e occupa poche centinaia di kilobyte, ma il tuo codice di 40 righe si è trasformato in 300 righe piene di `unwrap()`, `&mut`, `'a`, `Arc<Mutex<...>>`, parentesi graffe `{}` e punti e virgola `;`.\n\n**Cosa cambia con Ridgun?**\nIn Ridgun scrivi codice **più corto e pulito che in Python**, ma quando esegui `ridgunc build`, ottieni **un unico binario nativo ELF da ~350 KB** senza interprete, senza macchina virtuale esterna e senza garbage collector. Non c'è la fase *\"poi lo riscriviamo nel linguaggio veloce\"*: il codice pulito in cui ragioni sul problema **è già** il binario nativo di produzione.\n\n---\n\n## Dolore n.º 2: \"Leggere codice altrui (o il tuo di 6 mesi fa) è giocare al detective\"\n\nGuarda come scriviamo la logica condizionale in quasi tutti i linguaggi mainstream:\n\n```text\nif (stato == ATTIVO && (ruolo == ADMIN || (ruolo == EDITOR && haPermesso))) {\n    if (quota > 0) {\n        return elabora(utente);\n    } else {\n        return nega(\"Senza quota\");\n    }\n} else {\n    return nega(\"Non autorizzato\");\n}\n```\n\nI nostri occhi non si sono evoluti per accoppiare parentesi graffe annidate né per sbrogliare alberi di `if / else` a gradini. Quando gli ingegneri, i matematici o i fisici vogliono capire regole complesse senza sbagliare, non scrivono paragrafi di `if / else`: **disegnano una tabella**.\n\nIn Ridgun, **il codice è quella tabella**:\n\n```ridgun\nautorizzare String   String   Bool  Int   => String\nautorizzare \"attivo\" \"admin\"  _     quota =\n  | quota > 0 = \"Elaborazione richiesta\"\n  | otherwise = \"Negato: senza quota\"\nautorizzare \"attivo\" \"editor\" True  quota =\n  | quota > 0 = \"Elaborazione richiesta\"\n  | otherwise = \"Negato: senza quota\"\nautorizzare _        _        _     _     =  \"Negato: non autorizzato\"\n```\n\nGuarda le colonne:\n- Colonna 1: lo stato (`\"attivo\"` o `_`).\n- Colonna 2: il ruolo (`\"admin\"`, `\"editor\"` o `_`).\n- Colonna 3: se ha il permesso (`True` o `_`).\n- Colonna 4: la `quota`.\n\nNon devi eseguire mentalmente il programma riga per riga per sapere cosa succede quando entra un `\"editor\"` con permesso `False`: i tuoi occhi scendono verticalmente lungo la tabella e lo vedono in mezzo secondo.\n\n---\n\n## Dolore n.º 3: \"Il mio computer ha 16 core, ma il mio programma ne usa solo 1 (perché ho il terrore di toccare i thread)\"\n\nOggi persino il telefono più modesto ha 8 core, e qualsiasi server o portatile di lavoro ne ha tra 12 e 32. Eppure, il 95% dei programmi quotidiani continua a girare su un singolo thread sequenziale.\n\nPerché? Perché nei linguaggi imperativi parallelizzare significa aprire il vaso di Pandora:\n- E se due thread modificano lo stesso dizionario contemporaneamente? (*Data race*).\n- E se blocco il `Mutex` A e poi il B in un thread, e il B e poi l'A in un altro? (*Deadlock*).\n- E se contamino tutta la mia base di codice con `async` e `await` da cima a fondo?\n\nIn Ridgun, **ogni funzione è pura e ogni dato è immutabile per impostazione predefinita**. Questo ha una conseguenza magica: **due espressioni che non dipendono l'una dall'altra non possono mai interferire tra loro**.\n\nPerciò, in Ridgun non devi gestire thread per sfruttare la tua CPU. Dichiari solo **cosa dipende da cosa** con barre parallele `||` e frecce `->`:\n\n```ridgun\nrapporto mensile Dati => Rapporto\nrapporto mensile d    =  combina metriche_rete metriche_disco metriche_cpu\n  || analizza rete d  -> metriche_rete\n  || analizza disco d -> metriche_disco\n  || analizza cpu d   -> metriche_cpu\n```\n\nTu hai scritto solo tre righe pulite indicando da dove esce ogni dato. Il compilatore vede che i tre rami sono indipendenti e sa che può lanciarli in parallelo senza che esista nemmeno la minima possibilità di un *data race* o di un *deadlock*.\n\nE se hai bisogno di agenti persistenti con casella di posta e stato isolato (ad esempio per mantenere migliaia di sessioni client, worker in background o connessioni di rete)? In Ridgun non devi definire classi `Actor` né usare `Mutex`: **qualsiasi funzione normale si trasforma in un agente autonomo in una sola riga con `agent`**:\n\n```ridgun\ncontatore = agent (somma visita) 0\nsend 1 to contatore\nsend 5 to contatore\ntotale = receive from contatore\nstop contatore\n```\n\nInoltre, il compilatore effettua una **scelta intelligente a tempo di compilazione**: analizza staticamente la profondità e il costo di ogni funzione in `||`, `||map`, `||filter` e `agent` per eseguire le funzioni leggere come passi *green-thread* a sovraccarico zero (senza pagare il costo di riscaldare thread del sistema operativo) e smistare automaticamente i calcoli pesanti o ricorsivi su thread reali del kernel su più core (`SYS_clone`).\n\n---\n\n## Dolore n.º 4: \"Il garbage collector decide di mettere in pausa il mondo proprio nel momento peggiore\"\n\nI linguaggi funzionali classici (Haskell, OCaml, Erlang, Clojure) sono meravigliosi per ragionare sul codice, ma quasi tutti dipendono da un **Garbage Collector** a tempo di esecuzione. Questo li esclude quando hai bisogno di:\n- Latenze prevedibili al microsecondo.\n- Controllare esattamente quanta memoria RAM può consumare un'operazione prima di interromperla in modo pulito.\n- Scrivere utilità di sistema operativo (`ls`, `find`, `sh`, `doas`, `make`) o toccare registri hardware (`MMIO`).\n\nRidgun ti dà **tutta l'eleganza del mondo funzionale puro, ma con la Gestione della Memoria di Ridgun (`RMM`: `RMM1` statica e `RMM2` per conteggio di assegnazioni a cascata) più regioni lessicali con quota esatta (`with region`)**:\n\n```ridgun\nanalizza pacchetto String => Result\nanalizza pacchetto grezzo =\n  with region 16_KB do\n    decodifica trama grezzo\n```\n\nOgni struttura temporanea viene liberata in modo deterministico dal compilatore (`RMM1` / `RMM2`) nell'istante in cui smette di essere usata, e se un attaccante ti invia un pacchetto malevolo progettato per far esplodere la memoria, superato il byte 16.384 la regione viene tagliata all'istante, libera la sua arena in $O(1)$ e ti restituisce `Err OutOfMemory`. Senza crolli del processo, senza pause del GC e senza perdite di memoria.\n\n---\n\n## In sintesi: Quando brilla Ridgun?\n\nRidgun è fatto per te se hai mai voluto:\n\n1. **Scrivere strumenti di sistema, compilatori, analizzatori o utilità CLI** che si avviino in microsecondi, pesino poche centinaia di KB e non possano rompersi per puntatori nulli né effetti collaterali nascosti.\n2. **Costruire sistemi concorrenti e server basati sul Modello Nativo di Agenti (`agent`, `send ... to`, `receive from`, `stop`)**, dove qualsiasi funzione pura diventa un agente con o senza stato isolato e il compilatore sceglie in modo intelligente tra esecuzione *green-thread* ultraleggera e thread nativi multicore.\n3. **Programmare algoritmi, pipeline di dati o algebra dei tensori** in cui il compilatore verifichi per te persino le dimensioni delle matrici (`Tensor[M, K] * Tensor[K, N] => Tensor[M, N]`) prima di eseguire alcunché.\n4. **Divertirti leggendo il tuo stesso codice**: che ogni file `.rg` sembri la pagina di un libro ben impaginato grazie al formattatore tabellare automatico (`stable format`).\n\nTi pizzica la curiosità? Passa al **Capitolo 01** e scriviamo il nostro primo programma in meno di due minuti.\n"}, {"num":"01","slug":"01-benvenuto-in-ridgun","file":"01-benvenuto-in-ridgun.md","title":"Capitolo 01: Il tuo primo contatto con Ridgun (Senza caschi, senza parentesi graffe e senza punti e virgola)","short_title":"Il tuo primo contatto con Ridgun (Senza caschi, senza parentesi graffe e senza punti e virgola)","markdown":"# Capitolo 01: Il tuo primo contatto con Ridgun (Senza caschi, senza parentesi graffe e senza punti e virgola)\n\nBene, nel Capitolo 00 ti ho già convinto che non siamo pazzi per aver creato Ridgun. Ora probabilmente starai pensando:\n\n> *\"Molto bello il discorso sulle tabelle e sui 16 core, ma mostrami del codice vero. Quanto ci mette uno a scrivere qualcosa che funzioni senza litigare con il compilatore?\"*\n\nDai, andiamo al sodo!\n\n---\n\n## 1.1. \"Ciao, mondo!\", ma con sostanza\n\nNella maggior parte dei libri di programmazione ti mostrano uno sciapo `print(\"Ciao mondo\")` e voltano pagina. Noi scriveremo direttamente una funzione con logica reale per farti vedere come respira Ridgun fin dal primo minuto.\n\nCrea un file chiamato `ciao.rg` e scrivi questo:\n\n```ridgun\nsaluto String => String\nsaluto \"\"     =  \"Ciao, viaggiatore misterioso! (Non mi hai detto il tuo nome)\"\nsaluto \"Root\" =  \"Ehilà, Root! Attento a quello che cancelli oggi.\"\nsaluto nome   =  \"Ciao, {nome}! Benvenuto in Ridgun.\"\n\nmain => ()\nmain =\n  echo (saluto \"Ada\")\n  echo (saluto \"Root\")\n  echo (saluto \"\")\n```\n\nPer eseguirlo subito:\n\n```bash\nridgunc run ciao.rg\n```\n\nE vedrai nel tuo terminale:\n\n```text\nCiao, Ada! Benvenuto in Ridgun.\nEhilà, Root! Attento a quello che cancelli oggi.\nCiao, viaggiatore misterioso! (Non mi hai detto il tuo nome)\n```\n\nFermati un attimo e guarda il blocco di `saluto` qui sopra. Noti cosa **NON** c'è?\n- **Non c'è `function`, né `def`, né `pub fn`** (se vuoi mettere `fn ::` davanti alla firma puoi farlo, ma è facoltativo).\n- **Non ci sono parentesi `(String nome)` né parentesi graffe `{ ... }`** a sporcare lo schermo.\n- **Non c'è `if (nome == \"\") ... else if (nome == \"Root\") ... else ...`**.\n- **Non c'è `return`**.\n\n---\n\n## 1.2. Come il tuo cervello legge un file `.rg`\n\nAnalizziamo quelle quattro righe di `saluto`, perché qui c'è già il 50% della filosofia di Ridgun:\n\n```ridgun\nsaluto String => String\nsaluto \"\"     =  \"Ciao, viaggiatore misterioso! (Non mi hai detto il tuo nome)\"\nsaluto \"Root\" =  \"Ehilà, Root! Attento a quello che cancelli oggi.\"\nsaluto nome   =  \"Ciao, {nome}! Benvenuto in Ridgun.\"\n```\n\n1. **La prima riga è il contratto (`saluto String => String`)**:\n   Dice: *\"Mi chiamo `saluto`, ricevo uno `String` e ti restituisco (`=>`) un altro `String`\"*. Punto. Se qualcuno prova a chiamarmi passandomi il numero `42`, il compilatore gli batterà sulla spalla prima ancora di eseguire il programma.\n2. **Le righe sotto sono i casi (dall'alto verso il basso)**:\n   - Mi hai passato la stringa vuota `\"\"`? Restituisco la prima frase.\n   - Mi hai passato esattamente `\"Root\"`? Restituisco la seconda frase.\n   - Mi hai passato qualsiasi altra cosa? La salvo nella variabile `nome` e la inserisco nel testo usando `{nome}`.\n3. **E cos'è `main => ()`?**:\n   Poiché `main` non riceve argomenti, mettiamo `=>` direttamente dopo il nome. E restituisce `()` (il tipo vuoto o *Unit*, per gli amici), perché il suo unico lavoro è stampare cose a schermo con `echo`.\n\n---\n\n## 1.3. \"Aspetta... devo allineare quegli spazi a mano come un monaco amanuense?\"\n\nNeanche per sogno! Se dovessi premere la barra spaziatrice contando le colonne a occhio, abbandoneresti Ridgun dopo dieci minuti (e a ragione).\n\nTu scrivi il codice in fretta, con un solo spazio tra ogni parola:\n\n```ridgun\nsaluto String => String\nsaluto \"\" = \"Ciao, viaggiatore misterioso!\"\nsaluto nome = \"Ciao, {nome}!\"\n```\n\nE quando esegui **`stable format`** (o premi `TAB` / salvi il file in Emacs con `ridgun-mode`), il formattatore canonico posiziona ogni parametro sotto il suo tipo e allinea tutti gli `=` con precisione millimetrica. Tu scrivi veloce; la macchina impagina la tabella.\n\n---\n\n## 1.4. Da script veloce a binario da combattimento in un comando\n\nQuando fai `ridgunc run ciao.rg`, stai compilando e lanciando il programma al volo. Ma immagina di aver finito il tuo strumento e di volerlo portare su un server di produzione o condividerlo con un collega che non ha installato Ridgun.\n\nEsegui:\n\n```bash\nridgunc build ciao.rg -o ciao\n```\n\nE hai già `./ciao`: un **eseguibile nativo ELF per Linux x86_64**, pulito, senza codice morto (*Tree-Shaking*), con ottimizzazione dell'intero collegamento (*LTO*) e senza dipendere da alcun interprete esterno.\n\n---\n\n## 1.5. Il promemoria onesto: Da dove viene ogni idea di Ridgun?\n\nRidgun non pretende di reinventare la ruota quadrata; prende in prestito senza complessi il meglio di quattro tradizioni:\n\n| Da chi | Cosa prende Ridgun | Cosa lascia fuori (per la tua salute mentale) |\n|---|---|---|\n| **Haskell / ML** | Funzioni pure, *pattern matching* per casi, tipi algebrici (`Option`, `Result`) e polimorfismo (`A`..`Z`). | Le monadi astratte, i 40 `LANGUAGE pragma` e il garbage collector. |\n| **J / APL** | L'ossessione per la forma tabellare del codice, tensori nativi e maschere di sequenze (`s(_ + _)`). | I simboli geroglifici impossibili da digitare su una tastiera normale. |\n| **Rust / C** | Binari ELF nativi piccoli, zero GC, controllo della memoria (`with region`) e chiamate di sistema POSIX. | La lotta costante con il *borrow checker*, i *lifetime* `'a` e la verbosità sintattica. |\n| **Erlang / Go** | Agenti isolati (`agent`, `send ... to`, `receive from`) e concorrenza tramite canali (`new bounded channel`). | I puntatori `nil` e le mutazioni condivise per distrazione. |\n\n---\n\n## 1.6. E la cosa più importante: Cosa fa Ridgun che NON ha nessun altro?\n\nRiconoscere i classici è buona educazione, ma se Ridgun fosse solo una \"raccolta dei più grandi successi\" di altri linguaggi, non staresti leggendo questo libro.\n\nCi sono **otto cose** che abbiamo progettato e integrato in Ridgun che non troverai insieme — e molte di esse, nemmeno separatamente — in nessun altro linguaggio attuale:\n\n### 1. Blocchi paralleli `||` con `->` che sono veri grafi paralleli, non semplice zucchero sintattico\nIn altri linguaggi funzionali un blocco di variabili locali ordina solo espressioni che poi vengono valutate su un singolo thread.\nIn Ridgun, **un blocco `||` con frecce `->` è un Grafo Aciclico Diretto (DAG) di esecuzione parallela** senza nemmeno dover scrivere parole chiave extra come `where`:\n```ridgun\nrapporto annuale Int => Int\nrapporto annuale id  =  entrate - spese\n  || calcola vendite id -> entrate\n  || calcola costi id   -> spese\n```\nTu disegni le frecce di flusso (`->`). Il compilatore analizza chi dipende da chi, **verifica staticamente che tu non abbia creato alcun ciclo infinito**, e lancia i rami indipendenti in parallelo senza che tu scriva nemmeno un singolo `async`, `await`, `Future` o `Mutex`.\n\n### 2. Modello Nativo di Agenti (`agent`) a zero attrito con scelta intelligente in compilazione\nIn altri linguaggi, programmare con attori o agenti ti obbliga a creare classi speciali, implementare *trait*, gestire *lock* o infettare le tue funzioni con `async`.\nIn Ridgun, **qualsiasi funzione pura normale (`fn ::` o `op ::`) si trasforma direttamente in un agente autonomo — con o senza stato isolato — usando `agent`**:\n```ridgun\nservi http (Sessione, String) => (Sessione, String)\n...\nserver = agent servi http sessione_iniziale\nsend \"GET /profilo\" to server\nrisposta = receive from server\nstop server\n```\nAncora meglio: il compilatore **analizza a tempo di compilazione la profondità e il costo computazionale della funzione** sia in `agent` che in `||` e `||map`. Se la funzione è leggera, la esegue come un *green thread* istantaneo senza pagare il costo di riscaldare thread del sistema operativo; se è un calcolo pesante o ricorsivo profondo, la smista automaticamente in parallelo su thread reali del kernel (`SYS_clone`) distribuiti sui core della tua CPU.\n\n### 3. Il codice come tabella bidimensionale in cui la firma è l'intestazione delle colonne\nIn qualsiasi altro linguaggio, la firma dei tipi va per conto suo su una riga e il corpo della funzione va sotto come un normale paragrafo di testo.\nIn Ridgun, **la firma dei tipi è letteralmente l'intestazione di una tabella**, e ogni caso sottostante allinea ogni pattern esattamente sulla verticale del suo tipo e ogni `=` sotto il `=>`:\n```ridgun\ndividi Int Int => Option\ndividi _   0   =  None\ndividi a   b   =  Some (a / b)\n```\nNessun altro tratta la firma e le equazioni come un'unica matrice visiva verificata dal compilatore e impaginata automaticamente da `stable format`.\n\n### 4. Operatori frase (*Mixfix* N-ari) tipizzati e allineati (`op ::`)\nNella maggior parte dei linguaggi, o ti accontenti di `+`, `-`, `*` o al massimo definisci un operatore binario criptico come `<|>` che nessuno sa cosa significhi.\nIn Ridgun puoi creare **operatori che sono frasi leggibili con tutti gli slot tipizzati che vuoi** (incluse parole contestuali come `type` o `with`):\n```ridgun\nop :: Int limitato tra Int e Int => Int\n      x   limitato tra min e max =\n        | x < min   = min\n        | x > max   = max\n        | otherwise = x\n```\nE poi nel tuo codice scrivi `velocita limitato tra 0 e 120`. Si legge come italiano (o inglese), ma è tipizzato al 100% e compilato in codice nativo.\n\n### 5. Maschere visive sulle sequenze (`s(_ + _)` e `-> (+ _ _ +) ->`)\nHai mai dovuto scrivere un'insalata di indici `filter(\\(i, x) -> i % 2 == 0)` o aprire una tupla con variabili mute solo per tenerti due posizioni precise?\nIn Ridgun gli passi direttamente una **maschera visiva**:\n- `dati(_ + _)`: scarta il primo (`_`), tiene il secondo (`+`), scarta il terzo (`_`).\n- `analizza pacchetto \"v0.9.9\" -> (+ _ _ +) -> combina codice -> riepilogo`: filtra una tupla di 4 elementi nel bel mezzo della pipeline e passa il 1.º e il 4.º direttamente come i 2 argomenti della funzione successiva.\nZero aritmetica degli indici, zero errori *off-by-one*.\n\n### 6. Polimorfismo a \"zero rumore\" (`A`..`Z`) governato dal tuo dominio\nIn Rust, TypeScript o Java, quando una funzione è generica devi riempire la riga di parentesi angolari: `fn scambia<A, B>(coppia: (A, B)) -> (B, A)`.\nIn Ridgun usi semplicemente una lettera maiuscola singola:\n```ridgun\nscambia (A, B) => (B, A)\nscambia (x, y) =  (y, x)\n```\n*\"E se nel mio programma voglio avere un tipo reale che si chiami `type A`?\"* — Nessun problema: in Ridgun **le tue dichiarazioni `type` comandano**. Se non esiste `type A`, `A` è generico; nell'istante in cui definisci `type A = ...`, diventa il tuo tipo concreto in tutto il modulo.\n\n### 7. Zero file di configurazione strani: `build.rg` è puro Ridgun\nDimenticati di imparare TOML per Cargo, JSON per npm, XML per Maven o la sintassi arcana di `Makefile` con tabulazioni invisibili. In Ridgun, la ricetta che costruisce il tuo progetto (`build.rg`) **è un file `.rg` come gli altri**, con le stesse funzioni pure e lo stesso *pattern matching* del resto del tuo codice.\n\n### 8. La \"Santissima Trinità\" che sembrava impossibile: Livello Haskell + Memoria RMM senza GC né Lifetime + Binari da ~350 KB\nFino a oggi dovevi scegliere:\n- Se volevi espressività funzionale pura (Haskell, OCaml, Elixir), pagavi con un garbage collector e un runtime pesante.\n- Se volevi binari minuscoli di sistema senza garbage collector (C, Rust, Zig), pagavi gestendo puntatori o litigando con il *borrow checker* e scrivendo codice imperativo pieno di `let mut`.\n\nRidgun rompe questo dilemma combinando **Ridgun Memory Management (`RMM`: `RMM1` statica e `RMM2` per conteggio di assegnazioni a cascata)**, **regioni lessicali (`with region`)** che liberano intere arene in $O(1)$, **ricorsione di coda trasformata in cicli nativi (`loop`)**, e **potatura del grafo delle chiamate (*Tree-Shaking*)** a partire da `main`. Il risultato: scrivi codice dichiarativo di altissimo livello e ottieni un eseguibile ELF autonomo da **~350 KB** capace di competere alla pari con strumenti scritti in C.\n\nOra sì: con le carte in tavola, andiamo al **Capitolo 02** per mettere al lavoro **`ridgunc`** e **`stable`**.\n"}, {"num":"02","slug":"02-primi-passi-e-strumenti","file":"02-primi-passi-e-strumenti.md","title":"Capitolo 02: I tuoi due migliori amici: `ridgunc` e `stable` (Zero file YAML, promesso)","short_title":"I tuoi due migliori amici: `ridgunc` e `stable` (Zero file YAML, promesso)","markdown":"# Capitolo 02: I tuoi due migliori amici: `ridgunc` e `stable` (Zero file YAML, promesso)\n\nCi sono linguaggi il cui compilatore è meraviglioso, ma il cui sistema di progetti sembra progettato dal tuo peggior nemico: ora un `Makefile` di 400 righe con tabulazioni invisibili, ora un `pom.xml` infinito, ora un `webpack.config.js` che smette di funzionare se lo guardi fisso...\n\nIn Ridgun ci siamo fatti una promessa semplicissima fin dal primo giorno:\n\n> *\"Ci saranno solo due eseguibili in tutto l'ecosistema (`ridgunc` e `stable`), entrambi saranno scritti nello stesso Ridgun, e il file di configurazione del progetto (`build.rg`) sarà normale codice Ridgun. Né JSON, né YAML, né TOML, né invenzioni strane.\"*\n\nVediamo come si usano.\n\n---\n\n## 2.1. `ridgunc`: Il cecchino per file singoli\n\nQuando hai per le mani un singolo file `.rg` e vuoi provare un'idea veloce, analizzarne i tipi o compilare un eseguibile, parli direttamente con **`ridgunc`**.\n\nHa solo 5 comandi che devi davvero ricordare:\n\n```bash\n# 1. \"Compila questo o ho combinato un pasticcio con qualche tipo?\"\nridgunc check esperimento.rg\n\n# 2. \"Eseguilo subito!\" (Compila ed esegue in un colpo solo)\nridgunc run esperimento.rg\n\n# 3. \"Fammi un binario nativo ELF64 pronto da portare via\"\nridgunc build esperimento.rg -o mio-programma\n\n# 4. \"Compilami una libreria riutilizzabile (.rglib e .so ELF64 senza bisogno di main)\"\nridgunc build --lib utilita.rg -o target/utilita.rglib\nridgunc build --so  utilita.rg -o target/libutilita.so\n\n# 5. \"Tirami fuori l'artefatto intermedio di bytecode (.rgc)\"\nridgunc compile esperimento.rg -o esperimento.rgc\n```\n\n### Il superpotere nascosto di `ridgunc check`\nQuando lanci `ridgunc check`, non ti dice solo *\"0 errori\"*. Ti svela anche quale strategia ha scelto l'analizzatore statico per ciascuna delle tue funzioni:\n- **`InlineSequential`**: *\"Questa funzione è piccolina e diretta; la eseguirò in linea senza aggiungere sovraccarico di pianificazione\"*.\n- **`LazyStealableTask`**: *\"Qui c'è ricorsione o un grafo parallelo `||`; la preparo affinché altri core della CPU possano rubare lavoro se necessario\"*.\n\n### Il bisturi di `ridgunc build` (Perché i tuoi binari non pesano 20 MB)\nQuando esegui `ridgunc build`, il compilatore non si limita a sputare fuori tutto il codice delle librerie che hai importato:\n1. Parte dalla tua funzione `main` e percorre il grafo delle chiamate per vedere **quali funzioni usi davvero**. Se hai importato una libreria enorme da 80 funzioni ma ne chiami solo 2, le altre 78 vengono scartate prima ancora di toccare l'assembler (*Tree-Shaking*).\n2. Cerca tutte le funzioni ricorsive di coda e le converte in cicli `loop` nativi che consumano **0 byte di stack**.\n3. Passa il collegamento finale con ottimizzazione globale (*fat LTO*) e pulisce le informazioni di debug DWARF superflue per lasciarti un binario compatto e affilato (~350 KB).\n\n---\n\n## 2.2. `stable`: Quando il tuo progetto cresce e vuoi ordine\n\nUn file singolo è fantastico per uno script, ma non appena hai più moduli, librerie condivise e test, hai bisogno di un direttore d'orchestra. Quello è **`stable`**.\n\nLa struttura delle cartelle di un progetto Ridgun non ha misteri:\n\n```text\nmio-super-strumento/\n├── build.rg                  # Il manifesto del progetto (è codice Ridgun!)\n├── src/\n│   ├── main/\n│   │   └── ridgun/\n│   │       ├── lib/          # I tuoi moduli riutilizzabili (`import utilita`)\n│   │       └── app/\n│   │           └── main.rg   # Punto di ingresso (`main => ()`)\n│   └── test/\n│       └── ridgun/           # Le tue batterie di test (`test *.rg`)\n│           └── test tutto.rg\n└── target/                   # Dove compaiono i binari compilati\n```\n\n---\n\n## 2.3. `build.rg`: Un file di configurazione che non ti mentirà mai\n\nPerché ci rifiutiamo di usare YAML o TOML per configurare un progetto Ridgun?\nPerché in YAML sbagli due spazi di indentazione e non te ne accorgi finché non fallisce il deploy. Invece, poiché **`build.rg` è un file Ridgun**, ha tipi statici, passa attraverso `stable check` e si allinea da solo con `stable format`:\n\n```ridgun\nfn :: project name => String\n      project name =  \"mio-super-strumento\"\n\nfn :: project version => String\n      project version =  \"0.1.0\"\n\n-- \"exe\" (eseguibile), \"lib\" (libreria .rglib + .so) o \"both\" (entrambi)\nfn :: project kind => String\n      project kind =  \"both\"\n\n-- Opzionale: modalità stretta (proibisce '_' nei nomi fn/op ed esige ritorni '=> Int Int')\nfn :: strict mode => Bool\n      strict mode =  True\n\nfn :: main entry => String\n      main entry =  \"src/main/ridgun/app/main.rg\"\n\nfn :: source dir => String\n      source dir =  \"src/main/ridgun\"\n\nfn :: test dir => String\n      test dir =  \"src/test/ridgun\"\n\nfn :: target dir => String\n      target dir =  \"target\"\n\nfn :: dependencies => [String]\n      dependencies =  []\n\nfn :: plugins => [String]\n      plugins =  []\n\nfn :: task verificare tutto => String\n      task verificare tutto =  \"./bin/stable check && ./bin/stable test\"\n```\n\nSe sbagli a scrivere un campo o un tipo, è lo stesso compilatore ad avvisarti. E nota che tutte le funzioni di configurazione usano **spazi naturali** (`project name`, `project kind`, `source dir`, `task verificare tutto`) invece di trattini bassi.\n\n---\n\n## 2.4. La tua routine quotidiana con `stable` (I fantastici 4)\n\nQuando lavori all'interno del tuo progetto, la tua giornata si riduce a quattro comandi:\n\n### 1. `stable format` — La fine delle discussioni sullo stile nel team\n```bash\nstable format\n```\nIl tuo collega mette tre spazi prima di `=>` e tu ne metti uno? Non importa. Esegui `stable format` e in meno di un secondo lascia **tutti** i file `.rg` del repository allineati come una tabella svizzera.\n\n### 2. `stable check` — Il radar istantaneo\n```bash\nstable check\n```\nPercorre tutti i moduli di `src/main/ridgun/`, verifica tipi, costruttori, arità e dimensioni dei tensori, e ti dà il verdetto modulo per modulo.\n\n### 3. `stable test` — Dormire tranquilli la notte\n```bash\nstable test\n```\nCerca tutte le suite `src/test/ridgun/test *.rg`, le esegue e controlla ogni `assert equals` e `assert true`.\n\n```ridgun\n-- Esempio di src/test/ridgun/test matematica.rg\nimport test\n\ndoppio Int => Int\ndoppio x   =  x * 2\n\nmain => ()\nmain =\n  assert equals (doppio 21) 42\n  assert true ((doppio 5) > 0)\n```\n\n### 4. `stable built` (e `stable clean`) — In produzione\n```bash\nstable built\n```\nCompila tutti gli obiettivi nativi in `target/`. E se un giorno vuoi cancellare `target/` e ripartire da zero: `stable clean`.\n\n---\n\n## 2.5. Creare e usare Librerie Riutilizzabili (`.rglib` e `.so` ELF64) e Plugin di `stable`\n\nUna libreria non ha la funzione `main => ()`: offre tipi (`type`, `expand type`), funzioni (`fn ::`) e operatori (`op ::`) affinché altri progetti li importino.\n\n### 1. Creare un progetto di libreria con `stable`\n```bash\nstable new --lib geometria\ncd geometria\nstable built lib\n```\nCompilando in modalità libreria (`project kind = \"lib\"` o `stable built lib`), il compilatore disattiva la potatura da `main` per conservare **tutte** le funzioni e i tipi esportati, e genera due artefatti in `target/`:\n- **`target/geometria.rglib`**: pacchetto autocontenuto di libreria Ridgun (con tutti i suoi sorgenti e dipendenze interne risolte), pronto per essere importato da qualsiasi altro progetto con `import geometria` o `import \"target/geometria.rglib\"`.\n- **`target/libgeometria.so`**: libreria dinamica nativa ELF64 (`ET_DYN`, per `x86_64` o `arm64-linux`).\n\n```ridgun\n-- src/main/ridgun/lib/geometria.rg (Senza funzione main!)\ntype Punto = x: Int, y: Int\n\nfn :: sposta punto Punto Int Int => Punto\n      sposta punto p     dx  dy  =  Punto ((x p) + dx) ((y p) + dy)\n\nfn :: coordinate punto Punto => Int Int\n      coordinate punto p     =  (x p, y p)\n```\n\n### 2. Come importo un modulo o una libreria da un altro file? (`import`)\n\nSenza percorsi relativi infernali tipo `../../../lib/cose.rg`. Se hai un modulo `src/main/ridgun/lib/geometria.rg` o un pacchetto `geometria.rglib` (in `target/`, `lib/` o `.stable/deps/` dopo aver eseguito `stable deps`), in qualsiasi altro file scrivi in cima:\n\n```ridgun\nimport geometria\n```\n\nE fatto: tutte le funzioni, gli operatori e i tipi di `geometria` sono disponibili come se fossero nel tuo stesso file. Se più moduli fanno `import geometria`, il caricatore di Ridgun ricorda quali file canonici ha già letto e **lo include una sola volta**.\n\n### 3. Estendere `stable` con attività (`fn :: task`) e plugin (`plugins/*.rg`)\nVuoi aggiungere comandi personalizzati per il tuo framework web, le tue migrazioni di database o il tuo flusso di deploy?\n- **In `build.rg`**: dichiara qualsiasi funzione `fn :: task <parole...> => String` (ad esempio, `fn :: task avvia server => String`) ed eseguila con `stable avvia server`.\n- **In `plugins/*.rg` o `.stable/plugins/*.rg`**: inserisci moduli `.rg` che definiscano attività `fn :: task ...` o il proprio `fn :: main => ()`, oppure estendi il tipo aperto `expand type StableCommand` di `stable`. Esegui `stable tasks` e `stable plugins` per ispezionarli in qualsiasi momento.\n\n### 4. La modalità stretta opzionale (`--strict` e `strict mode = True`)\nPer impostazione predefinita, né `ridgunc` né i nuovi progetti creati con `stable new` o `stable init` attivano la modalità stretta. Tuttavia, quando vuoi garantire nel tuo progetto che tutto il team segua al 100% la convenzione canonica degli spazi naturali di Ridgun, puoi passare `--strict` a `ridgunc` (`ridgunc check --strict`, `ridgunc build --strict`) o dichiarare `strict mode = True` nel tuo `build.rg`. La modalità stretta trasforma in **errore di compilazione**:\n1. Qualsiasi trattino basso `_` all'interno del nome di una dichiarazione `fn ::` o `op ::` (dovendo scrivere `fn :: calcola totale`, mai `fn :: calcola_totale`; le variabili locali e i campi dei record possono invece usare `_`).\n2. Qualsiasi tipo di ritorno multiplo scritto con parentesi o virgole dopo `=>` (dovendo scrivere `=> Int Int` o `=> RToken [RToken]`, mai `=> (Int, Int)`).\n\n---\n\n## 2.6. L'Ecosistema di Librerie Standard e Crittografiche (`ridgun-libs`)\n\nRidgun dispone di una suite ufficiale di **32 librerie pure** (`ridgun-libs`), compilate come pacchetti `.rglib` e librerie dinamiche `.so` ELF64 pronte da importare con `import <nome>`:\n\n| Famiglia | Librerie (`import ...`) | Cosa portano nei tuoi progetti |\n|---|---|---|\n| **1. Testo, Formati e Template** | `str`, `fmt`, `regex`, `diff`, `template`, `json`, `csv`, `ini`, `codec` | Manipolazione avanzata di stringhe, formattazione tabellare, espressioni regolari Thompson NFA, differenze Myers (`diff`), template senza logica, parser/serializzatori `json`/`csv`/`ini` e codifica esadecimale/Base64 (`codec`). |\n| **2. Collezioni, Matematica e Algebra Tensoriale** | `list`, `btree`, `math`, `tensor`, `linalg` | Operazioni funzionali su liste, B-tree ordinati in memoria (`btree`), aritmetica avanzata (`math`), viste e costruttori di tensori tipizzati (`tensor`) e decomposizione/algebra lineare (`linalg`). |\n| **3. Sistema Operativo, File e CLI** | `posix`, `io`, `path`, `glob`, `cli`, `time`, `log`, `uuid`, `test` | Descrittori e segnali POSIX (`posix`), I/O con `with timeout` (`io`), percorsi e pattern (`path`, `glob`), argomenti CLI tipizzati (`cli`), orologi monotonici (`time`), logging strutturato (`log`), RFC 4122 `uuid` e asserzioni (`test`). |\n| **4. Crittografia e Sicurezza** | `crypto`, `argon2id`, `jwt` | SHA-256 binario diretto (`sha256 raw` / `sha256 bytes` in 32 byte grezzi), HMAC-SHA-256, PBKDF2-HMAC-SHA-256, HKDF, ChaCha20-Poly1305 AEAD (`crypto`), hashing delle password RFC 9106 `argon2id` su `Tensor[U64 * 8 * 16]` con permutazione BlaMka senza allocare tuple nell'heap (`argon2id`), e token firmati (`jwt`). |\n| **5. Reti, Protocolli e Agenti** | `socket`, `http`, `ws`, `agent`, `pool`, `net_agent` | Socket TCP/UDP POSIX (`socket`), client/server HTTP/1.1 (`http`), WebSocket RFC 6455 (`ws`), supervisori di agenti (`agent`), pool di worker (`pool`) e server reattivi orientati agli agenti (`net_agent`). |\n\nOra che hai la cassetta degli attrezzi e le librerie sotto controllo, passiamo al **Capitolo 03** per padroneggiare le funzioni con spazi naturali, le firme dei tipi e i blocchi.\n"}, {"num":"03","slug":"03-funzioni-tipi-e-allineamento","file":"03-funzioni-tipi-e-allineamento.md","title":"Capitolo 03: Funzioni, firme dei tipi e l'arte di scrivere codice come una tabella","short_title":"Funzioni, firme dei tipi e l'arte di scrivere codice come una tabella","markdown":"# Capitolo 03: Funzioni, firme dei tipi e l'arte di scrivere codice come una tabella\n\nC'è una domanda che ogni programmatore si fa la prima volta che vede codice funzionale:\n\n> *\"Se qui non ci sono classi, né oggetti, né variabili che cambiano valore... allora dove metto la mia logica?\"*\n\nNelle **funzioni**. Ma non in quelle funzioni da 200 righe piene di flag booleani che tutti abbiamo sofferto qualche volta, bensì in funzioni piccole, dirette e così facili da leggere che sembrano una tabella su una lavagna.\n\nVediamo come si costruiscono.\n\n---\n\n## 3.1. Due modi di presentare una funzione (Scegli tu l'abito)\n\nIn Ridgun ogni funzione inizia con la sua **firma dei tipi** (cosa entra e cosa esce dopo `=>`) e sotto vanno le sue **clausole di implementazione** (con `=`).\n\nPuoi scrivere l'intestazione in due modi:\n\n### Opzione A: Dritta al punto (senza prefisso)\n```ridgun\napplica sconto Int    Int         => Int\napplica sconto prezzo percentuale =  prezzo - (prezzo * percentuale / 100)\n```\n\n### Opzione B: Con etichetta esplicita (`fn ::`)\n```ridgun\nfn :: applica sconto Int    Int         => Int\n      applica sconto prezzo percentuale =  prezzo - (prezzo * percentuale / 100)\n```\n\n*\"Ehi, perché usiamo spazi in `applica sconto` invece di `applica_sconto`?\"*\nPerché in Ridgun tutti i tipi iniziano con la maiuscola (`Int`, `String`, `A`..`Z`), `[` o `(`, mentre le parole del nome della funzione vanno in minuscolo. Così puoi scrivere nomi di più parole con spazi naturali (`applica sconto`, `costo spedizione`, `str len`, `read file`) senza alcuna ambiguità per il compilatore.\n\n*\"E perché esistono entrambe le opzioni (con `fn ::` e senza)?\"*\nPerché i gusti sono gusti:\n- C'è chi preferisce che le funzioni inizino attaccate al margine sinistro senza scrivere `fn ::` ogni volta (in fin dei conti, la freccia `=>` grida già ai quattro venti che quella riga è una firma dei tipi).\n- E c'è chi preferisce avere una colonna sinistra dedicata alle etichette (`fn ::`, `op ::`, `type`, `import`) per scansionare visivamente il file.\n\nIl compilatore e `stable format` capiscono entrambe alla perfezione.\n\n---\n\n## 3.2. La magia delle colonne: perché i tuoi occhi riposano\n\nGuarda questa funzione che calcola il costo di una spedizione in base al paese e all'urgenza:\n\n```ridgun\nfn :: costo spedizione String Bool  Int  => Int\n      costo spedizione \"IT\"   False _    =  5\n      costo spedizione \"IT\"   True  _    =  12\n      costo spedizione _      False peso =  10 + (peso * 2)\n      costo spedizione _      True  peso =  25 + (peso * 4)\n```\n\nFai la prova: copri la metà destra dello schermo e guarda solo le tre colonne di ingresso:\n- Prima colonna (`String`): `\"IT\"`, `\"IT\"`, `_`, `_`.\n- Seconda colonna (`Bool`): `False`, `True`, `False`, `True`.\n- Terza colonna (`Int`): `_`, `_`, `peso`, `peso`.\n\nVedi qualche buco logico? Nessuno: ci sono tutte le 4 combinazioni possibili davanti ai tuoi occhi, allineate verticalmente sotto `String`, `Bool` e `Int`. In un blocco `if / else` tradizionale dovresti leggere 18 righe per essere sicuro di non aver lasciato fuori nessun caso.\n\n---\n\n## 3.3. I tipi di base e un regalo per non contare gli zeri (`_KB`, `_MB`, `_GB`)\n\nI tipi scalari di Ridgun sono diretti e senza sorprese:\n\n| Tipo | Cos'è in realtà | Esempi |\n|---|---|---|\n| `Int` | Intero a 64 bit con segno (`i64`) | `0`, `42`, `-100`, `0xFF00`, `1_000_000` |\n| `U64` | Intero a 64 bit senza segno (`u64`) per crittografia e sistemi | `0xdeadbeefcafe0001`, `a xor b`, `x rotr 24` |\n| `Byte` | Ottetto senza segno (`0..255`) in tensori e buffer binari | `Tensor[Byte * 64]` |\n| `Real` / `Float` | Decimale a doppia precisione (`f64`) | `3.14159`, `0.001`, `-2.5` |\n| `String` | Stringa di testo o buffer binario immutabile con lunghezza esplicita | `\"Ciao\"`, `'percorso\\grezzo'`, `sha256 raw \"abc\"` |\n| `Char` | Codice carattere | Restituito da `str char at` |\n| `Bool` | Booleano classico | `True`, `False` |\n| `()` | Vuoto (*Unit*, quando stampi soltanto o fai I/O) | `()` |\n\n### Operatori a livello di bit da 1 ciclo e flessibilità lessicale (`fn`, `op`, `where`)\nPer la crittografia, i protocolli binari e i sistemi ad alte prestazioni, `Int` e `U64` dispongono di operatori nativi a livello di bit e rotazione compilati in una singola istruzione macchina:\n- **Logici e bit a bit**: `and`, `or`, `xor`, `not`\n- **Scorrimenti e rotazioni a 64 bit**: `shl` (sinistra), `shr` (destra logica senza segno), `rotl` (rotazione a sinistra), `rotr` (rotazione a destra)\n\nInoltre, il vocabolario di Ridgun è deliberatamente minimo e ortogonale:\n- **`where` non è una parola riservata**: i grafi paralleli si esprimono esclusivamente con `||`, perciò `where` è un normale identificatore che puoi usare come nome di variabile o funzione.\n- **`fn` e `op` possono far parte dei nomi**: dopo `fn ::` o `op ::`, le stesse parole `fn` e `op` possono comparire come parte del nome della tua funzione o del tuo operatore (`fn :: op Int => Int`, `op :: Int fn Int => Int`, `op :: A op B => A`).\n- **Ritorni multipli separati da spazi (`=> Int Int`)**: quando una funzione restituisce più valori, la sua uscita si scrive separando i tipi con spazi (`fn :: dividi Int Int => Int Int`), e nella chiamata puoi destrutturarla direttamente senza allocare tuple nell'heap (`quoziente, resto = dividi 17 5`).\n\n### Stanco di scrivere `65536` o `1048576` e pregare di non aver saltato una cifra?\nIn Ridgun i letterali numerici accettano direttamente i suffissi di memoria **`_KB`**, **`_MB`** e **`_GB`** e i suffissi di tempo **`_ms`**, **`_s`** e **`_min`**, oltre ai separatori numerici:\n\n```ridgun\nfn :: dimensione buffer => Int\n      dimensione buffer =  64_KB      -- Il compilatore lo traduce in 65536\n\nfn :: limite file => Int\n      limite file =  16_MB            -- Il compilatore lo traduce in 16777216\n\nfn :: maschera ottetto => Int\n      maschera ottetto =  0xFF_00     -- Esadecimale pulito e leggibile\n```\n\n---\n\n## 3.4. Virgolette doppie (`\"...\"`) vs. Virgolette singole (`'...'`)\n\nIn molti linguaggi le virgolette singole e doppie fanno esattamente la stessa cosa (uno spreco). In Ridgun ciascuna ha una missione chiarissima:\n\n### 1. Virgolette doppie (`\"...\"`): Intelligenti e interpolate\nInterpretano gli escape (`\\n`, `\\t`, `\\\"`, `\\\\`) e **valutano qualsiasi variabile o espressione che metti tra parentesi graffe `{...}`**:\n\n```ridgun\nfn :: riepilogo ordine String Int    Int    => String\n      riepilogo ordine voce   unita  prezzo =\n        \"Hai ordinato {unita}x {voce}. Totale da pagare: {unita * prezzo} euro.\"\n```\n\n*(Trucco: se devi scrivere una parentesi graffa letterale dentro le virgolette doppie — ad esempio generando uno script di shell `\"$\\{VAR:-default\\}\"` o un JSON —, puoi farne l'escape con la barra rovesciata `\\{` e `\\}` o raddoppiarla `{{` e `}}`).*\n\n### 2. Virgolette singole (`'...'`): Grezze e letterali (*Raw Strings*)\nQuello che scrivi tra virgolette singole esce **così com'è**, senza toccare nemmeno una barra rovesciata `\\`, né una parentesi graffa `{}`. Perfetto per quando generi codice in un altro linguaggio, scrivi comandi di shell o lavori con percorsi pieni di barre:\n\n```ridgun\nfn :: comando sed => String\n      comando sed =  's/\\([0-9]+\\)/[\\1]/g'\n```\n\n### La tua cassetta degli attrezzi per le stringhe (`String`)\nUnire stringhe è semplice come sommarle con `+`: `\"Ciao, \" + nome`. E quando hai bisogno di fare chirurgia di precisione su un testo, hai queste funzioni native con spazi naturali pronte senza importare nulla:\n\n- `str len s` $\\rightarrow$ lunghezza di `s`.\n- `str char at s i` $\\rightarrow$ codice numerico (`Int`) del carattere nella posizione `i` (`-1` se esci dai limiti).\n- `str slice s inizio fine` $\\rightarrow$ ritaglia da `inizio` fino a `fine` (senza includere `fine`).\n- `char from code c` $\\rightarrow$ converte un codice numerico (`Int`, es. `10` per `\\n` o `34` per `\"`) in uno `String` di 1 carattere.\n- `str contains s ago` e `str starts with s prefisso` $\\rightarrow$ restituiscono `True` o `False`.\n- `int to str n` e `str to int s` $\\rightarrow$ convertono da numero a testo e viceversa (`str to int` capisce persino `\"0xFF\"`!).\n\n---\n\n## 3.5. Blocchi su più righe, la regola universale dell'`=` e variabili `mut`\n\nQuando una funzione non entra in una sola riga, vai a capo dopo l'`=` e indenti il blocco.\n\nGuarda come si legge un blocco passo dopo passo:\n\n```ridgun\nfn :: calcola fattura Int  Int => Int\n      calcola fattura base iva =\n        imposte = base * iva / 100\n        gestione = 5\n        echo \"Dettaglio -> Base:\" base \"Imposte:\" imposte\n        base + imposte + gestione\n```\n\nQuattro regole d'oro che rendono i blocchi in Ridgun puliti e uniformi:\n1. **Immutabile per impostazione predefinita senza `let` né `const`**: scrivi `imposte = ...` e hai già la tua costante locale immutabile. Se per distrazione provi a sovrascrivere `imposte = 99` più sotto nello stesso blocco, il compilatore ti ferma su due piedi.\n2. **Variabili mutabili esplicite con `mut`**: quando vuoi davvero aggiornare un accumulatore locale passo dopo passo dentro una funzione, lo dichiari con **`mut`** e poi lo riassegni liberamente con `=`:\n   ```ridgun\n   fn :: applica supplementi Int    => Int\n         applica supplementi prezzo =\n           mut totale = prezzo\n           totale = totale + 10\n           totale = totale * 2\n           totale\n   ```\n   *(E se `totale` conserva una lista o una struttura in memoria, la politica **`RMM2`** di Ridgun somma `+1` al nuovo valore prima di scalare `-1` dal vecchio, liberandolo all'istante se nessun altro lo usa).*\n3. **La regola universale dell'`=`**: dietro **qualsiasi `=`** (in una funzione, in un operatore, in una variabile locale `x =` o in un ramo condizionale) puoi mettere sempre una qualsiasi delle tre forme di blocco di Ridgun:\n   - **`(nulla)`**: righe sequenziali indentate (come sopra).\n   - **`|`**: un albero di guardie condizionali.\n   - **`||`**: un grafo di calcoli in parallelo con `->`.\n4. **L'ultima espressione è sempre il risultato**: `base + imposte + gestione` è ciò che restituisce `calcola fattura`. Senza `return`.\n\nNel **Capitolo 04** vedremo come prendere decisioni complesse — inclusi alberi decisionali su più livelli con `|.` — senza scrivere mai un `if/else` né un ciclo `while`: benvenuto nel mondo delle **guardie booleane** e della **ricorsione di coda a costo zero**.\n"}, {"num":"04","slug":"04-pattern-matching-e-guardie","file":"04-pattern-matching-e-guardie.md","title":"Capitolo 04: Addio a `if/else`, addio a `while` (Pattern Matching, Guardie e TCO)","short_title":"Addio a `if/else`, addio a `while` (Pattern Matching, Guardie e TCO)","markdown":"# Capitolo 04: Addio a `if/else`, addio a `while` (Pattern Matching, Guardie e TCO)\n\nQuando racconti a qualcuno che in Ridgun **non esiste la parola chiave `if`, né `else`, né `switch`, né `for`, né `while`**, di solito ti guarda come se gli avessi detto che costruirai una casa senza martello né chiodi:\n\n> *\"Come sarebbe che non c'è `if` né `while`? E come diavolo prendo una decisione o percorro un milione di dati?\"*\n\nBeh, risulta che `if/else` e `while` sono attrezzi piuttosto grezzi ereditati da come funzionavano i salti (`GOTO`) negli anni '50. In Ridgun li sostituiamo con tre pezzi che calzano a pennello:\n1. ***Pattern Matching*** (quando decidi in base alla **forma o al valore esatto** del dato).\n2. **Guardie booleane `|`** (quando decidi in base a una **condizione o a un intervallo**).\n3. **Ricorsione di coda con TCO** (che il compilatore trasforma sotto il cofano in un ciclo `loop` nativo ultraveloce).\n\nVediamoli in azione.\n\n---\n\n## 4.1. *Pattern Matching*: Quando l'argomento ti dà già la risposta\n\nNel capitolo precedente ne abbiamo già visto un assaggio. Invece di ricevere una variabile generica `x` e aprire dentro la funzione cinque `if (x == ...)`, in Ridgun metti i casi direttamente sulla porta d'ingresso della funzione:\n\n```ridgun\nfn :: codice http Int => String\n      codice http 200 =  \"OK: Tutto è andato liscio\"\n      codice http 301 =  \"Spostato permanentemente\"\n      codice http 404 =  \"Non trovato (hai guardato sotto il divano?)\"\n      codice http 500 =  \"Fuoco nel server\"\n      codice http n   =  \"Codice sconosciuto: {n}\"\n```\n\nRidgun prova le righe **dall'alto verso il basso**:\n- Se entra `404`, salta dritto alla terza riga.\n- Se entra `418`, nessuna delle prime quattro righe corrisponde, quindi cade nell'ultima (`n`), che cattura qualsiasi intero e lo chiama `n` affinché tu possa stamparlo.\n- E se nell'ultimo caso non ti importa nemmeno quale numero fosse? Metti un trattino basso `_` (*jolly*) e te ne dimentichi: `codice http _ = \"Altro codice\"`.\n\n---\n\n## 4.2. Guardie booleane (`|`): Il tuo bisturi per intervalli, variabili condizionali e alberi decisionali\n\n*\"Ok, il pattern matching è forte quando cerco il `200` o il `404`. Ma cosa faccio se voglio controllare se `voto >= 6` o se `eta > 18 and eta < 65`? Non scriverò mica 47 righe con tutti i numeri dal 18 al 65!\"*\n\nCerto che no! Per questo ci sono le **guardie (`|`)**.\n\nQuando il risultato dipende da una disuguaglianza o da una combinazione logica, dopo l'`=` della funzione (o di qualsiasi variabile locale) apri una scala di barre verticali `|`:\n\n```ridgun\nvaluta Int  => String\nvaluta voto =\n  | voto < 0   = \"Voto impossibile (punti negativi?)\"\n  | voto < 6   = \"Insufficiente\"\n  | voto < 7   = \"Sufficiente\"\n  | voto < 9   = \"Buono\"\n  | voto <= 10 = \"Ottimo\"\n  | otherwise  = \"Sei uscito dalla scala\"\n```\n\nGuardalo bene:\n- Il segno `=` dell'intestazione (`valuta voto =`) si allinea sotto `=>` proprio come in qualsiasi altra funzione.\n- Sotto si legge dall'alto verso il basso proprio come un tariffario: ogni riga `| condizione = risultato` viene controllata in ordine. Non appena una dà `True`, restituisce quel risultato ed è finita.\n- Alla fine metti **`| otherwise = ...`**, che significa letteralmente *\"in qualsiasi altro caso\"* (la tua rete di sicurezza affinché non rimanga mai un percorso senza ritorno).\n\n### Logica booleana in minuscolo chiaro (`and`, `or`, `xor`, `not`)\nHai notato che molti linguaggi usano `|` per i bit, `||` per i booleani, `!` per negare... e quando leggi una condizione complessa sembra che un gatto abbia camminato sulla tastiera (`if (!a && (b || c))`)?\n\nIn Ridgun, poiché `|` è già il simbolo sacro delle guardie e dei tipi algebrici, e `||` è l'operatore di parallelismo, **gli operatori booleani si scrivono con parole chiare in minuscolo**:\n\n- **`and`**: si verificano entrambe le cose con valutazione a cortocircuito (`eta >= 18 and ha_patente`: se il lato sinistro è `False`, il destro non viene nemmeno valutato).\n- **`or`**: se ne verifica almeno una con valutazione a cortocircuito (`giorno == \"sabato\" or giorno == \"domenica\"`: se il lato sinistro è `True`, il destro non viene valutato).\n- **`xor`**: si verifica l'una o l'altra, ma non entrambe contemporaneamente.\n- **`not`**: inverte il booleano (`not (e vuoto testo)`).\n- **`<`, `>`, `<=`, `>=`**: confrontano sia numeri (`Int`, `Float`) sia stringhe di testo **`String` in ordine lessicografico UTF-8** (`\"alfa\" < \"beta\"`).\n\nGuarda come viene pulito il classico problema degli anni bisestili:\n\n```ridgun\nfn :: e bisestile Int => Bool\n      e bisestile a   =\n        | (a % 400) == 0                  = True\n        | (a % 4) == 0 and (a % 100) != 0 = True\n        | otherwise                       = False\n```\n\nZero simboli criptici. Lo legge qualcuno che non conosce Ridgun e lo capisce al primo colpo.\n\n### Variabili locali condizionali (`x =` + `|`)\nPoiché in Ridgun ogni `=` segue la stessa regola, **puoi usare `|` anche per assegnare una variabile locale** senza dover creare una funzione ausiliaria a parte:\n\n```ridgun\nfn :: prezzo biglietto Int  Bool => Int\n      prezzo biglietto base vip  =\n        sconto =\n          | vip        = 20\n          | base > 100 = 10\n          | otherwise  = 0\n        base - (base * sconto / 100)\n```\n\n### Alberi decisionali annidati e il delimitatore compatto `|.`\n*\"E se dentro un ramo `| cond =` o `| otherwise =` voglio aprire un altro sotto-albero di guardie `|` profondo 3 o 4 livelli e poi tornare a un livello superiore?\"*\n\nPuoi annidare `|` dentro `|` per tutti i livelli che vuoi. E quando un blocco `|` annidato finisce ma sotto continuano altri rami di un livello padre (o altre istruzioni del blocco), metti **`|.`** alla fine della sua ultima riga (`| otherwise = valore |.`) per indicare senza alcuna ambiguità che quel sotto-albero si chiude e torni al livello precedente:\n\n```ridgun\nfn :: instrada richiesta Int    Int   Bool    Bool  Int  Int => Int\n      instrada richiesta metodo ruolo firmata admin kb   lim =\n        | metodo == 0 =\n          | kb == 0   = 204\n          | otherwise = 200 |.\n        | metodo == 1 =\n          | not firmata = 401\n          | otherwise =\n            -- Livello 2: richiesta POST firmata\n            | lim > 0 =\n              -- Livello 3: controllo di rate-limit\n              | admin =\n                -- Livello 4: eccezione per gli amministratori\n                | kb > 10000 = 413\n                | otherwise  = 202 |.\n              | otherwise = 429 |.\n            | kb > 1000 =\n              -- Livello 3: siamo tornati dal Livello 4 grazie a `|.`\n              | ruolo >= 2 and admin = 201\n              | otherwise            = 413 |.\n            | otherwise = 201 |.\n        | otherwise = 405\n```\n\nNota quanto è pulito:\n- In un albero semplice di 1 livello (o alla fine di tutta la funzione) **non serve mai mettere `|.`** (sarebbe rumore inutile).\n- Scrivi `|.` solo quando chiudi un ramo annidato sotto il quale continua un ramo di un livello superiore.\n\n### Blocchi su più righe dentro una guardia (`| cond =` + blocco indentato)\nProprio come dopo l'`=` di una funzione normale puoi aprire un blocco indentato su più righe, **anche dopo l'`=` di qualsiasi guardia `| cond =` o `| otherwise =` puoi andare a capo e aprire un blocco sequenziale**:\n\n```ridgun\nfn :: regola finestra Int Int    => Int\n      regola finestra idx limite =\n        | idx >= limite =\n            tetto = limite - 1\n            scalato = tetto * 2\n            scalato + 10\n        | otherwise =\n            successivo = idx + 1\n            successivo * 2\n```\n\nOgni ramo della guardia ha il proprio blocco locale pulito e la sua ultima riga è il valore restituito da quel ramo.\n\n---\n\n## 4.3. \"Senza `while`? E non esploderà lo stack se percorro un file grande?\"\n\nParliamo dell'elefante nella stanza.\n\nSe vieni da Python, Java o JavaScript, ti hanno insegnato fin da piccolo che *\"la ricorsione è elegante sulla lavagna dell'università, ma nel mondo reale fa traboccare lo stack (`StackOverflowError`) dopo 1.000 giri; usa un ciclo `while`\"*.\n\nQuesto è vero nei linguaggi che **non** ottimizzano le chiamate di coda. Ma in un linguaggio funzionale di sistema come Ridgun, **una ricorsione di coda È un ciclo `while` travestito da funzione pura**.\n\n### Che differenza c'è tra una ricorsione normale e una ricorsione di coda?\nGuarda queste due funzioni che contano alla rovescia da `n` fino a `0` sommando i numeri:\n\n```ridgun\n-- Versione A: Ricorsione NORMALE (lascia lavoro in sospeso per il ritorno)\nfn :: somma lento Int => Int\n      somma lento 0   =  0\n      somma lento n   =  n + (somma lento (n - 1))\n\n-- Versione B: Ricorsione DI CODA (tiene il conto aggiornato in `accumulato`)\nfn :: somma veloce ciclo Int Int        => Int\n      somma veloce ciclo 0   accumulato =  accumulato\n      somma veloce ciclo n   accumulato =  somma veloce ciclo (n - 1) (accumulato + n)\n```\n\n- Nella **Versione A**, prima di poter sommare `n + ...`, la funzione deve aspettare che finisca `somma lento (n - 1)`. Ciò obbliga il computer a salvare `n` nello stack a ogni passo.\n- Nella **Versione B**, la chiamata a `somma veloce ciclo` **è l'ultima cosa che accade nella riga**. Non rimane nulla in sospeso dietro di essa. Le passi già la somma aggiornata in `accumulato + n`.\n\n### Il trucco di magia di `ridgunc` (TCO: *Tail-Call Optimization*)\nQuando `ridgunc` compila `somma veloce ciclo`, vede che la funzione chiama se stessa alla fine della clausola e dice:\n\n> *\"Perché mai dovrei creare un nuovo stack frame se quello attuale non serve più a nulla? Sovrascriverò `n` con `n - 1`, sovrascriverò `accumulato` con `accumulato + n` e salterò all'inizio con un `loop { ... continue; }` nativo.\"*\n\nRisultato:\n1. Puoi chiamare `somma veloce ciclo 100_000_000 0` (cento milioni di giri) e **consumerà esattamente 0 byte extra di stack**.\n2. Va veloce quanto un ciclo `while` scritto a mano in Rust o C, ma senza aver dovuto dichiarare nemmeno una singola variabile mutabile nel tuo codice Ridgun.\n\n---\n\n## 4.4. Il pattern maestro che userai in ogni programma Ridgun\n\nOgni volta che in un altro linguaggio penseresti *\"farò un ciclo `while` con un indice `i` e un accumulatore\"*, in Ridgun scrivi una coppia di funzioni come questa (la funzione principale pulita e il suo aiutante di coda):\n\n```ridgun\nfn :: cerca carattere ciclo String Int Int  Int     => Int\n      cerca carattere ciclo testo  pos fine cercato =\n        | pos >= fine                        = -1\n        | (str char at testo pos) == cercato = pos\n        | otherwise                          = cerca carattere ciclo testo (pos + 1) fine cercato\n\nfn :: cerca carattere String Int     => Int\n      cerca carattere testo  cercato =  cerca carattere ciclo testo 0 (str len testo) cercato\n```\n\nGuarda le tre guardie di `cerca carattere ciclo`:\n1. Sono arrivato alla fine (`pos >= fine`)? Restituisco `-1` (fine del ciclo).\n2. Ho trovato il carattere in `pos`? Restituisco `pos` (fine del ciclo).\n3. Non è questo? Passo al successivo (`pos + 1`) con una chiamata di coda (che il compilatore converte in `continue;`).\n\nPulito, impossibile avere *bug* di variabili globali sovrascritte e veloce come un fulmine.\n\nNel **Capitolo 05** metteremo le mani sulle collezioni di dati: **liste, tuple, funzioni che accettano infiniti argomenti (`...`) e le maschere di sequenze in stile J/APL**.\n"}, {"num":"05","slug":"05-liste-tuple-e-sequenze","file":"05-liste-tuple-e-sequenze.md","title":"Capitolo 05: Liste, Tuple e il trucco ninja delle Sequenze","short_title":"Liste, Tuple e il trucco ninja delle Sequenze","markdown":"# Capitolo 05: Liste, Tuple e il trucco ninja delle Sequenze\n\nUn programma che sposta solo un numero o un testo alla volta serve a poco. Nella vita reale gestisci liste di file, righe di un database, pacchetti di rete o coordinate.\n\nPer questo, Ridgun ti dà tre contenitori diversi, ciascuno pensato per un lavoro ben preciso:\n1. **Liste (`[T]`)**: *\"Ho molti elementi dello stesso tipo (o nessuno) e voglio percorrerli\"*.\n2. **Tuple (`(A, B)`)**: *\"Voglio restituire una coppia o un trio di cose diverse insieme senza creare un nuovo tipo\"*.\n3. **Sequenze e maschere (`s(_ + _)`, `(+ _ _ +)`)**: *\"Voglio filtrare o riordinare argomenti al volo come se avessi un colino matematico\"*.\n\nAndiamo una per una.\n\n---\n\n## 5.1. Liste (`[T]`): Il pane quotidiano\n\nIn Ridgun, se metti le parentesi quadre attorno a un tipo, hai una lista di quel tipo:\n- `[Int]` è una lista di interi: `[10, 20, 30]`.\n- `[String]` è una lista di testi: `[\"mela\", \"pera\"]`.\n- `[]` è la lista vuota (il jolly che combacia con qualsiasi `[T]`).\n\n> *\"Ehi, posso mettere un numero e un testo insieme nella stessa lista tipo `[1, \"due\"]`?\"*\n> Così com'è, **no** (e ringrazia il compilatore per impedirtelo, perché così non ti esploderà mai una somma in produzione trovandosi davanti un testo a sorpresa). Nel Capitolo 06 vedremo come risolvere il caso di `[1, \"due\"]` con totale eleganza usando un Tipo Algebrico (proprio come fa Haskell).\n\n### Come si affetta una lista senza usare indici `i`, `j`, `k`: `[]` e `(x:xs)`\nNei linguaggi imperativi, percorrere una lista di solito implica `for (int i = 0; i < lista.size(); i++)`, con il classico rischio di sforare di uno (*off-by-one*).\n\nIn Ridgun non conti gli indici; **smonti la lista dalla testa**:\n- `[]`: combacia se la lista è vuota.\n- `(x:xs)`: combacia se la lista ha almeno un elemento. Mette il primo elemento in `x` (la **testa**) e il resto della lista in `xs` (la **coda**).\n\nGuarda che piacere sommare una lista o contare quanti elementi ha:\n\n```ridgun\nfn :: somma lista [Int]  => Int\n      somma lista []     =  0\n      somma lista (x:xs) =  x + (somma lista xs)\n\nfn :: conta elementi [A]    => Int\n      conta elementi []     =  0\n      conta elementi (_:xs) =  1 + (conta elementi xs)\n```\n\nE un dettaglio tecnico che ti rallegrerà la giornata: in Ridgun, estrarre la coda `xs` in `(x:xs)` **non copia il resto della lista in memoria**. Internamente è una vista sullo stesso vettore che avanza solo il puntatore di inizio di `1` ($O(1)$ istantaneo).\n\n### Puoi scartare più elementi in un colpo solo\nIl pattern `:` dà tantissima soddisfazione quando stai analizzando comandi o protocolli:\n\n```ridgun\nfn :: interpreta comando [String]                   => String\n      interpreta comando []                         =  \"Non hai scritto nulla\"\n      interpreta comando (\"aiuto\":_)                =  \"Mostrando l'aiuto...\"\n      interpreta comando (\"copia\":origine:dest:[])  =  \"Copiando da {origine} a {dest}\"\n      interpreta comando (cmd:_)                    =  \"Comando sconosciuto: {cmd}\"\n```\n\nGuarda la terza riga: `(\"copia\":origine:dest:[])` controlla in un solo colpo che la lista abbia **esattamente 3 elementi**, che il primo sia `\"copia\"`, e ti lascia il secondo e il terzo serviti su un piatto d'argento in `origine` e `dest`. Prova a scrivere questo in C o Java e vedrai quante righe di `args.length == 3 && args[0].equals(\"copia\")` ti escono.\n\n### Unire liste con i doppi due punti (`::`)\nQuando sei sul lato destro dell'`=` (in un'espressione) e vuoi incollare due liste, usi **`::`**:\n\n```ridgun\nfn :: incolla liste [Int] [Int] => [Int]\n      incolla liste a     b     =  a :: b\n\nfn :: aggiungi dietro [Int] Int => [Int]\n      aggiungi dietro xs    x   =  xs :: [x]\n```\n\n*(Regola mnemonica veloce: un solo `:` nei pattern smonta la lista; due `::` nelle espressioni incollano due liste).*\n\nE se vuoi davvero prendere l'elemento numero 5 direttamente senza percorrere nulla? Usa le parentesi quadre attaccate al nome: `mia_lista[5]`.\n\n---\n\n## 5.2. Funzioni variadiche (`T...`): \"Passamene tutti quelli che vuoi!\"\n\nA volte vuoi che chi chiama la tua funzione possa scrivere comodamente `somma vari 4 19 2 88 7`, senza obbligarlo a racchiudere i numeri tra parentesi quadre `[4, 19, 2, 88, 7]`.\n\nMetti tre punti **`...`** dietro l'ultimo tipo della tua firma, e dentro la tua funzione lo riceverai automaticamente impacchettato come una lista:\n\n```ridgun\nfn :: somma vari Int... => Int\n      somma vari nums   =  somma lista nums\n\nfn :: main => ()\n      main =\n        echo (somma vari 10 20 30)       -- Stampa 60\n        echo (somma vari 1 2 3 4 5 6 7)  -- Stampa 28\n```\n\n---\n\n## 5.3. Tuple e l'Unificazione delle Firme con Spazi (`Int Int [String String] String`)\n\nIn molti linguaggi restituire due o più cose da una funzione è una sofferenza: o crei una sciocca classe ausiliaria `RisultatoConPosizione`, o riempi la firma di parentesi e virgole ridondanti.\n\nIn Ridgun, **una lista di argomenti `Int String Int` e una tupla `(Int, String, Int)` sono concettualmente la stessa cosa: una sequenza tipizzata (`seq`)**. Per questo, nelle firme dei tipi puoi separare gli elementi di una tupla semplicemente con **spazi**, sia dopo `=>`, sia dentro le liste `[...]` e dentro le parentesi `(...)`:\n\n```ridgun\n-- Due interi di ritorno separati da spazio:\nfn :: dividi e resto Int Int => Int Int\n      dividi e resto a   b   =  (a / b, a % b)\n\n-- Firma complessa senza rumore di virgole né parentesi esterne:\nfn :: analizza intestazione String => Int Int [String String] String\n      analizza intestazione tag    =  (200, 2, [(\"Host\", \"ridgun.org\"), (\"X-Tag\", tag)], \"OK\")\n\n-- Lista di tuple [String String] come parametro di ingresso:\nfn :: cerca intestazione [String String] String => String\n      cerca intestazione []              _      =  \"non trovata\"\n      cerca intestazione ((k, v):resto)  chiave\n        | k == chiave = v\n        | otherwise   = cerca intestazione resto chiave\n```\n\nNota l'eleganza di `=> Int Int [String String] String`:\n- Dopo `=>`, `Int Int [String String] String` significa esattamente la stessa cosa di `(Int, Int, [(String, String)], String)`.\n- Dentro le parentesi quadre, `[String String]` significa una lista di coppie di testi `[(String, String)]`.\n- Dentro le parentesi tonde (quando passi una tupla come un unico parametro di ingresso), `(Int String)` significa esattamente la stessa cosa di `(Int, String)`:\n  ```ridgun\n  fn :: spiega divisione (Int Int)          => String\n        spiega divisione (quoziente, resto) =  \"Ci sta {quoziente} volte e avanzano {resto}\"\n  ```\n- **Perché questo non crea alcuna ambiguità in Ridgun?** Perché a differenza di Haskell (dove `Maybe Int` applica un costruttore di tipi per giustapposizione), in Ridgun i tipi parametrizzati usano parentesi esplicite come `Tensor(Float, 3, 3)` e le liste usano `[T]`. Così, due tipi separati da spazio (`T1 T2`) significano sempre e senza eccezioni una sequenza/tupla di tipi, mantenendo la compatibilità al 100% con la sintassi con le virgole.\n\n### Il dettaglio di punta: Spacchettamento automatico tra funzioni\nSupponiamo che tu abbia `dividi e resto` (che restituisce `Int Int`) e un'altra funzione `somma coppia Int Int => Int` (che si aspetta 2 interi). In Ridgun puoi collegare una funzione dentro l'altra direttamente:\n\n```ridgun\nfn :: somma coppia Int Int => Int\n      somma coppia x   y   =  x + y\n\nfn :: main => ()\n      main =\n        -- dividi e resto 17 5 restituisce (3, 2), e somma coppia riceve 3 e 2 direttamente:\n        echo (somma coppia (dividi e resto 17 5))  -- Stampa 5\n```\n\n---\n\n## 5.4. Il trucco ninja: Sequenze e Maschere Posizionali (`s(_ + _)`, `(+ _ _ +)`)\n\nEcco uno dei gioielli più originali di Ridgun, ereditato direttamente dai linguaggi vettoriali come J e APL.\n\nImmagina di ricevere una sfilza di argomenti con il pattern di sequenza **`(s)`** e di volerne tenere solo alcuni e scartare gli altri senza dichiarare cinque variabili con nomi inventati (`_a`, `b`, `_c`, `d`...).\n\nApplichi a `s` una **maschera di tupla con `+` (tienilo) e `_` (scartalo)**:\n\n- **`s(_ + _)`**: su 3 elementi, scarta il primo (`_`), tieni il secondo (`+`) e scarta il terzo (`_`).\n- **`s(+ _ +)`**: tieni il primo e il terzo; restituisce la sequenza con quei due.\n- **`s(_ _ +...)`**: scarta i primi due (`_ _`) e applica `+...` **a tutti gli altri che vengono dietro**, quanti che siano.\n\nGuardalo in funzione:\n\n```ridgun\nfn :: quello in mezzo Int Int Int => Int\n      quello in mezzo (s)         =  s(_ + _)\n\nfn :: scarta primi due Int... => [Int]\n      scarta primi due (s)    =  s(_ _ +...)\n\nfn :: main => ()\n      main =\n        echo (quello in mezzo 100 42 999)         -- Stampa 42\n        echo (scarta primi due 1 2 10 20 30)      -- Stampa [10, 20, 30]\n```\n\nAncora meglio: puoi posizionare una maschera **`(+ _ _ +)`** come una tappa intermedia all'interno di una pipeline **`->`** (`FR-COMP-014`). Quando una funzione o un operatore restituisce una tupla di più valori, la maschera filtra quali posizioni conservi (`+`) e quali scarti (`_`), e gli elementi selezionati vengono spacchettati automaticamente come argomenti della funzione successiva della pipeline:\n\n```ridgun\nfn :: analizza pacchetto String => Int Int String String\n      analizza pacchetto ver    =  (200, 4, ver, \"OK\")\n\nfn :: combina codice Int  String => String\n      combina codice code msg    =  \"{code}:{msg}\"\n\nfn :: main => ()\n      main =\n        -- Da (200, 4, \"v0.9.9\", \"OK\"), (+ _ _ +) seleziona il 1.º (200) e il 4.º (\"OK\")\n        -- e li passa come i 2 argomenti di `combina codice`:\n        analizza pacchetto \"v0.9.9\" -> (+ _ _ +) -> combina codice -> riepilogo\n        echo riepilogo  -- Stampa 200:OK\n```\n\nInoltre, se usi l'operatore virgola `,` fuori dalle parentesi (`lista1 , lista2`), Ridgun appiattisce entrambe le collezioni in un'unica sequenza continua.\n\nNel **Capitolo 06** faremo il passo che trasforma un programmatore funzionale in un architetto di prim'ordine: **creare i tuoi Tipi di Dati Algebrici (ADT), scrivere funzioni polimorfiche con `A`..`Z` e fabbricare i tuoi operatori su misura**.\n"}, {"num":"06","slug":"06-tipi-algebrici-e-polimorfismo","file":"06-tipi-algebrici-e-polimorfismo.md","title":"Capitolo 06: Tipi di Dati Algebrici (ADT), Polimorfismo e perché qui non vogliamo `null` né `Any`","short_title":"Tipi di Dati Algebrici (ADT), Polimorfismo e perché qui non vogliamo `null` né `Any`","markdown":"# Capitolo 06: Tipi di Dati Algebrici (ADT), Polimorfismo e perché qui non vogliamo `null` né `Any`\n\nNel 1965, Tony Hoare inventò il riferimento nullo (`null` / `nil`). Quarant'anni dopo chiese pubblicamente scusa e lo definì *\"il mio errore da un miliardo di dollari\"*.\n\nPerché? Perché nei linguaggi con `null`, una funzione ti promette nella sua firma che ti restituirà un `Utente`... e quando meno te lo aspetti ti restituisce `null` e ti butta giù il server alle tre del mattino.\n\nE altrettanto succede con l'ereditarietà degli oggetti e il tipo `Any` (o `Object`): metti un numero e un testo in una lista `[1, \"due\"]`, il linguaggio alza le spalle e dice *\"va bene, allora adesso questa è una `List[Any]`, buona fortuna a indovinare cosa c'è dentro quando la percorrerai\"*.\n\nIn Ridgun tagliamo entrambi i problemi alla radice con i **Tipi di Dati Algebrici (ADT)** e il **Polimorfismo Parametrico**. Suona come il nome di un esame tosto, ma in cinque minuti vedrai che è il modo più naturale del mondo per modellare i dati.\n\n---\n\n## 6.1. Tipi Prodotto (Record): I tuoi soliti `struct`, ma con i superpoteri\n\nQuando vuoi raggruppare diversi dati che appartengono a una stessa entità (ad esempio, un server con il suo nome, il suo IP e la sua porta), definisci un **`type`** con i suoi campi:\n\n```ridgun\ntype Server = host: String, porta: Int, tls_attivo: Bool\n```\n\nScrivendo solo quella riga, Ridgun ti regala **quattro cose** automaticamente:\n\n### 1. Il costruttore `Server`\n```ridgun\nfn :: mio nodo => Server\n      mio nodo =  Server \"api.esempio.it\" 443 True\n```\n\n### 2. Una funzione *getter* pura per ogni campo (`host`, `porta`, `tls_attivo`)\nNon devi scrivere `s.getHost()` né nulla di simile; ogni nome di campo è direttamente una funzione che estrae quel dato:\n\n```ridgun\nfn :: url connessione Server => String\n      url connessione srv    =  \"Connettere a \" + (host srv) + \" sulla porta {porta srv}\"\n```\n\n### 3. Aggiornamento funzionale dei record (`with campo: valore`)\nImmagina un record di configurazione con 12 o 15 campi (come le opzioni di un comando `ls` o di un server web) e vuoi cambiare solo uno o due campi senza toccare il resto. Invece di ricostruire il record passando i 15 campi a mano, usi **`with`** e i due punti **`:`** (esattamente come nella definizione del `type`):\n\n```ridgun\nfn :: attiva modalita dev Server => Server\n      attiva modalita dev srv    =  srv with porta: 8080, tls_attivo: False\n```\n\nIl meglio dei due mondi:\n- Nel tuo codice è **100% immutabile e sicuro** (il compilatore controlla che `porta` e `tls_attivo` esistano in `Server` e abbiano il tipo corretto).\n- Sotto il cofano, se `srv` non è condiviso con nessun altro, l'eseguibile nativo riutilizza la sua memoria *in-place* (`Arc::try_unwrap`) senza copiare il resto dei campi.\n\n### 4. *Pattern matching* completo se vuoi aprire il record da cima a fondo\n```ridgun\nfn :: e porta sicura Server             => Bool\n      e porta sicura (Server _ 443 True) =  True\n      e porta sicura _                   =  False\n```\n\n---\n\n## 6.2. Tipi Somma (Varianti con `|`): Come mandare in pensione `null`, le eccezioni e l'ereditarietà\n\nOra viene il bello.\nUn record normale ha `host` **E** `porta` **E** `tls_attivo`.\nMa nel mondo reale molte volte hai bisogno di dire: *\"Un metodo di pagamento è **O** una carta con il suo numero, **O** un bonifico con il suo IBAN, **O** contanti (che non portano alcun dato extra)\"*.\n\nNella programmazione orientata agli oggetti dovresti creare un'interfaccia `MetodoPagamento`, tre sottoclassi in tre file diversi, costruttori, `instanceof`... In Ridgun è **una riga**:\n\n```ridgun\ntype MetodoPagamento = Carta String Int | Bonifico String | Contanti\n```\n\nE guarda cosa succede quando elabori un `MetodoPagamento` in una funzione:\n\n```ridgun\nfn :: descrivi pagamento MetodoPagamento => String\n      descrivi pagamento (Carta num _)   =  \"Pagamento con carta che termina con {num}\"\n      descrivi pagamento (Bonifico iban) =  \"Bonifico dal conto {iban}\"\n      descrivi pagamento Contanti        =  \"Pagamento in contanti allo sportello\"\n```\n\nOgni variante (`Carta`, `Bonifico`, `Contanti`) porta attaccati unicamente i dati che hanno senso per lei. È **impossibile** costruire un pagamento in `Contanti` che abbia un `iban` appeso per errore.\n\n---\n\n## 6.3. \"E come metto `[1, \"due\"]` in una lista senza usare `Any`?\"\n\nTorniamo alla domanda da un milione di dollari. Immagina di leggere un file CSV o JSON in cui una cella può essere un numero intero, un testo o essere vuota.\n\nSe avessi un tipo `Any`, metteresti `[1, \"due\"]` e perderesti tutto l'aiuto del compilatore: da quel momento in poi qualsiasi operazione sulla lista sarebbe camminare bendati.\n\nIn Ridgun (proprio come in Haskell o Rust), crei in due secondi un tipo somma che spiega esattamente quali cose possono vivere dentro quella lista:\n\n```ridgun\ntype ValoreCella = Intero Int | Testo String | Vuoto\n\nfn :: formatta cella ValoreCella => String\n      formatta cella (Intero n)  =  \"Numero: {n}\"\n      formatta cella (Testo s)   =  \"Testo: {s}\"\n      formatta cella Vuoto       =  \"(vuoto)\"\n\nfn :: mia riga => [ValoreCella]\n      mia riga =  [Intero 1, Testo \"due\", Vuoto]\n```\n\nVedi la differenza?\n- Con `Any`, il compilatore non sa se nella lista ci sono interi, stringhe o una caffettiera collegata via USB.\n- Con `[ValoreCella]`, puoi mescolare numeri e testi nella stessa lista, **ma il compilatore sa al 100% che esistono solo quelle tre possibilità** e ti obbliga a spacchettare ogni caso (`Intero n`, `Testo s`, `Vuoto`) prima di usarlo. Sicurezza totale senza perdere nemmeno un briciolo di flessibilità.\n\n---\n\n## 6.4. `Option` e `Result`: Quando qualcosa può non esserci o può fallire\n\nPoiché in Ridgun non esiste `null` né esistono eccezioni che saltano per aria (`throw new Exception()`), il linguaggio porta integrati due tipi somma universali:\n\n1. **`Option`**: o hai **`Some valore`**, o hai **`None`** (niente).\n2. **`Result`**: o l'operazione è andata bene (**`Ok valore`**), o è fallita per un motivo preciso (**`Err errore`**).\n\n```ridgun\nfn :: cerca divisione Int Int => Result\n      cerca divisione _   0   =  Err \"Ehi! Non si può dividere per zero\"\n      cerca divisione a   b   =  Ok (a / b)\n\nfn :: stampa ris Result    => ()\n      stampa ris (Ok n)    =  echo \"Il risultato è {n}\"\n      stampa ris (Err msg) =  echo \"Errore controllato: {msg}\"\n```\n\nNessuno può ignorare un errore per distrazione perché lo stesso tipo `Result` ti obbliga a guardare se dentro c'è un `Ok` o un `Err`.\n\n---\n\n## 6.5. Polimorfismo Parametrico: Funzioni generiche con `A`, `B`, `T`...\n\nSupponi di scrivere una funzione che inverte una coppia `(x, y)` o che estrae il primo elemento di una lista. Importa davvero se la lista è di `Int`, di `String` o di `Server`? Proprio per niente! L'algoritmo è identico.\n\nIn Ridgun, **qualsiasi lettera maiuscola singola (`A`..`Z`)** in una firma dei tipi funziona automaticamente come un **tipo jolly polimorfico (variabile di tipo)**:\n\n```ridgun\nfn :: testa sicura [A]   A           => A\n      testa sicura []    predefinito =  predefinito\n      testa sicura (x:_) _           =  x\n\nfn :: gira coppia (A B)  => B A\n      gira coppia (x, y) =  (y, x)\n```\n\nNota la magia di `testa sicura [A] A => A` e `gira coppia (A B) => B A`:\n- Non è un `Any` incontrollato: dice che **il tipo della lista `[A]`, il tipo del valore `predefinito` (`A`) e il tipo restituito (`A`) devono essere lo stesso**.\n- Se chiami `testa sicura [10, 20] 0`, il compilatore tira le somme (`A = Int`) e ti restituisce un `Int`.\n- Se chiami `testa sicura [\"a\", \"b\"] \"nessuno\"`, tira le somme (`A = String`) e ti restituisce uno `String`.\n- Ma se provi a barare e chiami `testa sicura [10, 20] \"nessuno\"`, zac! Il compilatore ti ferma su due piedi perché il primo argomento dice che `A` è `Int` e il secondo dice che `A` è `String`.\n\n---\n\n## 6.6. Crea i tuoi operatori (`op ::`): Dai vettori alle frasi su misura\n\nPerché solo i numeri nativi dovrebbero avere il diritto di usare `+` o `*`? E perché accontentarsi dei soliti operatori quando puoi inventare la sintassi perfetta per il tuo problema?\n\nCon **`op ::`** (o direttamente senza prefisso se usi pattern di operatore) puoi fare due prodezze:\n\n### 1. Insegnare a `+`, `-`, `*`, `/`, `%` a operare con i tuoi tipi\n```ridgun\ntype Complesso = reale: Int, immag: Int\n\nop :: Complesso + Complesso => Complesso\n      a         + b         =  Complesso ((reale a) + (reale b)) ((immag a) + (immag b))\n```\n\n### 2. Creare operatori *Mixfix* (che si leggono come frasi naturali, inclusi `type` e `with`)\nIn una firma di operatore, **le parole con iniziale maiuscola (`Int`, `String`, `A`..`Z`) o tra parentesi quadre/tonde (`[Int]`, `(A, B)`) sono gli slot per gli argomenti**, e **le parole in minuscolo fanno parte della frase dell'operatore** (incluse parole comunissime come `type` o `with`, che in Ridgun sono contestuali e non ti bloccano mai):\n\n```ridgun\nop :: se Bool allora A altrimenti A => A\n      se True allora v altrimenti _ =  v\n      se False allora _ altrimenti f = f\n\nop :: format String type String with Int => String\n      format label  type kind   with w   =  \"{label} ({kind}, width={w})\"\n\nmain => ()\nmain =\n  messaggio = se (10 > 5) allora \"Vince il dieci!\" altrimenti \"Impossibile\"\n  echo messaggio\n  echo (format \"panel\" type \"bordered\" with 80)\n```\n\nTi sei appena costruito il tuo operatore ternario polimorfico e un DSL di formattazione in **3 righe** di Ridgun.\n\n---\n\n## 6.7. Costruttori condivisi, varianti di tipo diretto, `expand type` e spazi naturali in `fn ::`\n\nRidgun porta i tipi algebrici e le funzioni un passo oltre in espressività ed estensibilità:\n\n1. **Costruttori condivisi tra diversi `type`**: Più tipi somma possono riutilizzare lo stesso nome di costruttore (`Error`, `Var`, `Lit`) con uguale o diversa arità; il verificatore dei tipi li distingue in base alla colonna della firma.\n2. **Varianti con nome di tipo diretto (`type Something = String | Int | MyStruct Float Int`)**: Quando una variante è un tipo primitivo (`String`, `Int`, `Float`/`Real`, `Bool`, `Char`), non hai bisogno di ripetere `Int Int` né `St
