 Amb **`@`**, els subíndexs repetits en tots els operands (`k`) es contrauen (es sumen) i els únics (`i`, `j`) sobreviuen al tensor resultat.\n   - Amb **`+`, `-`, `*`, `/`**, els subíndexs alineen dimensions i fan *broadcasting* automàtic (`a_ij * b_j` multiplica cada fila `i` d'`a` pel vector `b_j` sense necessitat d'escriure `unsqueeze` ni `reshape`).\n3. **Mutació *in-place* per a algorismes numèrics**:\n   ```ridgun\n   crear_matriu_identitat => Tensor\n   crear_matriu_identitat =\n     m = Tensor [[1.0, 0.0], [0.0, 1.0]]\n     m[0, 1] = 0.5\n     m\n   ```\n\n---\n\n## 8.4. Variables de Context (`context ::`) i Estat Compartit Atòmic (`shared ::`)\n\nEn el 99% del teu codi passaràs dades per paràmetre. Però per a aquell 1% on necessites configuració d'entorn o un comptador global entre fils sense contaminar 40 signatures intermèdies, Ridgun ofereix dos mecanismes explícits i segurs:\n\n### 1. `context ::` — Àmbit dinàmic aïllat per tasca (`with ... = ... do`)\n```ridgun\ncontext :: ruta_log : String = \"/var/log/app.log\"\n\nregistrar_esdeveniment String => ()\nregistrar_esdeveniment msg    =  echo \"[{ruta_log}] {msg}\"\n\nmain => ()\nmain =\n  registrar_esdeveniment \"Arrencada normal\"\n  with ruta_log = \"/tmp/test.log\" do\n    registrar_esdeveniment \"Dins del test aïllat\"\n```\n\n### 2. `shared ::` i `atomic` — Estat concurrent amb bloqueig atòmic per línia\n```ridgun\nshared :: peticions_totals : Int = 0\n\ncomptabilitzar_visita => Int\ncomptabilitzar_visita =\n  atomic peticions_totals = peticions_totals + 1\n  peticions_totals\n```\n\n---\n\n## 8.5. Accés a Maquinari (`hardware ::`) i Primitives POSIX de Sistemes\n\nEl mateix compilador `ridgunc`, el gestor `stable` i utilitats de sistemes Unix estan escrits en Ridgun. Per a això, el llenguatge inclou blocs de registres mapejats en memòria (`hardware ::`) i primitives POSIX directes:\n\n```ridgun\nhardware :: UART0 @ 0x1000_0000\n  tx_data : Int @ 0x00\n  status  : Int @ 0x04\n```\n\nI per treballar amb el sistema operatiu:\n\n| Primitiva | Signatura | Què fa |\n|---|---|---|\n| `cli_args` | `=> [String]` | Arguments de línia d'ordres (`argv`). |\n| `read_file` / `write_file` | `String => String` / `String String => ()` | Lectura i escriptura íntegra de fitxers en disc. |\n| `read_bytes` / `write_bytes` | `String => [Int]` / `String [Int] => ()` | Lectura i escriptura binària exacta byte a byte (`0..255`). |\n| `list_dir` / `file_lstat` | `String => [String]` / `String => ...` | Llistat de directoris i inspecció de metadades POSIX (`lstat`). |\n| `sha256_file` / `sha256_str` | `String => String` | Resum criptogràfic SHA-256 natiu. |\n| `sys_exec` / `shell_exec` | `... => Int` | Execució de processos del sistema operatiu. |\n| `sys_getcwd` / `sys_chdir` | `=> String` / `String => Int` | Consultar o canviar el directori de treball. |\n| `sys_getenv` / `sys_setenv` | `String => String` / `String String => Int` | Variables d'entorn del procés. |\n| `sys_getuid` / `sys_getgid` | `=> Int` | UID i GID reals del procés (`doas`, eines de seguretat). |\n| `sys_exit` | `Int => ()` | Acabar el procés amb codi de sortida. |\n\n---\n\n## 8.6. Cas d'Estudi Real: Construint `rg-wc`, una utilitat Unix paral·lela\n\nUnirem tot el que hem après des del Capítol 01 fins aquí en un programa real de sistemes: una versió paral·lela de l'eina Unix `wc` (comptador de línies i bytes per a múltiples fitxers) escrita en Ridgun pur:\n\n```ridgun\n-- 1. Modelem les mètriques d'un fitxer amb un registre ADT (Capítol 06)\ntype Metriques = fitxer: String, linies: Int, bytes: Int\n\n-- 2. Comptem salts de línia (codi ASCII 10) amb recursió de cua TCO (Capítol 04)\nfn :: comptar_salts String Int Int Int  => Int\n      comptar_salts text   pos fi  acum =\n        | pos >= fi                    = acum\n        | (str_char_at text pos) == 10 = comptar_salts text (pos + 1) fi (acum + 1)\n        | otherwise                    = comptar_salts text (pos + 1) fi acum\n\nfn :: nombre_de_linies String => Int\n      nombre_de_linies text   =  comptar_salts text 0 (str_len text) 0\n\n-- 3. Analitzem un fitxer i retornem la seva estructura Metriques\nfn :: analitzar_fitxer String => Metriques\n      analitzar_fitxer ruta   =\n        contingut = read_file ruta\n        || nombre_de_linies contingut -> n_linies\n        || str_len contingut          -> n_bytes ||.\n        Metriques ruta n_linies n_bytes\n\n-- 4. Formatem cada fila i sumem totals amb `fold` i `||` (Capítol 07)\nfn :: formatar_metrica Metriques => String\n      formatar_metrica m         =  \"{linies m}\\t{bytes m}\\t{fitxer m}\"\n\nfn :: sumar_linies Int Metriques => Int\n      sumar_linies acc m         =  acc + (linies m)\n\nfn :: sumar_bytes Int Metriques => Int\n      sumar_bytes acc m         =  acc + (bytes m)\n\nfn :: generar_informe [String] => String\n      generar_informe rutes    =\n        metriques = ||map analitzar_fitxer rutes\n        || map formatar_metrica metriques -> files\n        || fold sumar_linies 0 metriques  -> total_l\n        || fold sumar_bytes 0 metriques   -> total_b ||.\n        \"{files}\\nTotal: {total_l} línies, {total_b} bytes\"\n\nfn :: main => ()\n      main =\n        echo (generar_informe [\"README.md\", \"AGENTS.md\"])\n```\n\nAtura't un segon a mirar aquestes ~40 línies de codi:\n- No hi ha ni un sol `null`, ni una excepció descontrolada, ni un `Mutex`.\n- `comptar_salts` es compila a un `loop` natiu amb 0 bytes de pila gràcies al TCO automàtic.\n- `||map analitzar_fitxer rutes` processa els fitxers en paral·lel en tots els nuclis de la teva CPU, i el bloc `||` calcula simultàniament les files formatades, el total de línies i el total de bytes.\n- La memòria temporal s'allibera determinísticament mitjançant **`RMM1`/`RMM2`**.\n- I quan executes `ridgunc build rg_wc.rg -o rg-wc`, obtens un binari natiu autònom de ~350 KB a punt per copiar a `/usr/local/bin`.\n\n---\n\n## 8.7. Full de Ruta Final: Les 10 Regles d'Or del Programador Ridgun\n\n1. **Escriu sempre primer el contracte (`=>`) i després les equacions (`=`):** pensar en els tipus primer fa que el compilador treballi per a tu.\n2. **Deixa que `stable format` maqueti les teves taules:** escriu amb un espai i deixa que l'eina alineï columnes, `=>`, `=` i `->`.\n3. **Recorda la regla universal de l'`=`:** darrere de qualsevol `=` pots obrir un bloc seqüencial, un arbre de guardes `|` o un graf paral·lel `||`.\n4. **Fes servir `|.` i `||.` només quan tanquis un bloc imbricat per tornar a un nivell superior:** mantén els arbres de decisió profunds compactes i sense ambigüitat.\n5. **Immutable per defecte (`x = ...`), mutable explícit (`mut x = ...`):** fes servir `mut` únicament quan un acumulador local ho demani de debò.\n6. **Fes servir operadors booleans clars en minúscules (`and`, `or`, `xor`, `not`) i tanca sempre les teves guardes amb `| otherwise =`.**\n7. **Modela el teu domini amb ADTs (`type`):** fes servir registres amb `with camp: valor` i tipus suma (`Option`, `Result`) en lloc de `null`.\n8. **Paral·lelitza declarant dependències amb `|| expr -> var` i `||map` / `||filter`:** deixa que el compilador verifiqui que no hi ha cicles i reparteixi la feina entre els nuclis.\n9. **Posa dimensions simbòliques als teus Tensors (`Tensor[N, K]`) i subíndexs a les teves contraccions (`a_ik @ b_kj`).**\n10. **Confia en `RMM` (`RMM1`/`RMM2`), afita entrades externes amb `with region` i verifica sempre amb `stable check` i `stable test`.**\n\nBon viatge programant en Ridgun!\n"}];
    const UI_STRINGS = {"copy_label": "Copia", "copied_label": "Copiat!", "prev_label": "&larr; Capítol anterior", "next_label": "Capítol següent &rarr;", "search_hits_label": "Resultats per a", "search_empty_label": "No s'han trobat coincidències per a"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        // Strings
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        // Keywords
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|do|global|context|shared|atomic|hardware|echo|and|or|xor|not)\b/g, '<span class="rg-kw">$1</span>');
        // Types & constructors
        html = html.replace(/\b(Int|Real|String|Char|Bool|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        // Operators
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        // Numbers & byte units
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      out = out.replace(/\$1024\^2\$/g, "1024<sup>2</sup>");
      out = out.replace(/\$1024\^3\$/g, "1024<sup>3</sup>");
      out = out.replace(/\$1024\$/g, "1024");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        // Fenced code block
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++; // skip closing ```
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        // Horizontal rule
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        // Headings
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        // Table
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        // Blockquote
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        // Unordered list
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        // Ordered list
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        // Empty line
        if (!line.trim()) {
          i++;
          continue;
        }
        // Paragraph
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    // Initial load from URL hash if present
    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
</body>
</html>
