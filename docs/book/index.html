n un bucle `loop { ... continue; }` de máquina**, mutando los registros en el sitio con **consumo de pila $O(1)$ (cero bytes extra por iteración)**.\n3. **Optimización AOT con LTO completo (`lto=fat`, `panic=abort`, `strip=symbols`):**\n   El backend nativo enlaza con optimización global de tiempo de enlace (*Link-Time Optimization*), elimina tablas de *unwinding* innecesarias y limpia los símbolos DWARF de depuración, dejando únicamente código máquina puro y compacto.\n\n---\n\n## 8.6 Caso de Estudio Real: Construyendo `rg-wc`, una utilidad Unix paralela\n\nVamos a unir todo lo que has aprendido desde el Capítulo 1 hasta aquí en un programa real de sistemas: una versión moderna de la herramienta Unix `wc` (contador de líneas, palabras y bytes para múltiples archivos) que:\n\n1. Usa **ADTs** para modelar el resultado de cada archivo.\n2. Usa **guardas y *pattern matching*** para validar los argumentos de CLI.\n3. Usa un **bloque `region`** para limpiar la memoria temporal al analizar cada archivo.\n4. Usa un **bloque `where`** para procesar los resúmenes de forma declarativa y limpia.\n\n```ridgun\nmodule main\n\n-- 1. Modelamos las métricas de un archivo con un ADT (Capítulo 6)\ntype Metricas = Metricas\n  archivo :: Str\n  lineas  :: Int\n  bytes   :: Int\n\n-- 2. Función pura para contar saltos de línea con recursión de cola (Capítulos 4 y 8.5)\nfn :: contar_saltos Str Int Int Int => Int\ncontar_saltos texto pos limite acum\n  | pos >= limite                      = acum\n  | str_char_at texto pos == \"\\n\"      = contar_saltos texto (pos + 1) limite (acum + 1)\n  | otherwise                          = contar_saltos texto (pos + 1) limite acum\n\nfn :: numero_de_lineas Str => Int\nnumero_de_lineas texto = contar_saltos texto 0 (str_len texto) 0\n\n-- 3. Analizamos un archivo dentro de una región léxica temporal (Capítulo 8.1)\nfn :: analizar_archivo Str => Metricas\nanalizar_archivo ruta\n  | not (fs_exists ruta) = Metricas ruta 0 0\n  | otherwise =\n    region r_archivo\n      contenido = fs_read ruta\n      n_lineas  = numero_de_lineas contenido\n      n_bytes   = str_len contenido\n      Metricas ruta n_lineas n_bytes\n\n-- 4. Formateamos una fila del informe con interpolación (Capítulo 5)\nfn :: formatear_metrica Metricas => Str\nformatear_metrica (Metricas ruta lin byt) =\n  \"{lin}\\t{byt}\\t{ruta}\"\n\n-- 5. Sumamos totales usando fold (Capítulo 7)\nfn :: sumar_lineas Int Metricas => Int\nsumar_lineas acc (Metricas _ lin _) = acc + lin\n\nfn :: sumar_bytes Int Metricas => Int\nsumar_bytes acc (Metricas _ _ byt) = acc + byt\n\n-- 6. Procesamos la lista de archivos usando un grafo where (Capítulo 7)\nfn :: generar_informe [Str] => Str\ngenerar_informe rutas = \"{cuerpo}\\n{totales_lineas}\\t{totales_bytes}\\ttotal\"\n  where\n    metricas       = map analizar_archivo rutas\n    filas          = map formatear_metrica metricas\n    cuerpo         = str_join filas \"\\n\"\n    totales_lineas = fold sumar_lineas 0 metricas\n    totales_bytes  = fold sumar_bytes 0 metricas\n\n-- 7. Punto de entrada del sistema\nfn :: main => ()\nmain =\n  args = cli_args ()\n  if length args <= 1\n    eprint \"Uso: rg-wc <archivo1> [archivo2 ...]\"\n    sys_exit 1\n  else\n    rutas = drop 1 args\n    print (generar_informe rutas)\n```\n\nPárate un segundo a mirar esas ~55 líneas de código.\n\n* No hay ni un solo `null`, ni una excepción no controlada, ni una variable mutable global.\n* El bucle `contar_saltos` se compila a un `loop` nativo con 0 bytes de gasto de pila gracias al TCO automático.\n* En `generar_informe`, el bloque `where` descubre solo que `cuerpo`, `totales_lineas` y `totales_bytes` dependen de `metricas`, pero son independientes entre sí.\n* Cada archivo se lee y procesa dentro de su propia `region r_archivo`.\n* Y cuando ejecutas `ridgunc build main.rg -o rg-wc`, obtienes un binario nativo autónomo de unos ~370 KB listo para copiar a `/usr/local/bin`.\n\n---\n\n## 8.7 Hoja de Ruta Final: Las 10 Reglas de Oro del Programador Ridgun\n\nHas llegado al final del libro. Si quieres tener una chuleta mental (o impresa junto al monitor) con la esencia de todo lo que hemos recorrido desde el Capítulo 00, aquí tienes los **10 mandamientos del buen código Ridgun**:\n\n1. **Toda función lleva su pasaporte (`fn ::`):** escribe siempre primero el contrato de tipos y después las ecuaciones. Te ayudará a pensar antes de picar código y el compilador será tu mejor copiloto.\n2. **Alinea tus `=` y tus `|`:** deja que `stable format` (o `ridgun-mode` en Emacs) mantenga tus ecuaciones y guardas como una tabla limpia que se lee de un vistazo.\n3. **Usa *Pattern Matching* para la forma y Guardas (`|`) para las condiciones:** no anides escaleras infinitas de `if / else`. Desestructura el dato a la izquierda y filtra con guardas en cascada a la derecha.\n4. **Cierra siempre con `| otherwise =`:** nunca dejes una función a merced de la casualidad; haz que tus guardas y patrones sean exhaustivos.\n5. **Modela tu dominio con ADTs (`type`):** haz que los estados ilegales sean irrepresentables. Si una función puede fallar de forma esperada, devuelve un `Option<a>` o un `Result<a, e>` en lugar de valores mágicos como `-1` o `\"\"`.\n6. **Piensa en transformaciones (`map`, `filter`, `fold`):** evita escribir recursión manual cuando una combinación de funciones de orden superior expresa tu intención en una sola línea.\n7. **Declara el *qué* con `where` y deja el *cómo* (y el paralelismo) al compilador:** agrupa los subcálculos independientes en un bloque `where` puro para que Ridgun construya el DAG y aproveche todos los núcleos de tu CPU sin *data races*.\n8. **Ponle dimensiones a tus Tensores (`Tensor<DType, [Dims]>`):** deja que el compilador cace los errores de formas matriciales antes de ejecutar ni un solo cálculo.\n9. **Acota la memoria temporal con `region`:** cuando proceses lotes grandes de datos intermedios, envuélvelos en una región léxica para liberar la memoria de forma determinista y en tiempo $O(1)$.\n10. **Confía en `stable check` y `stable test`:** si pasa el verificador de tipos de Ridgun y tus tests en `src/test/ridgun/` están en verde, puedes desplegar tranquilo un viernes a las 18:00.\n\n¡Feliz viaje programando en Ridgun!\n"}];
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        // Strings
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        // Keywords
        html = html.replace(/\b(fn|op|type|import|where|otherwise|with|region|do|global|context|shared|atomic|hardware|echo|AND|OR|XOR|NOT)\b/g, '<span class="rg-kw">$1</span>');
        // Types & constructors
        html = html.replace(/\b(Int|Real|String|Char|Bool|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        // Operators
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|)/g, '<span class="rg-op">$1</span>');
        // Numbers & byte units
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      out = out.replace(/\$1024\^2\$/g, "1024<sup>2</sup>");
      out = out.replace(/\$1024\^3\$/g, "1024<sup>3</sup>");
      out = out.replace(/\$1024\$/g, "1024");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        // Fenced code block
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++; // skip closing ```
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">Copiar</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        // Horizontal rule
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        // Headings
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        // Table
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        // Blockquote
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        // Unordered list
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        // Ordered list
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        // Empty line
        if (!line.trim()) {
          i++;
          continue;
        }
        // Paragraph
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = "¡Copiado!";
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.title.replace(/^Capítulo \d+:\s*/, ""))}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">&larr; Capítulo anterior</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">Siguiente capítulo &rarr;</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>Resultados para "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">No se encontraron coincidencias para "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    // Initial load from URL hash if present
    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
