  <script>
    const CHAPTERS = [{"num":"00","slug":"00-por-que-necesito-ridgun","file":"00-por-que-necesito-ridgun.md","title":"Capítulo 00: ¿Por qué necesito Ridgun? ¿Ah, sí? No lo sabía... ¡Cuéntame más!","short_title":"¿Por qué necesito Ridgun? ¿Ah, sí? No lo sabía... ¡Cuéntame más!","markdown":"# Capítulo 00: ¿Por qué necesito Ridgun? ¿Ah, sí? No lo sabía... ¡Cuéntame más!\n\nSeamos sinceros: cuando alguien te dice *\"hemos creado un nuevo lenguaje de programación\"*, tu primera reacción natural —y muy sana— es arquear una ceja y pensar:\n\n> *\"¿Otro más? Pero si ya tengo Python para ir rápido, Rust o C para cuando necesito velocidad, y Bash para pegar cosas en la terminal. ¿Para qué demonios necesito yo aprender Ridgun?\"*\n\nEs una pregunta excelente. Y la respuesta corta es: **porque te has acostumbrado a sufrir tres dolores diarios pensando que eran inevitables**.\n\nVamos a ponerles nombre.\n\n---\n\n## Dolor n.º 1: \"El síndrome de los dos mundos\" (Prototipar en uno, reescribir en otro)\n\nSeguro que has vivido esta película:\n\n1. Empiezas una herramienta o un motor de cálculo en **Python**, **JavaScript** o **Ruby** porque quieres pensar en el problema, no en punteros ni en el compilador.\n2. El código queda corto y bonito... pero cuando le pasas un archivo de 500 MB o intentas usar los 16 núcleos de tu máquina, se arrastra. Y si quieres distribuir tu programa a un servidor limpio, tienes que empaquetar medio gigabyte de entorno virtual, intérprete y librerías dinámicas.\n3. Resignado, decides reescribirlo en **C**, **C++** o **Rust**. Ahora vuela y ocupa unos pocos cientos de kilobytes, pero tu código de 40 líneas se ha convertido en 300 líneas llenas de `unwrap()`, `&mut`, `'a`, `Arc<Mutex<...>>`, llaves `{}` y puntos y coma `;`.\n\n**¿Qué cambia con Ridgun?**\nEn Ridgun escribes código **más corto y limpio que en Python**, pero cuando ejecutas `ridgunc build`, obtienes **un único binario nativo ELF de ~350 KB** sin intérprete, sin máquina virtual externa y sin recolector de basura. No hay fase de *\"luego lo reescribimos en el lenguaje rápido\"*: el código limpio donde piensas el problema **ya es** el binario nativo de producción.\n\n---\n\n## Dolor n.º 2: \"Leer código ajeno (o el tuyo de hace 6 meses) es jugar a ser detective\"\n\nMira cómo escribimos lógica condicional en casi todos los lenguajes mainstream:\n\n```text\nif (estado == ACTIVO && (rol == ADMIN || (rol == EDITOR && tienePermiso))) {\n    if (cuota > 0) {\n        return procesar(usuario);\n    } else {\n        return denegar(\"Sin cuota\");\n    }\n} else {\n    return denegar(\"No autorizado\");\n}\n```\n\nNuestros ojos no evolucionaron para emparejar llaves anidadas ni para desentrañar árboles de `if / else` escalonados. Cuando los ingenieros, matemáticos o físicos quieren entender reglas complejas sin equivocarse, no escriben párrafos de `if / else`: **dibujan una tabla**.\n\nEn Ridgun, **el código es esa tabla**:\n\n```ridgun\nautorizar String   String   Bool  Int   => String\nautorizar \"activo\" \"admin\"  _     cuota =\n  | cuota > 0 = \"Procesando petición\"\n  | otherwise = \"Denegado: sin cuota\"\nautorizar \"activo\" \"editor\" True  cuota =\n  | cuota > 0 = \"Procesando petición\"\n  | otherwise = \"Denegado: sin cuota\"\nautorizar _        _        _     _     =  \"Denegado: no autorizado\"\n```\n\nMira las columnas:\n- Columna 1: el estado (`\"activo\"` o `_`).\n- Columna 2: el rol (`\"admin\"`, `\"editor\"` o `_`).\n- Columna 3: si tiene permiso (`True` o `_`).\n- Columna 4: la `cuota`.\n\nNo tienes que ejecutar mentalmente el programa línea por línea para saber qué pasa cuando entra un `\"editor\"` con permiso `False`: tus ojos bajan verticalmente por la tabla y lo ven en medio segundo.\n\n---\n\n## Dolor n.º 3: \"Mi ordenador tiene 16 núcleos, pero mi programa solo usa 1 (porque me da pánico tocar hilos)\"\n\nHoy hasta el teléfono más modesto tiene 8 núcleos, y cualquier servidor o portátil de trabajo tiene entre 12 y 32. Sin embargo, el 95% de los programas cotidianos siguen ejecutándose en un solo hilo secuencial.\n\n¿Por qué? Porque en los lenguajes imperativos, paralelizar significa abrir la caja de Pandora:\n- ¿Y si dos hilos modifican el mismo diccionario a la vez? (*Data race*).\n- ¿Y si bloqueo el `Mutex` A y luego el B en un hilo, y el B y luego el A en otro? (*Deadlock*).\n- ¿Y si contamino toda mi base de código con `async` y `await` de arriba abajo?\n\nEn Ridgun, **toda función es pura y todo dato es inmutable por defecto**. Eso tiene una consecuencia mágica: **dos expresiones que no dependen una de la otra jamás pueden interferir entre sí**.\n\nPor eso, en Ridgun no tienes que gestionar hilos para aprovechar tu CPU. Solo declaras **qué depende de qué** con barras paralelas `||` y flechas `->`:\n\n```ridgun\ninforme_mensual Datos => Informe\ninforme_mensual d     =  combinar metricas_red metricas_disco metricas_cpu\n  || analizar_red d   -> metricas_red\n  || analizar_disco d -> metricas_disco\n  || analizar_cpu d   -> metricas_cpu\n```\n\nTú solo has escrito tres líneas limpias indicando de dónde sale cada dato. El compilador ve que las tres ramas son independientes y sabe que puede lanzarlas en paralelo sin que exista ni la más mínima posibilidad de un *data race* o un *deadlock*.\n\n¿Y si necesitas agentes persistentes con buzón de mensajes y estado aislado (por ejemplo, para mantener miles de sesiones de clientes, trabajadores en segundo plano o conexiones de red)? En Ridgun no tienes que definir clases `Actor` ni usar `Mutex`: **cualquier función normal se convierte en un agente autónomo en una sola línea con `agent`**:\n\n```ridgun\ncontador = agent (sumar visita) 0\nsend 1 to contador\nsend 5 to contador\ntotal = receive from contador\nstop contador\n```\n\nAdemás, el compilador realiza una **elección inteligente en tiempo de compilación**: analiza estáticamente la profundidad y el coste de cada función en `||`, `||map`, `||filter` y `agent` para ejecutar las funciones ligeras como pasos *green-thread* de sobrecarga cero (sin pagar el coste de calentar hilos del sistema operativo) y despachar automáticamente los cálculos pesados o recursivos a hilos reales del kernel en múltiples núcleos (`SYS_clone`).\n\n---\n\n## Dolor n.º 4: \"El recolector de basura decide pausar el mundo justo en el peor momento\"\n\nLos lenguajes funcionales clásicos (Haskell, OCaml, Erlang, Clojure) son maravillosos para razonar sobre el código, pero casi todos dependen de un **Recolector de Basura (*Garbage Collector*)** en tiempo de ejecución. Eso los descarta cuando necesitas:\n- Latencias predecibles al microsegundo.\n- Controlar exactamente cuánta memoria RAM puede consumir una operación antes de abortarla limpiamente.\n- Escribir utilidades del sistema operativo (`ls`, `find`, `sh`, `doas`, `make`) o tocar registros de hardware (`MMIO`).\n\nRidgun te da **toda la elegancia del mundo funcional puro, pero con Gestión de Memoria de Ridgun (`RMM`: `RMM1` estática y `RMM2` por conteo de asignaciones en cascada) más regiones léxicas con cuota exacta (`with region`)**:\n\n```ridgun\nparsear_paquete String => Result\nparsear_paquete crudo  =\n  with region 16_KB do\n    decodificar_trama crudo\n```\n\nCada estructura temporal es liberada de forma determinista por el compilador (`RMM1` / `RMM2`) en el instante en que deja de usarse, y si un atacante te envía un paquete malicioso diseñado para explotar la memoria, al superar el byte 16.384 la región se corta al instante, libera su arena en $O(1)$ y te devuelve `Err OutOfMemory`. Sin caídas del proceso, sin pausas de GC y sin fugas de memoria.\n\n---\n\n## En resumen: ¿Cuándo brilla Ridgun?\n\nRidgun está hecho para ti si alguna vez has querido:\n\n1. **Escribir herramientas de sistemas, compiladores, analizadores o utilidades CLI** que arranquen en microsegundos, pesen unos pocos cientos de KB y no puedan romperse por punteros nulos ni efectos colaterales ocultos.\n2. **Construir sistemas concurrentes y servidores basados en el Modelo Nativo de Agentes (`agent`, `send ... to`, `receive from`, `stop`)**, donde cualquier función pura se convierte en un agente con o sin estado aislado y el compilador elige inteligentemente entre ejecución *green-thread* ultraligera e hilos nativos multinúcleo.\n3. **Programar algoritmos, pipelines de datos o álgebra de tensores** donde el compilador verifique por ti hasta las dimensiones de las matrices (`Tensor[M, K] * Tensor[K, N] => Tensor[M, N]`) antes de ejecutar nada.\n4. **Disfrutar leyendo tu propio código**: que cada archivo `.rg` parezca una página de un libro bien maquetado gracias al formateador tabular automático (`stable format`).\n\n¿Te pica la curiosidad? Pasa al **Capítulo 01** y escribamos nuestro primer programa en menos de dos minutos.\n"}, {"num":"01","slug":"01-bienvenido-a-ridgun","file":"01-bienvenido-a-ridgun.md","title":"Capítulo 01: Tu primer contacto con Ridgun (Sin cascos, sin llaves y sin puntos y coma)","short_title":"Tu primer contacto con Ridgun (Sin cascos, sin llaves y sin puntos y coma)","markdown":"# Capítulo 01: Tu primer contacto con Ridgun (Sin cascos, sin llaves y sin puntos y coma)\n\nVale, ya te he convencido en el Capítulo 00 de que no estamos locos por crear Ridgun. Ahora seguramente estés pensando:\n\n> *\"Muy bonito el discurso de las tablas y los 16 núcleos, pero enséñame código de verdad. ¿Cuánto tarda uno en escribir algo que funcione sin pelearse con el compilador?\"*\n\nVenga, ¡al turrón!\n\n---\n\n## 1.1. \"¡Hola, mundo!\", pero con chicha\n\nEn la mayoría de los libros de programación te enseñan un `print(\"Hola mundo\")` soso y pasan de página. Nosotros vamos a escribir directamente una función con lógica real para que veas cómo respira Ridgun desde el minuto uno.\n\nCrea un archivo llamado `hola.rg` y escribe esto:\n\n```ridgun\nsaludo String => String\nsaludo \"\"     =  \"¡Hola, viajero misterioso! (No me has dicho tu nombre)\"\nsaludo \"Root\" =  \"¡Hombre, Root! Cuidado con lo que borras hoy.\"\nsaludo nombre =  \"¡Hola, {nombre}! Bienvenido a Ridgun.\"\n\nmain => ()\nmain =\n  echo (saludo \"Ada\")\n  echo (saludo \"Root\")\n  echo (saludo \"\")\n```\n\nPara ejecutarlo ahora mismo:\n\n```bash\nridgunc run hola.rg\n```\n\nY verás en tu terminal:\n\n```text\n¡Hola, Ada! Bienvenido a Ridgun.\n¡Hombre, Root! Cuidado con lo que borras hoy.\n¡Hola, viajero misterioso! (No me has dicho tu nombre)\n```\n\nPara un momento y mira el bloque de `saludo` arriba. ¿Notas lo que **NO** hay?\n- **No hay `function`, ni `def`, ni `pub fn`** (si quieres poner `fn ::` delante de la firma puedes hacerlo, pero es opcional).\n- **No hay paréntesis `(String nombre)` ni llaves `{ ... }`** ensuciando la pantalla.\n- **No hay `if (nombre == \"\") ... else if (nombre == \"Root\") ... else ...`**.\n- **No hay `return`**.\n\n---\n\n## 1.2. Cómo lee tu cerebro un archivo `.rg`\n\nVamos a destripar esas cuatro líneas de `saludo`, porque aquí ya está el 50% de la filosofía de Ridgun:\n\n```ridgun\nsaludo String => String\nsaludo \"\"     =  \"¡Hola, viajero misterioso! (No me has dicho tu nombre)\"\nsaludo \"Root\" =  \"¡Hombre, Root! Cuidado con lo que borras hoy.\"\nsaludo nombre =  \"¡Hola, {nombre}! Bienvenido a Ridgun.\"\n```\n\n1. **La primera línea es el contrato (`saludo String => String`)**:\n   Dice: *\"Me llamo `saludo`, recibo un `String` y te devuelvo (`=>`) otro `String`\"*. Punto. Si alguien intenta llamarme pasándome el número `42`, el compilador le dará un toque en el hombro antes siquiera de ejecutar el programa.\n2. **Las líneas de abajo son los casos (de arriba abajo)**:\n   - ¿Me has pasado la cadena vacía `\"\"`? Devuelvo la primera frase.\n   - ¿Me has pasado exactamente `\"Root\"`? Devuelvo la segunda frase.\n   - ¿Me has pasado cualquier otra cosa? La guardo en la variable `nombre` y la meto dentro del texto usando `{nombre}`.\n3. **¿Y qué es `main => ()`?**:\n   Como `main` no recibe argumentos, ponemos `=>` directamente después del nombre. Y devuelve `()` (el tipo vacío o *Unit*, para los amigos), porque su único trabajo es sacar cosas por pantalla con `echo`.\n\n---\n\n## 1.3. \"Espera... ¿tengo que alinear esos espacios a mano como un monje copista?\"\n\n¡Ni de broma! Si tuvieras que darle a la barra espaciadora contando columnas a ojo, abandonarías Ridgun a los diez minutos (y con razón).\n\nTú escribes el código deprisa, con un solo espacio entre cada palabra:\n\n```ridgun\nsaludo String => String\nsaludo \"\" = \"¡Hola, viajero misterioso!\"\nsaludo nombre = \"¡Hola, {nombre}!\"\n```\n\nY cuando ejecutas **`stable format`** (o pulsas `TAB` / guardas el archivo en Emacs con `ridgun-mode`), el formateador canónico coloca cada parámetro debajo de su tipo y alinea todos los `=` con precisión milimétrica. Tú escribes rápido; la máquina maqueta la tabla.\n\n---\n\n## 1.4. De script rápido a binario de combate en un comando\n\nCuando haces `ridgunc run hola.rg`, estás compilando y lanzando el programa al vuelo. Pero imagina que ya has terminado tu herramienta y quieres llevártela a un servidor de producción o compartirla con un compañero que no tiene instalado Ridgun.\n\nEjecutas:\n\n```bash\nridgunc build hola.rg -o hola\n```\n\nY ya tienes `./hola`: un **ejecutable nativo ELF de Linux x86_64**, limpio, sin código muerto (*Tree-Shaking*), con optimización de enlace completo (*LTO*) y sin depender de ningún intérprete externo.\n\n---\n\n## 1.5. La chuleta honesta: ¿De dónde viene cada idea de Ridgun?\n\nRidgun no pretende reinventar la rueda cuadrada; toma prestado sin complejos lo mejor de cuatro tradiciones:\n\n| De quién | Qué toma Ridgun | Qué deja fuera (por tu salud mental) |\n|---|---|---|\n| **Haskell / ML** | Funciones puras, *pattern matching* por casos, tipos algebraicos (`Option`, `Result`) y polimorfismo (`A`..`Z`). | Las mónadas abstractas, los 40 `LANGUAGE pragmas` y el recolector de basura. |\n| **J / APL** | La obsesión por la forma tabular del código, tensores nativos y máscaras de secuencias (`s(_ + _)`). | Los símbolos jeroglíficos imposibles de escribir en un teclado normal. |\n| **Rust / C** | Binarios ELF nativos pequeños, cero GC, control de memoria (`with region`) y llamadas al sistema POSIX. | La pelea constante con el *borrow checker*, los *lifetimes* `'a` y la verbosidad sintáctica. |\n| **Erlang / Go** | Agentes aislados (`agent`, `send ... to`, `receive from`) y concurrencia por canales (`new bounded channel`). | Los punteros `nil` y las mutaciones compartidas por descuido. |\n\n---\n\n## 1.6. Y lo más importante: ¿Qué hace Ridgun que NO tiene nadie más?\n\nReconocer a los clásicos es de buena educación, pero si Ridgun fuera solo un \"recopilatorio de grandes éxitos\" de otros lenguajes, no estarías leyendo este libro.\n\nHay **ocho cosas** que hemos diseñado e integrado en Ridgun que no vas a encontrar juntas —y muchas de ellas, ni siquiera por separado— en ningún otro lenguaje actual:\n\n### 1. Bloques paralelos `||` con `->` que son grafos paralelos reales, no simple azúcar sintáctico\nEn otros lenguajes funcionales un bloque de variables locales solo ordena expresiones que luego se evalúan en un único hilo.\nEn Ridgun, **un bloque `||` con flechas `->` es un Grafo Acíclico Dirigido (DAG) de ejecución paralela** sin siquiera necesitar escribir palabras clave extra como `where`:\n```ridgun\ninforme_anual Int => Int\ninforme_anual id  =  ingresos - gastos\n  || calcular_ventas id -> ingresos\n  || calcular_costes id -> gastos\n```\nTú dibujas las flechas de flujo (`->`). El compilador analiza quién depende de quién, **verifica estáticamente que no hayas creado ningún ciclo infinito**, y lanza las ramas independientes en paralelo sin que escribas ni un solo `async`, `await`, `Future` ni `Mutex`.\n\n### 2. Modelo Nativo de Agentes (`agent`) de cero fricción con elección inteligente en compilación\nEn otros lenguajes, programar con actores o agentes te obliga a crear clases especiales, implementar *traits*, gestionar *locks* o infectar tus funciones con `async`.\nEn Ridgun, **cualquier función pura normal (`fn ::` u `op ::`) se convierte directamente en un agente autónomo —con o sin estado aislado— usando `agent`**:\n```ridgun\natender_http (Sesion, String) => (Sesion, String)\n...\nservidor = agent atender_http sesion_inicial\nsend \"GET /perfil\" to servidor\nrespuesta = receive from servidor\nstop servidor\n```\nMejor aún: el compilador **analiza en tiempo de compilación la profundidad y el coste computacional de la función** tanto en `agent` como en `||` y `||map`. Si la función es ligera, la ejecuta como un *green thread* instantáneo sin pagar el coste de calentar hilos del sistema operativo; si es un cálculo pesado o recursivo profundo, la despacha automáticamente en paralelo sobre hilos reales del kernel (`SYS_clone`) repartidos por los núcleos de tu CPU.\n\n### 3. El código como tabla bidimensional donde la firma es la cabecera de las columnas\nEn cualquier otro lenguaje, la firma de tipos va por libre en una línea y el cuerpo de la función va debajo como un párrafo de texto normal.\nEn Ridgun, **la firma de tipos es literalmente la cabecera de una tabla**, y cada caso debajo alinea cada patrón justo en la vertical de su tipo y cada `=` bajo el `=>`:\n```ridgun\ndividir Int Int => Option\ndividir _   0   =  None\ndividir a   b   =  Some (a / b)\n```\nNadie más trata la firma y las ecuaciones como una única matriz visual verificada por el compilador y maquetada automáticamente por `stable format`.\n\n### 4. Operadores frase (*Mixfix* N-arios) tipados y alineados (`op ::`)\nEn la mayoría de los lenguajes, o te aguantas con `+`, `-`, `*` o como mucho defines un operador binario críptico como `<|>` que nadie sabe qué significa.\nEn Ridgun puedes crear **operadores que son frases legibles con tantos huecos tipados como quieras** (incluyendo palabras contextuales como `type` o `with`):\n```ridgun\nop :: Int limitado_entre Int y Int => Int\n      x   limitado_entre min y max =\n        | x < min   = min\n        | x > max   = max\n        | otherwise = x\n```\nY luego en tu código escribes `velocidad limitado_entre 0 y 120`. Se lee como castellano (o inglés), pero está 100% tipado y compilado a código nativo.\n\n### 5. Máscaras visuales sobre secuencias (`s(_ + _)` y `-> (+ _ _ +) ->`)\n¿Alguna vez has tenido que escribir una ensalada de índices `filter(\\(i, x) -> i % 2 == 0)` o abrir una tupla con variables mudas solo para quedarte con dos posiciones concretas?\nEn Ridgun le pasas directamente una **máscara visual**:\n- `datos(_ + _)`: descarta el primero (`_`), se queda el segundo (`+`), descarta el tercero (`_`).\n- `parsear paquete \"v0.9.9\" -> (+ _ _ +) -> combinar codigo -> resumen`: filtra una tupla de 4 elementos en plena tubería y pasa el 1.º y el 4.º directamente como los 2 argumentos de la siguiente función.\nCero aritmética de índices, cero errores *off-by-one*.\n\n### 6. Polimorfismo de \"cero ruido\" (`A`..`Z`) gobernado por tu dominio\nEn Rust, TypeScript o Java, cuando una función es genérica tienes que llenar la línea de paréntesis angulares: `fn intercambiar<A, B>(par: (A, B)) -> (B, A)`.\nEn Ridgun simplemente usas una letra mayúscula suelta:\n```ridgun\nintercambiar (A, B) => (B, A)\nintercambiar (x, y) =  (y, x)\n```\n*\"¿Y si en mi programa quiero tener un tipo real que se llame `type A`?\"* — Ningún problema: en Ridgun **tus declaraciones `type` mandan**. Si no existe `type A`, `A` es genérico; en el instante en que defines `type A = ...`, pasa a ser tu tipo concreto en todo el módulo.\n\n### 7. Cero archivos de configuración extraños: `build.rg` es Ridgun puro\nOlvídate de aprender TOML para Cargo, JSON para npm, XML para Maven o la sintaxis arcana de `Makefile` con tabuladores invisibles. En Ridgun, la receta que construye tu proyecto (`build.rg`) **es un archivo `.rg` más**, con las mismas funciones puras y el mismo *pattern matching* que el resto de tu código.\n\n### 8. La \"Santísima Trinidad\" que parecía imposible: Nivel Haskell + Memoria RMM sin GC ni Lifetimes + Binarios de ~350 KB\nHasta hoy tenías que elegir:\n- Si querías expresividad funcional pura (Haskell, OCaml, Elixir), pagabas con un recolector de basura y un runtime pesado.\n- Si querías binarios diminutos de sistema sin recolector de basura (C, Rust, Zig), pagabas gestionando punteros o peleándote con el *borrow checker* y escribiendo código imperativo lleno de `let mut`.\n\nRidgun rompe ese dilema combinando **Ridgun Memory Management (`RMM`: `RMM1` estática y `RMM2` por conteo de asignaciones en cascada)**, **regiones léxicas (`with region`)** que liberan arenas enteras en $O(1)$, **recursión de cola transformada en bucles nativos (`loop`)**, y **poda de grafo de llamadas (*Tree-Shaking*)** desde `main`. El resultado: escribes código declarativo de altísimo nivel y obtienes un ejecutable ELF autónomo de **~350 KB** capaz de competir de tú a tú con herramientas escritas en C.\n\nAhora sí: con las cartas sobre la mesa, vamos al **Capítulo 02** para poner a trabajar a **`ridgunc`** y **`stable`**.\n\n"}, {"num":"02","slug":"02-primeros-pasos-y-herramientas","file":"02-primeros-pasos-y-herramientas.md","title":"Capítulo 02: Tus dos mejores amigos: `ridgunc` y `stable` (Cero archivos YAML, prometido)","short_title":"Tus dos mejores amigos: `ridgunc` y `stable` (Cero archivos YAML, prometido)","markdown":"# Capítulo 02: Tus dos mejores amigos: `ridgunc` y `stable` (Cero archivos YAML, prometido)\n\nHay lenguajes cuyo compilador es maravilloso, pero cuyo sistema de proyectos parece diseñado por tu peor enemigo: que si un `Makefile` de 400 líneas con tabuladores invisibles, que si un `pom.xml` infinito, que si un `webpack.config.js` que deja de funcionar si lo miras fijo...\n\nEn Ridgun nos hicimos una promesa muy simple desde el primer día:\n\n> *\"Sólo habrá dos ejecutables en todo el ecosistema (`ridgunc` y `stable`), ambos estarán escritos en el propio Ridgun, y el archivo de configuración del proyecto (`build.rg`) será código Ridgun normal y corriente. Ni JSON, ni YAML, ni TOML, ni inventos raros.\"*\n\nVamos a ver cómo se usan.\n\n---\n\n## 2.1. `ridgunc`: El francotirador para archivos sueltos\n\nCuando tienes un único archivo `.rg` entre manos y quieres probar una idea rápida, analizar sus tipos o compilar un ejecutable, hablas directamente con **`ridgunc`**.\n\nSólo tiene 4 comandos que de verdad necesitas recordar:\n\n```bash\n# 1. \"¿Compila esto o he metido la pata con algún tipo?\"\nridgunc check experimento.rg\n\n# 2. \"¡Ejecútalo ya!\" (Compila y corre de un tirón)\nridgunc run experimento.rg\n\n# 3. \"Hazme un binario nativo ELF64 listo para llevar\"\nridgunc build experimento.rg -o mi-programa\n\n# 4. \"Compílame una librería reutilizable (.rglib y .so ELF64 sin necesitar main)\"\nridgunc build --lib utilidades.rg -o target/utilidades.rglib\nridgunc build --so  utilidades.rg -o target/libutilidades.so\n\n# 5. \"Sácame el artefacto intermedio de bytecode (.rgc)\"\nridgunc compile experimento.rg -o experimento.rgc\n```\n\n### El superpoder oculto de `ridgunc check`\nCuando lanzas `ridgunc check`, no solo te dice *\"0 errores\"*. También te chiva qué estrategia ha elegido el analizador estático para cada una de tus funciones:\n- **`InlineSequential`**: *\"Esta función es pequeñita y directa; la voy a ejecutar en línea sin meter sobrecoste de planificación\"*.\n- **`LazyStealableTask`**: *\"Aquí hay recursión o un grafo paralelo `||`; la preparo para que otros núcleos de CPU puedan robar trabajo si hace falta\"*.\n\n### El bisturí de `ridgunc build` (Por qué tus binarios no pesan 20 MB)\nCuando ejecutas `ridgunc build`, el compilador no se limita a escupir todo el código de las librerías que hayas importado:\n1. Empieza en tu función `main` y recorre el grafo de llamadas para ver **qué funciones usas de verdad**. Si importaste una librería enorme de 80 funciones pero solo llamas a 2, las otras 78 se descartan antes siquiera de tocar el ensamblador (*Tree-Shaking*).\n2. Busca todas las funciones recursivas de cola y las convierte en bucles `loop` nativos que consumen **0 bytes de pila**.\n3. Pasa el enlace final con optimización global (*fat LTO*) y limpia la basura de depuración DWARF para dejarte un binario compacto y afilado (~350 KB).\n\n---\n\n## 2.2. `stable`: Cuando tu proyecto crece y quieres orden\n\nUn archivo suelto está genial para un script, pero en cuanto tienes varios módulos, librerías compartidas y tests, necesitas un director de orquesta. Ese es **`stable`**.\n\nLa estructura de carpetas de un proyecto Ridgun no tiene misterio:\n\n```text\nmi-super-herramienta/\n├── build.rg                  # El manifiesto del proyecto (¡es código Ridgun!)\n├── src/\n│   ├── main/\n│   │   └── ridgun/\n│   │       ├── lib/          # Tus módulos reutilizables (`import utilidades`)\n│   │       └── app/\n│   │           └── main.rg   # Punto de entrada (`main => ()`)\n│   └── test/\n│       └── ridgun/           # Tus baterías de tests (`test *.rg`)\n│           └── test todo.rg\n└── target/                   # Donde aparecen los binarios compilados\n```\n\n---\n\n## 2.3. `build.rg`: Un archivo de configuración que nunca te mentirá\n\n¿Por qué nos negamos a usar YAML o TOML para configurar un proyecto Ridgun?\nPorque en YAML te equivocas en dos espacios de indentación y no te enteras hasta que falla el despliegue. En cambio, como **`build.rg` es un archivo Ridgun**, tiene tipos estáticos, pasa por `stable check` y se alinea solo con `stable format`:\n\n```ridgun\nfn :: project name => String\n      project name =  \"mi-super-herramienta\"\n\nfn :: project version => String\n      project version =  \"0.1.0\"\n\n-- \"exe\" (ejecutable), \"lib\" (librería .rglib + .so) o \"both\" (ambos)\nfn :: project kind => String\n      project kind =  \"both\"\n\n-- Opcional: modo estricto (prohíbe '_' en nombres fn/op y exige retornos '=> Int Int')\nfn :: strict mode => Bool\n      strict mode =  True\n\nfn :: main entry => String\n      main entry =  \"src/main/ridgun/app/main.rg\"\n\nfn :: source dir => String\n      source dir =  \"src/main/ridgun\"\n\nfn :: test dir => String\n      test dir =  \"src/test/ridgun\"\n\nfn :: target dir => String\n      target dir =  \"target\"\n\nfn :: dependencies => [String]\n      dependencies =  []\n\nfn :: plugins => [String]\n      plugins =  []\n\nfn :: task verificar todo => String\n      task verificar todo =  \"./bin/stable check && ./bin/stable test\"\n```\n\nSi te equivocas al escribir un campo o un tipo, el propio compilador te avisa. Y fíjate en que todas las funciones de configuración usan **espacios naturales** (`project name`, `project kind`, `source dir`, `task verificar todo`) en lugar de guiones bajos.\n\n---\n\n## 2.4. Tu rutina diaria con `stable` (Los 4 fantásticos)\n\nCuando estás trabajando dentro de tu proyecto, tu día a día se reduce a cuatro comandos:\n\n### 1. `stable format` — El fin de las discusiones de estilo en el equipo\n```bash\nstable format\n```\n¿Que tu compañero pone tres espacios antes del `=>` y tú pones uno? Da igual. Ejecutas `stable format` y en menos de un segundo deja **todos** los archivos `.rg` del repositorio alineados como una tabla suiza.\n\n### 2. `stable check` — El radar instantáneo\n```bash\nstable check\n```\nRecorre todos los módulos de `src/main/ridgun/`, verifica tipos, constructores, aridades y dimensiones de tensores, y te da el veredicto módulo por módulo.\n\n### 3. `stable test` — Dormir tranquilo por las noches\n```bash\nstable test\n```\nBusca todas las suites `src/test/ridgun/test *.rg`, las ejecuta y comprueba cada `assert equals` y `assert true`.\n\n```ridgun\n-- Ejemplo de src/test/ridgun/test mates.rg\nimport test\n\ndoble Int => Int\ndoble x   =  x * 2\n\nmain => ()\nmain =\n  assert equals (doble 21) 42\n  assert true ((doble 5) > 0)\n```\n\n### 4. `stable built` (y `stable clean`) — A producción\n```bash\nstable built\n```\nCompila todos los objetivos nativos en `target/`. Y si algún día quieres borrar `target/` y empezar limpio: `stable clean`.\n\n---\n\n## 2.5. Crear y usar Librerías Reutilizables (`.rglib` y `.so` ELF64) y Plugins de `stable`\n\nUna librería no tiene función `main => ()`: ofrece tipos (`type`, `expand type`), funciones (`fn ::`) y operadores (`op ::`) para que otros proyectos los importen.\n\n### 1. Crear un proyecto de librería con `stable`\n```bash\nstable new --lib geometria\ncd geometria\nstable built lib\n```\nAl compilar en modo librería (`project kind = \"lib\"` o `stable built lib`), el compilador desactiva la poda desde `main` para conservar **todas** las funciones y tipos exportados, y genera dos artefactos en `target/`:\n- **`target/geometria.rglib`**: paquete autocontenido de librería Ridgun (con todas sus fuentes y dependencias internas resueltas), listo para importar desde cualquier otro proyecto con `import geometria` o `import \"target/geometria.rglib\"`.\n- **`target/libgeometria.so`**: biblioteca dinámica nativa ELF64 (`ET_DYN`, para `x86_64` o `arm64-linux`).\n\n```ridgun\n-- src/main/ridgun/lib/geometria.rg (¡Sin función main!)\ntype Punto = x: Int, y: Int\n\nfn :: desplazar punto Punto Int Int => Punto\n      desplazar punto p     dx  dy  =  Punto ((x p) + dx) ((y p) + dy)\n\nfn :: coordenadas punto Punto => Int Int\n      coordenadas punto p     =  (x p, y p)\n```\n\n### 2. ¿Cómo importo un módulo o librería desde otro archivo? (`import`)\n\nSin rutas relativas infernales tipo `../../../lib/cosas.rg`. Si tienes un módulo `src/main/ridgun/lib/geometria.rg` o un paquete `geometria.rglib` (en `target/`, `lib/` o `.stable/deps/` tras ejecutar `stable deps`), en cualquier otro archivo escribes arriba del todo:\n\n```ridgun\nimport geometria\n```\n\nY listo: todas las funciones, operadores y tipos de `geometria` están disponibles como si estuvieran en tu propio archivo. Si varios módulos hacen `import geometria`, el cargador de Ridgun recuerda qué archivos canónicos ha leído ya y **solo lo incluye una vez**.\n\n### 3. Extender `stable` con tareas (`fn :: task`) y plugins (`plugins/*.rg`)\n¿Quieres añadir comandos propios para tu framework web, tus migraciones de base de datos o tu flujo de despliegue?\n- **En `build.rg`**: declara cualquier función `fn :: task <palabras...> => String` (por ejemplo, `fn :: task levantar servidor => String`) y ejecútala con `stable levantar servidor`.\n- **En `plugins/*.rg` o `.stable/plugins/*.rg`**: coloca módulos `.rg` que definan tareas `fn :: task ...` o su propio `fn :: main => ()`, o extiende el tipo abierto `expand type StableCommand` de `stable`. Ejecuta `stable tasks` y `stable plugins` para inspeccionarlos en cualquier momento.\n\n### 4. El modo estricto opcional (`--strict` y `strict mode = True`)\nPor defecto, ni `ridgunc` ni los proyectos nuevos creados con `stable new` o `stable init` activan el modo estricto. Sin embargo, cuando quieras garantizar en tu propio proyecto que todo el equipo siga al 100% la convención canónica de espacios naturales de Ridgun, puedes pasar `--strict` a `ridgunc` (`ridgunc check --strict`, `ridgunc build --strict`) o declarar `strict mode = True` en tu `build.rg`. El modo estricto convierte en **error de compilación**:\n1. Cualquier guion bajo `_` dentro del nombre de una declaración `fn ::` u `op ::` (debiendo escribirse `fn :: calcular total`, nunca `fn :: calcular_total`; las variables locales y campos de registros sí pueden usar `_`).\n2. Cualquier tipo de salida múltiple escrito con paréntesis o comas tras `=>` (debiendo escribirse `=> Int Int` o `=> RToken [RToken]`, nunca `=> (Int, Int)`).\n\n---\n\n## 2.6. El Ecosistema de Librerías Estándar y Criptográficas (`ridgun-libs`)\n\nRidgun cuenta con una suite oficial de **32 librerías puras** (`ridgun-libs`), compiladas como paquetes `.rglib` y bibliotecas dinámicas `.so` ELF64 listas para importar con `import <nombre>`:\n\n| Familia | Librerías (`import ...`) | Qué aportan a tus proyectos |\n|---|---|---|\n| **1. Texto, Formatos y Plantillas** | `str`, `fmt`, `regex`, `diff`, `template`, `json`, `csv`, `ini`, `codec` | Manipulación avanzada de cadenas, formateo tabular, expresiones regulares Thompson NFA, diferencias Myers (`diff`), plantillas sin lógica, parsers/serializadores `json`/`csv`/`ini` y codificación hexadecimal/Base64 (`codec`). |\n| **2. Colecciones, Matemáticas y Álgebra Tensorial** | `list`, `btree`, `math`, `tensor`, `linalg` | Operaciones funcionales sobre listas, árboles B ordenados en memoria (`btree`), aritmética avanzada (`math`), vistas y constructores de tensores tipados (`tensor`) y descomposición/álgebra lineal (`linalg`). |\n| **3. Sistema Operativo, Archivos y CLI** | `posix`, `io`, `path`, `glob`, `cli`, `time`, `log`, `uuid`, `test` | Descriptores y señales POSIX (`posix`), E/S con `with timeout` (`io`), rutas y patrones (`path`, `glob`), argumentos CLI tipados (`cli`), relojes monotónicos (`time`), logging estructurado (`log`), RFC 4122 `uuid` y aserciones (`test`). |\n| **4. Criptografía y Seguridad** | `crypto`, `argon2id`, `jwt` | SHA-256 binario directo (`sha256 raw` / `sha256 bytes` en 32 bytes crudos), HMAC-SHA-256, PBKDF2-HMAC-SHA-256, HKDF, ChaCha20-Poly1305 AEAD (`crypto`), hashing de contraseñas RFC 9106 `argon2id` sobre `Tensor[U64 * 8 * 16]` con permutación BlaMka sin alojar tuplas en el heap (`argon2id`), y tokens firmados (`jwt`). |\n| **5. Redes, Protocolos y Agentes** | `socket`, `http`, `ws`, `agent`, `pool`, `net_agent` | Sockets TCP/UDP POSIX (`socket`), cliente/servidor HTTP/1.1 (`http`), WebSockets RFC 6455 (`ws`), supervisores de agentes (`agent`), pools de trabajadores (`pool`) y servidores reactivos orientados a agentes (`net_agent`). |\n\nAhora que tienes la caja de herramientas y las librerías controladas, pasemos al **Capítulo 03** para dominar las funciones con espacios naturales, las firmas de tipos y los bloques.\n"}, {"num":"03","slug":"03-funciones-tipos-y-alineacion","file":"03-funciones-tipos-y-alineacion.md","title":"Capítulo 03: Funciones, firmas de tipos y el arte de escribir código como una tabla","short_title":"Funciones, firmas de tipos y el arte de escribir código como una tabla","markdown":"# Capítulo 03: Funciones, firmas de tipos y el arte de escribir código como una tabla\n\nHay una pregunta que todo programador se hace la primera vez que ve código funcional:\n\n> *\"Si aquí no hay clases, ni objetos, ni variables que cambian de valor... ¿entonces dónde meto mi lógica?\"*\n\nEn **funciones**. Pero no en esas funciones de 200 líneas llenas de banderas booleanas que todos hemos sufrido alguna vez, sino en funciones pequeñas, directas y tan fáciles de leer que parecen una tabla en una pizarra.\n\nVamos a ver cómo se construyen.\n\n---\n\n## 3.1. Dos formas de presentar una función (Tú eliges el traje)\n\nEn Ridgun toda función empieza con su **firma de tipos** (qué entra y qué sale tras `=>`) y debajo van sus **cláusulas de implementación** (con `=`).\n\nPuedes escribir el encabezado de dos maneras:\n\n### Opción A: Directa al grano (sin prefijo)\n```ridgun\naplicar descuento Int    Int        => Int\naplicar descuento precio porcentaje =  precio - (precio * porcentaje / 100)\n```\n\n### Opción B: Con etiqueta explícita (`fn ::`)\n```ridgun\nfn :: aplicar descuento Int    Int        => Int\n      aplicar descuento precio porcentaje =  precio - (precio * porcentaje / 100)\n```\n\n*\"Oye, ¿y por qué usamos espacios en `aplicar descuento` en lugar de `aplicar_descuento`?\"*\nPorque en Ridgun todos los tipos empiezan por mayúscula (`Int`, `String`, `A`..`Z`), `[` o `(`, mientras que las palabras del nombre de la función van en minúscula. Así puedes escribir nombres de varias palabras con espacios naturales (`aplicar descuento`, `coste envio`, `str len`, `read file`) sin ninguna ambigüedad para el compilador.\n\n*\"¿Y por qué existen las dos opciones (con `fn ::` y sin él)?\"*\nPorque para gustos, los colores:\n- Hay quien prefiere que las funciones empiecen pegadas al margen izquierdo sin escribir `fn ::` cada vez (al fin y al cabo, la flecha `=>` ya grita a los cuatro vientos que esa línea es una firma de tipos).\n- Y hay quien prefiere tener una columna izquierda dedicada a las etiquetas (`fn ::`, `op ::`, `type`, `import`) para escanear el archivo visualmente.\n\nEl compilador y `stable format` entienden ambas a la perfección.\n\n---\n\n## 3.2. La magia de las columnas: por qué tus ojos descansan\n\nMira esta función que calcula el coste de un envío según el país y si es urgente:\n\n```ridgun\nfn :: coste envio String Bool  Int  => Int\n      coste envio \"ES\"   False _    =  5\n      coste envio \"ES\"   True  _    =  12\n      coste envio _      False peso =  10 + (peso * 2)\n      coste envio _      True  peso =  25 + (peso * 4)\n```\n\nHaz la prueba: tapa la mitad derecha de la pantalla y mira solo las tres columnas de entrada:\n- Primera columna (`String`): `\"ES\"`, `\"ES\"`, `_`, `_`.\n- Segunda columna (`Bool`): `False`, `True`, `False`, `True`.\n- Tercera columna (`Int`): `_`, `_`, `peso`, `peso`.\n\n¿Ves algún agujero lógico? Ninguno: están las 4 combinaciones posibles delante de tus narices, alineadas verticalmente debajo de `String`, `Bool` e `Int`. En un bloque de `if / else` tradicional tendrías que leer 18 líneas para estar seguro de que no te has dejado ningún caso suelto.\n\n---\n\n## 3.3. Los tipos básicos y un regalo para no contar ceros (`_KB`, `_MB`, `_GB`)\n\nLos tipos escalares de Ridgun son directos y sin sorpresas:\n\n| Tipo | Qué es en realidad | Ejemplos |\n|---|---|---|\n| `Int` | Entero de 64 bits con signo (`i64`) | `0`, `42`, `-100`, `0xFF00`, `1_000_000` |\n| `U64` | Entero de 64 bits sin signo (`u64`) para criptografía y sistemas | `0xdeadbeefcafe0001`, `a xor b`, `x rotr 24` |\n| `Byte` | Octeto sin signo (`0..255`) en tensores y buffers binarios | `Tensor[Byte * 64]` |\n| `Real` / `Float` | Decimal de doble precisión (`f64`) | `3.14159`, `0.001`, `-2.5` |\n| `String` | Cadena de texto o buffer binario inmutable con longitud explícita | `\"Hola\"`, `'ruta\\cruda'`, `sha256 raw \"abc\"` |\n| `Char` | Código de carácter | Devuelto por `str char at` |\n| `Bool` | Booleano de toda la vida | `True`, `False` |\n| `()` | Vacío (*Unit*, cuando solo imprimes o haces I/O) | `()` |\n\n### Operadores a nivel de bit de 1 ciclo y flexibilidad léxica (`fn`, `op`, `where`)\nPara criptografía, protocolos binarios y sistemas de alto rendimiento, `Int` y `U64` cuentan con operadores nativos a nivel de bit y rotación compilados a una sola instrucción máquina:\n- **Lógicos y bit a bit**: `and`, `or`, `xor`, `not`\n- **Desplazamientos y rotaciones de 64 bits**: `shl` (izquierda), `shr` (derecha lógica sin signo), `rotl` (rotación izquierda), `rotr` (rotación derecha)\n\nAdemás, el vocabulario de Ridgun es deliberadamente mínimo y ortogonal:\n- **`where` no es una palabra reservada**: los grafos paralelos se expresan exclusivamente con `||`, por lo que `where` es un identificador normal que puedes usar como nombre de variable o función.\n- **`fn` y `op` pueden formar parte de los nombres**: después de `fn ::` u `op ::`, las propias palabras `fn` y `op` pueden aparecer como parte del nombre de tu función u operador (`fn :: op Int => Int`, `op :: Int fn Int => Int`, `op :: A op B => A`).\n- **Retornos múltiples separados por espacios (`=> Int Int`)**: cuando una función devuelve varios valores, su salida se escribe separando los tipos con espacios (`fn :: dividir Int Int => Int Int`), y en la llamada puedes desestructurarla directamente sin alojar tuplas en el heap (`cociente, resto = dividir 17 5`).\n\n### ¿Cansado de escribir `65536` o `1048576` y rezar para no haberte comido un dígito?\nEn Ridgun los literales numéricos aceptan directamente los sufijos de memoria **`_KB`**, **`_MB`** y **`_GB`** y los sufijos de tiempo **`_ms`**, **`_s`** y **`_min`**, además de separadores numéricos:\n\n```ridgun\nfn :: tamano buffer => Int\n      tamano buffer =  64_KB      -- El compilador lo traduce a 65536\n\nfn :: limite archivo => Int\n      limite archivo =  16_MB     -- El compilador lo traduce a 16777216\n\nfn :: mascara octeto => Int\n      mascara octeto =  0xFF_00   -- Hexadecimal limpio y legible\n```\n\n---\n\n## 3.4. Comillas dobles (`\"...\"`) vs. Comillas simples (`'...'`)\n\nEn muchos lenguajes las comillas simples y dobles hacen exactamente lo mismo (un desperdicio). En Ridgun cada una tiene una misión clarísima:\n\n### 1. Comillas dobles (`\"...\"`): Inteligentes e interpoladas\nInterpretan escapes (`\\n`, `\\t`, `\\\"`, `\\\\`) y **evalúan cualquier variable o expresión que metas entre llaves `{...}`**:\n\n```ridgun\nfn :: resumen pedido String Int Int    => String\n      resumen pedido item   uds precio =\n        \"Has pedido {uds}x {item}. Total a pagar: {uds * precio} euros.\"\n```\n\n*(Truco: si necesitas escribir una llave literal dentro de comillas dobles —por ejemplo al generar un script de shell `\"$\\{VAR:-default\\}\"` o un JSON—, puedes escaparla con barra invertida `\\{` y `\\}` o duplicarla `{{` y `}}`).*\n\n### 2. Comillas simples (`'...'`): Crudas y literales (*Raw Strings*)\nLo que escribes entre comillas simples sale **tal cual**, sin tocar ni una barra invertida `\\`, ni una llave `{}`. Perfecto para cuando generas código en otro lenguaje, escribes comandos de shell o trabajas con rutas llenas de barras:\n\n```ridgun\nfn :: comando sed => String\n      comando sed =  's/\\([0-9]+\\)/[\\1]/g'\n```\n\n### Tu caja de herramientas para cadenas (`String`)\nUnir cadenas es tan simple como sumarlas con `+`: `\"Hola, \" + nombre`. Y cuando necesitas hacer cirugía fina sobre un texto, tienes estas funciones nativas con espacios naturales listas sin importar nada:\n\n- `str len s` $\\rightarrow$ longitud de `s`.\n- `str char at s i` $\\rightarrow$ código numérico (`Int`) del carácter en la posición `i` (`-1` si te sales).\n- `str slice s inicio fin` $\\rightarrow$ recorta desde `inicio` hasta `fin` (sin incluir `fin`).\n- `char from code c` $\\rightarrow$ convierte un código numérico (`Int`, p. ej. `10` para `\\n` o `34` para `\"`) en un `String` de 1 carácter.\n- `str contains s aguja` y `str starts with s prefijo` $\\rightarrow$ devuelven `True` o `False`.\n- `int to str n` y `str to int s` $\\rightarrow$ convierten de número a texto y viceversa (¡`str to int` entiende incluso `\"0xFF\"`!).\n\n---\n\n## 3.5. Bloques de varias líneas, la regla universal del `=` y variables `mut`\n\nCuando una función no cabe en una sola línea, haces un salto de línea después del `=` e indentas el bloque.\n\nMira cómo se lee un bloque paso a paso:\n\n```ridgun\nfn :: calcular factura Int  Int => Int\n      calcular factura base iva =\n        impuestos = base * iva / 100\n        gestion = 5\n        echo \"Desglose -> Base:\" base \"Impuestos:\" impuestos\n        base + impuestos + gestion\n```\n\nCuatro reglas de oro que hacen que los bloques en Ridgun sean limpios y uniformes:\n1. **Inmutable por defecto sin `let` ni `const`**: escribes `impuestos = ...` y ya tienes tu constante local inmutable. Si por descuido intentas sobrescribir `impuestos = 99` más abajo en el mismo bloque, el compilador te frena en seco.\n2. **Variables mutables explícitas con `mut`**: cuando de verdad quieres ir actualizando un acumulador local paso a paso dentro de una función, lo declaras con **`mut`** y luego lo reasignas libremente con `=`:\n   ```ridgun\n   fn :: aplicar recargos Int    => Int\n         aplicar recargos precio =\n           mut total = precio\n           total = total + 10\n           total = total * 2\n           total\n   ```\n   *(Y si `total` guarda una lista o estructura en memoria, la política **`RMM2`** de Ridgun suma `+1` al nuevo valor antes de descontar `-1` al antiguo, liberándolo al instante si nadie más lo usa).*\n3. **La regla universal del `=`**: detrás de **cualquier `=`** (en una función, en un operador, en una variable local `x =` o en una rama condicional) puedes poner siempre cualquiera de las tres formas de bloque de Ridgun:\n   - **`(nada)`**: líneas secuenciales indentadas (como arriba).\n   - **`|`**: un árbol de guardas condicionales.\n   - **`||`**: un grafo de cálculos en paralelo con `->`.\n4. **La última expresión es siempre el resultado**: `base + impuestos + gestion` es lo que devuelve `calcular factura`. Sin `return`.\n\nEn el **Capítulo 04** vamos a ver cómo tomar decisiones complejas —incluyendo árboles de decisión de varios niveles con `|.`— sin escribir jamás un `if/else` ni un bucle `while`: bienvenido al mundo de las **guardas booleanas** y la **recursión de cola de coste cero**.\n"}, {"num":"04","slug":"04-pattern-matching-y-guardas","file":"04-pattern-matching-y-guardas.md","title":"Capítulo 04: Adiós al `if/else`, adiós al `while` (Pattern Matching, Guardas y TCO)","short_title":"Adiós al `if/else`, adiós al `while` (Pattern Matching, Guardas y TCO)","markdown":"# Capítulo 04: Adiós al `if/else`, adiós al `while` (Pattern Matching, Guardas y TCO)\n\nCuando le cuentas a alguien que en Ridgun **no existe la palabra clave `if`, ni `else`, ni `switch`, ni `for`, ni `while`**, suele mirarte como si le hubieras dicho que vas a construir una casa sin martillo ni clavos:\n\n> *\"¿Que no hay `if` ni `while`? ¿Y cómo narices tomo una decisión o recorro un millón de datos?\"*\n\nPues resulta que `if/else` y `while` son herramientas bastante toscas heredadas de cómo funcionaban los saltos (`GOTO`) en los años 50. En Ridgun los sustituimos por tres piezas que encajan como un guante:\n1. ***Pattern Matching*** (cuando decides según la **forma o valor exacto** del dato).\n2. **Guardas booleanas `|`** (cuando decides según una **condición o rango**).\n3. **Recursión de cola con TCO** (que el compilador convierte por debajo en un bucle `loop` nativo ultrarrápido).\n\nVamos a verlas en acción.\n\n---\n\n## 4.1. *Pattern Matching*: Cuando el argumento ya te da la respuesta\n\nEn el capítulo anterior ya vimos un adelanto. En lugar de recibir una variable genérica `x` y abrir dentro de la función cinco `if (x == ...)`, en Ridgun pones los casos directamente en la puerta de entrada de la función:\n\n```ridgun\nfn :: codigo http Int => String\n      codigo http 200 =  \"OK: Todo fue sobre ruedas\"\n      codigo http 301 =  \"Movido permanentemente\"\n      codigo http 404 =  \"No encontrado (¿has mirado debajo del sofá?)\"\n      codigo http 500 =  \"Fuego en el servidor\"\n      codigo http n   =  \"Código desconocido: {n}\"\n```\n\nRidgun prueba las filas **de arriba abajo**:\n- Si entra `404`, salta directo a la tercera fila.\n- Si entra `418`, ninguna de las cuatro primeras filas coincide, así que cae en la última (`n`), que atrapa cualquier entero y lo nombra `n` para que puedas imprimirlo.\n- ¿Y si en el último caso ni siquiera te importa qué número era? Pones un guion bajo `_` (*comodín*) y te olvidas: `codigo http _ = \"Otro código\"`.\n\n---\n\n## 4.2. Guardas booleanas (`|`): Tu bisturí para rangos, variables condicionales y árboles de decisión\n\n*\"Vale, el pattern matching mola cuando busco el `200` o el `404`. ¿Pero qué hago si quiero comprobar si `nota >= 5` o si `edad > 18 and edad < 65`? ¡No voy a escribir 47 filas con todos los números del 18 al 65!\"*\n\n¡Claro que no! Para eso están las **guardas (`|`)**.\n\nCuando el resultado depende de una desigualdad o de una combinación lógica, después del `=` de la función (o de cualquier variable local) abres una escalera de barras verticales `|`:\n\n```ridgun\ncalificar Int => String\ncalificar nota =\n  | nota < 0   = \"Nota imposible (¿puntos negativos?)\"\n  | nota < 5   = \"Suspenso\"\n  | nota < 7   = \"Aprobado\"\n  | nota < 9   = \"Notable\"\n  | nota <= 10 = \"Sobresaliente\"\n  | otherwise  = \"Te has pasado de la escala\"\n```\n\nMíralo bien:\n- El signo `=` del encabezado (`calificar nota =`) se alinea debajo de `=>` igual que en cualquier otra función.\n- Debajo se lee de arriba abajo igual que una tabla de tarifas: cada línea `| condicion = resultado` se comprueba en orden. En cuanto una da `True`, devuelve ese resultado y se acabó.\n- Al final pones **`| otherwise = ...`**, que significa literalmente *\"en cualquier otro caso\"* (tu red de seguridad para que nunca quede un camino sin retorno).\n\n### Lógica booleana en minúsculas claras (`and`, `or`, `xor`, `not`)\n¿Te has fijado en que muchos lenguajes usan `|` para bits, `||` para booleanos, `!` para negar... y cuando lees una condición compleja parece que un gato ha caminado sobre el teclado (`if (!a && (b || c))`)?\n\nEn Ridgun, como `|` ya es el símbolo sagrado de las guardas y de los tipos algebraicos, y `||` es el operador de paralelismo, **los operadores booleanos se escriben con palabras claras en minúsculas**:\n\n- **`and`**: se cumplen las dos cosas (`edad >= 18 and tiene_carnet`).\n- **`or`**: se cumple al menos una (`dia == \"sabado\" or dia == \"domingo\"`).\n- **`xor`**: se cumple una u otra, pero no las dos a la vez.\n- **`not`**: invierte el booleano (`not (esta_vacio texto)`).\n\nMira qué limpio queda el clásico problema de los años bisiestos:\n\n```ridgun\nfn :: es bisiesto Int => Bool\n      es bisiesto a   =\n        | (a % 400) == 0                  = True\n        | (a % 4) == 0 and (a % 100) != 0 = True\n        | otherwise                       = False\n```\n\nCero símbolos crípticos. Lo lee alguien que no sabe Ridgun y lo entiende a la primera.\n\n### Variables locales condicionales (`x =` + `|`)\nComo en Ridgun todo `=` sigue la misma regla, **también puedes usar `|` para asignar una variable local** sin tener que crear una función auxiliar aparte:\n\n```ridgun\nfn :: precio billete Int  Bool => Int\n      precio billete base vip  =\n        descuento =\n          | vip        = 20\n          | base > 100 = 10\n          | otherwise  = 0\n        base - (base * descuento / 100)\n```\n\n### Árboles de decisión anidados y el limitador compacto `|.`\n*\"¿Y si dentro de una rama `| cond =` o `| otherwise =` quiero abrir otro sub-árbol de guardas `|` de 3 o 4 niveles de profundidad y luego volver a un nivel superior?\"*\n\nPuedes anidar `|` dentro de `|` tantos niveles como quieras. Y cuando un bloque `|` anidado termina pero debajo siguen más ramas de un nivel padre (o más sentencias del bloque), colocas **`|.`** al final de su última línea (`| otherwise = valor |.`) para indicar sin ninguna ambigüedad que ese sub-árbol se cierra y vuelves al nivel anterior:\n\n```ridgun\nfn :: enrutar peticion Int    Int Bool    Bool  Int  Int => Int\n      enrutar peticion metodo rol firmada admin kb   lim =\n        | metodo == 0 =\n          | kb == 0   = 204\n          | otherwise = 200 |.\n        | metodo == 1 =\n          | not firmada = 401\n          | otherwise =\n            -- Nivel 2: petición POST firmada\n            | lim > 0 =\n              -- Nivel 3: control de rate-limit\n              | admin =\n                -- Nivel 4: excepción para administradores\n                | kb > 10000 = 413\n                | otherwise  = 202 |.\n              | otherwise = 429 |.\n            | kb > 1000 =\n              -- Nivel 3: hemos vuelto desde el Nivel 4 gracias a `|.`\n              | rol >= 2 and admin = 201\n              | otherwise          = 413 |.\n            | otherwise = 201 |.\n        | otherwise = 405\n```\n\nFíjate en lo limpio que es:\n- En un árbol simple de 1 nivel (o al final de toda la función) **nunca hace falta poner `|.`** (sería ruido innecesario).\n- Solo escribes `|.` al cerrar una rama anidada cuando debajo continúa una rama de un nivel superior.\n\n### Bloques de varias líneas dentro de una guarda (`| cond =` + bloque indentado)\nIgual que después del `=` de una función normal puedes abrir un bloque indentado de varias líneas, **después del `=` de cualquier guarda `| cond =` o `| otherwise =` también puedes hacer un salto de línea y abrir un bloque secuencial**:\n\n```ridgun\nfn :: ajustar ventana Int Int    => Int\n      ajustar ventana idx limite =\n        | idx >= limite =\n            tope = limite - 1\n            escalado = tope * 2\n            escalado + 10\n        | otherwise =\n            siguiente = idx + 1\n            siguiente * 2\n```\n\nCada rama de la guarda tiene su propio bloque local limpio y su última línea es el valor que devuelve esa rama.\n\n---\n\n## 4.3. \"¿Sin `while`? ¿Y no va a reventar la pila si recorro un archivo grande?\"\n\nHablemos del elefante en la habitación.\n\nSi vienes de Python, Java o JavaScript, te han enseñado desde pequeñito que *\"la recursión es elegante en la pizarra de la universidad, pero en el mundo real desborda la pila (`StackOverflowError`) a las 1.000 vueltas; usa un bucle `while`\"*.\n\nEso es verdad en lenguajes que **no** optimizan las llamadas de cola. Pero en un lenguaje funcional de sistemas como Ridgun, **una recursión de cola ES un bucle `while` disfrazado de función pura**.\n\n### ¿Qué diferencia hay entre una recursión normal y una recursión de cola?\nFíjate en estas dos funciones que cuentan hacia atrás desde `n` hasta `0` sumando los números:\n\n```ridgun\n-- Versión A: Recursión NORMAL (deja trabajo pendiente para la vuelta)\nfn :: sumar lento Int => Int\n      sumar lento 0   =  0\n      sumar lento n   =  n + (sumar lento (n - 1))\n\n-- Versión B: Recursión DE COLA (lleva la cuenta al día en `acumulado`)\nfn :: sumar rapido bucle Int Int       => Int\n      sumar rapido bucle 0   acumulado =  acumulado\n      sumar rapido bucle n   acumulado =  sumar rapido bucle (n - 1) (acumulado + n)\n```\n\n- En la **Versión A**, antes de poder sumar `n + ...`, la función tiene que esperar a que termine `sumar lento (n - 1)`. Eso obliga al ordenador a guardar `n` en la pila en cada paso.\n- En la **Versión B**, la llamada a `sumar rapido bucle` **es lo último que ocurre en la línea**. No queda nada pendiente detrás de ella. Ya le pasas la suma actualizada en `acumulado + n`.\n\n### El truco de magia de `ridgunc` (TCO: *Tail-Call Optimization*)\nCuando `ridgunc` compila `sumar rapido bucle`, ve que la función se llama a sí misma al final de la cláusula y dice:\n\n> *\"¿Para qué voy a crear un marco de pila nuevo si el actual ya no sirve para nada? Voy a sobrescribir `n` con `n - 1`, sobrescribir `acumulado` con `acumulado + n` y saltar al principio con un `loop { ... continue; }` nativo.\"*\n\nResultado:\n1. Puedes llamar a `sumar rapido bucle 100_000_000 0` (cien millones de vueltas) y **gastará exactamente 0 bytes extra de pila**.\n2. Va igual de rápido que un bucle `while` escrito a mano en Rust o C, pero sin haber tenido que declarar ni una sola variable mutable en tu código Ridgun.\n\n---\n\n## 4.4. El patrón maestro que usarás en todo programa Ridgun\n\nCada vez que en otro lenguaje pensarías *\"voy a hacer un bucle `while` con un índice `i` y un acumulador\"*, en Ridgun escribes una pareja de funciones como esta (la función principal limpia y su ayudante de cola):\n\n```ridgun\nfn :: buscar caracter bucle String Int Int Int     => Int\n      buscar caracter bucle texto  pos fin buscado =\n        | pos >= fin                         = -1\n        | (str char at texto pos) == buscado = pos\n        | otherwise                          = buscar caracter bucle texto (pos + 1) fin buscado\n\nfn :: buscar caracter String Int     => Int\n      buscar caracter texto  buscado =  buscar caracter bucle texto 0 (str len texto) buscado\n```\n\nMira las tres guardas de `buscar caracter bucle`:\n1. ¿Llegué al final (`pos >= fin`)? Devuelvo `-1` (fin del bucle).\n2. ¿Encontré el carácter en `pos`? Devuelvo `pos` (fin del bucle).\n3. ¿No es este? Paso al siguiente (`pos + 1`) con una llamada de cola (que el compilador convierte en `continue;`).\n\nLimpio, imposible de tener *bugs* de variables globales pisadas y rápido como un rayo.\n\nEn el **Capítulo 05** vamos a meterle mano a las colecciones de datos: **listas, tuplas, funciones que aceptan infinitos argumentos (`...`) y las máscaras de secuencias estilo J/APL**.\n"}, {"num":"05","slug":"05-listas-tuplas-y-secuencias","file":"05-listas-tuplas-y-secuencias.md","title":"Capítulo 05: Listas, Tuplas y el truco ninja de las Secuencias","short_title":"Listas, Tuplas y el truco ninja de las Secuencias","markdown":"# Capítulo 05: Listas, Tuplas y el truco ninja de las Secuencias\n\nUn programa que solo mueve un número o un texto a la vez sirve de poco. En la vida real manejas listas de archivos, filas de una base de datos, paquetes de red o coordenadas.\n\nPara eso, Ridgun te da tres envases distintos, cada uno pensado para un trabajo muy concreto:\n1. **Listas (`[T]`)**: *\"Tengo muchos elementos del mismo tipo (o ninguno) y quiero recorrerlos\"*.\n2. **Tuplas (`(A, B)`)**: *\"Quiero devolver un par o un trío de cosas distintas juntas sin crear un tipo nuevo\"*.\n3. **Secuencias y máscaras (`s(_ + _)`, `(+ _ _ +)`)**: *\"Quiero filtrar o reordenar argumentos al vuelo como si tuviera un colador matemático\"*.\n\nVamos una por una.\n\n---\n\n## 5.1. Listas (`[T]`): El pan de cada día\n\nEn Ridgun, si pones corchetes alrededor de un tipo, tienes una lista de ese tipo:\n- `[Int]` es una lista de enteros: `[10, 20, 30]`.\n- `[String]` es una lista de textos: `[\"manzana\", \"pera\"]`.\n- `[]` es la lista vacía (el comodín que encaja con cualquier `[T]`).\n\n> *\"Oye, ¿puedo meter un número y un texto juntos en la misma lista tipo `[1, \"dos\"]`?\"*\n> Tal cual, **no** (y dale las gracias al compilador por impedírtelo, porque así nunca te explotará una suma en producción al encontrarse un texto sorpresa). En el Capítulo 06 veremos cómo resolver el caso de `[1, \"dos\"]` con elegancia total usando un Tipo Algebraico (igual que hace Haskell).\n\n### Cómo se trocea una lista sin usar índices `i`, `j`, `k`: `[]` y `(x:xs)`\nEn los lenguajes imperativos, recorrer una lista suele implicar `for (int i = 0; i < lista.size(); i++)`, con el clásico riesgo de pasarte por uno (*off-by-one*).\n\nEn Ridgun no cuentas índices; **desmontas la lista por la cabeza**:\n- `[]`: encaja si la lista está vacía.\n- `(x:xs)`: encaja si la lista tiene al menos un elemento. Mete el primer elemento en `x` (la **cabeza**) y el resto de la lista en `xs` (la **cola**).\n\nMira qué gusto da sumar una lista o contar cuántos elementos tiene:\n\n```ridgun\nfn :: sumar lista [Int]  => Int\n      sumar lista []     =  0\n      sumar lista (x:xs) =  x + (sumar lista xs)\n\nfn :: contar elementos [A]    => Int\n      contar elementos []     =  0\n      contar elementos (_:xs) =  1 + (contar elementos xs)\n```\n\nY un detalle técnico que te alegrará el día: en Ridgun, sacar la cola `xs` en `(x:xs)` **no copia el resto de la lista en memoria**. Internamente es una vista sobre el mismo vector que solo avanza el puntero de inicio en `1` ($O(1)$ instantáneo).\n\n### Puedes destapar varios elementos de golpe\nEl patrón `:` da muchísimo juego cuando estás parseando comandos o protocolos:\n\n```ridgun\nfn :: interpretar comando [String]                  => String\n      interpretar comando []                        =  \"No has escrito nada\"\n      interpretar comando (\"ayuda\":_)               =  \"Mostrando la ayuda...\"\n      interpretar comando (\"copiar\":origen:dest:[]) =  \"Copiando de {origen} a {dest}\"\n      interpretar comando (cmd:_)                   =  \"Comando desconocido: {cmd}\"\n```\n\nMira la tercera fila: `(\"copiar\":origen:dest:[])` comprueba de un solo plumazo que la lista tenga **exactamente 3 elementos**, que el primero sea `\"copiar\"`, y te deja el segundo y el tercero servidos en bandeja en `origen` y `dest`. Intenta escribir eso en C o Java y verás cuántas líneas de `args.length == 3 && args[0].equals(\"copiar\")` te salen.\n\n### Unir listas con doble dos puntos (`::`)\nCuando estás en el lado derecho del `=` (en una expresión) y quieres pegar dos listas, usas **`::`**:\n\n```ridgun\nfn :: pegar listas [Int] [Int] => [Int]\n      pegar listas a     b     =  a :: b\n\nfn :: anadir detras [Int] Int => [Int]\n      anadir detras xs    x   =  xs :: [x]\n```\n\n*(Regla mnemotécnica rápida: un solo `:` en los patrones desmonta la lista; dos `::` en las expresiones pegan dos listas).*\n\n¿Y si de verdad quieres sacar el elemento número 5 directamente sin recorrer nada? Usa corchetes pegados al nombre: `mi_lista[5]`.\n\n---\n\n## 5.2. Funciones variádicas (`T...`): \"¡Pásame todos los que quieras!\"\n\nA veces quieres que quien llame a tu función pueda escribir `sumar varios 4 19 2 88 7` cómodamente, sin obligarle a envolver los números entre corchetes `[4, 19, 2, 88, 7]`.\n\nPon tres puntos **`...`** detrás del último tipo de tu firma, y dentro de tu función lo recibirás automáticamente empaquetado como una lista:\n\n```ridgun\nfn :: sumar varios Int... => Int\n      sumar varios nums   =  sumar lista nums\n\nfn :: main => ()\n      main =\n        echo (sumar varios 10 20 30)       -- Imprime 60\n        echo (sumar varios 1 2 3 4 5 6 7)  -- Imprime 28\n```\n\n---\n\n## 5.3. Tuplas y la Unificación de Firmas con Espacios (`Int Int [String String] String`)\n\nEn muchos lenguajes devolver dos o más cosas desde una función es un dolor: o creas una clase auxiliar tonta `ResultadoConPosicion`, o llenas la firma de paréntesis y comas redundantes.\n\nEn Ridgun, **una lista de argumentos `Int String Int` y una tupla `(Int, String, Int)` son conceptualmente lo mismo: una secuencia tipada (`seq`)**. Por eso, en las firmas de tipos puedes separar los elementos de una tupla simplemente con **espacios**, tanto después de `=>`, como dentro de listas `[...]` y dentro de paréntesis `(...)`:\n\n```ridgun\n-- Dos enteros de retorno separados por espacio:\nfn :: dividir y resto Int Int => Int Int\n      dividir y resto a   b   =  (a / b, a % b)\n\n-- Firma compleja sin ruido de comas ni paréntesis exteriores:\nfn :: parsear cabecera String => Int Int [String String] String\n      parsear cabecera tag    =  (200, 2, [(\"Host\", \"ridgun.org\"), (\"X-Tag\", tag)], \"OK\")\n\n-- Lista de tuplas [String String] como parámetro de entrada:\nfn :: buscar cabecera [String String] String => String\n      buscar cabecera []              _      =  \"no encontrada\"\n      buscar cabecera ((k, v):resto)  clave\n        | k == clave = v\n        | otherwise  = buscar cabecera resto clave\n```\n\nFíjate en la elegancia de `=> Int Int [String String] String`:\n- Después de `=>`, `Int Int [String String] String` significa exactamente lo mismo que `(Int, Int, [(String, String)], String)`.\n- Dentro de corchetes, `[String String]` significa una lista de pares de textos `[(String, String)]`.\n- Dentro de paréntesis (cuando pasas una tupla como un único parámetro de entrada), `(Int String)` significa exactamente lo mismo que `(Int, String)`:\n  ```ridgun\n  fn :: explicar division (Int Int)         => String\n        explicar division (cociente, resto) =  \"Cabe a {cociente} y sobran {resto}\"\n  ```\n- **¿Por qué esto no crea ninguna ambigüedad en Ridgun?** Porque a diferencia de Haskell (donde `Maybe Int` aplica un constructor de tipos por yuxtaposición), en Ridgun los tipos parametrizados usan paréntesis explícitos como `Tensor(Float, 3, 3)` y las listas usan `[T]`. Así, dos tipos separados por espacio (`T1 T2`) significan siempre y sin excepción una secuencia/tupla de tipos, manteniendo compatibilidad al 100% con la sintaxis con comas.\n\n### El detalle estrella: Desempaquetado automático entre funciones\nSupón que tienes `dividir y resto` (que devuelve `Int Int`) y otra función `sumar par Int Int => Int` (que espera 2 enteros). En Ridgun puedes enchufar una función dentro de la otra directamente:\n\n```ridgun\nfn :: sumar par Int Int => Int\n      sumar par x   y   =  x + y\n\nfn :: main => ()\n      main =\n        -- dividir y resto 17 5 devuelve (3, 2), y sumar par recibe 3 y 2 directamente:\n        echo (sumar par (dividir y resto 17 5))  -- Imprime 5\n```\n\n---\n\n## 5.4. El truco ninja: Secuencias y Máscaras Posicionales (`s(_ + _)`, `(+ _ _ +)`)\n\nAquí viene una de las joyas más originales de Ridgun, heredada directamente de los lenguajes vectoriales como J y APL.\n\nImagina que recibes una ristra de argumentos con el patrón de secuencia **`(s)`** y quieres quedarte solo con algunos y descartar otros sin declarar cinco variables con nombres inventados (`_a`, `b`, `_c`, `d`...).\n\nLe aplicas a `s` una **máscara de tupla con `+` (quédatelo) y `_` (descártalo)**:\n\n- **`s(_ + _)`**: de 3 elementos, descarta el primero (`_`), quédate con el segundo (`+`) y descarta el tercero (`_`).\n- **`s(+ _ +)`**: quédate con el primero y el tercero; devuelve la secuencia con esos dos.\n- **`s(_ _ +...)`**: descarta los dos primeros (`_ _`) y aplica `+...` **a todos los demás que vengan detrás**, sean cuantos sean.\n\nMíralo funcionando:\n\n```ridgun\nfn :: el del medio Int Int Int => Int\n      el del medio (s)         =  s(_ + _)\n\nfn :: descartar dos primeros Int... => [Int]\n      descartar dos primeros (s)    =  s(_ _ +...)\n\nfn :: main => ()\n      main =\n        echo (el del medio 100 42 999)              -- Imprime 42\n        echo (descartar dos primeros 1 2 10 20 30)  -- Imprime [10, 20, 30]\n```\n\nMejor aún: puedes colocar una máscara **`(+ _ _ +)`** como una etapa intermedia dentro de una tubería **`->`** (`FR-COMP-014`). Cuando una función u operador devuelve una tupla de varios valores, la máscara filtra qué posiciones conservas (`+`) y cuáles descartas (`_`), y los elementos seleccionados se desempaquetan automáticamente como argumentos de la siguiente función de la tubería:\n\n```ridgun\nfn :: parsear paquete String => Int Int String String\n      parsear paquete ver    =  (200, 4, ver, \"OK\")\n\nfn :: combinar codigo Int  String => String\n      combinar codigo code msg    =  \"{code}:{msg}\"\n\nfn :: main => ()\n      main =\n        -- De (200, 4, \"v0.9.9\", \"OK\"), (+ _ _ +) selecciona el 1.º (200) y el 4.º (\"OK\")\n        -- y los pasa como los 2 argumentos de `combinar codigo`:\n        parsear paquete \"v0.9.9\" -> (+ _ _ +) -> combinar codigo -> resumen\n        echo resumen  -- Imprime 200:OK\n```\n\nAdemás, si usas el operador coma `,` fuera de paréntesis (`lista1 , lista2`), Ridgun aplana ambas colecciones en una única secuencia continua.\n\nEn el **Capítulo 06** vamos a dar el paso que convierte a un programador funcional en un arquitecto de primera: **crear tus propios Tipos de Datos Algebraicos (ADTs), escribir funciones polimórficas con `A`..`Z` y fabricar tus propios operadores a medida**.\n"}, {"num":"06","slug":"06-tipos-algebraicos-y-polimorfismo","file":"06-tipos-algebraicos-y-polimorfismo.md","title":"Capítulo 06: Tipos de Datos Algebraicos (ADTs), Polimorfismo y por qué aquí no queremos `null` ni `Any`","short_title":"Tipos de Datos Algebraicos (ADTs), Polimorfismo y por qué aquí no queremos `null` ni `Any`","markdown":"# Capítulo 06: Tipos de Datos Algebraicos (ADTs), Polimorfismo y por qué aquí no queremos `null` ni `Any`\n\nEn 1965, Tony Hoare inventó la referencia nula (`null` / `nil`). Cuarenta años después pidió perdón públicamente y la llamó *\"mi error de mil millones de dólares\"*.\n\n¿Por qué? Porque en los lenguajes con `null`, una función te promete en su firma que te va a devolver un `Usuario`... y cuando menos te lo esperas te devuelve `null` y te tira abajo el servidor a las tres de la mañana.\n\nY otro tanto ocurre con la herencia de objetos y el tipo `Any` (u `Object`): metes un número y un texto en una lista `[1, \"dos\"]`, el lenguaje se encoge de hombros y dice *\"vale, pues ahora esto es una `List[Any]`, buena suerte adivinando qué hay dentro cuando la recorras\"*.\n\nEn Ridgun cortamos esos dos problemas de raíz con **Tipos de Datos Algebraicos (ADTs)** y **Polimorfismo Paramétrico**. Suena a nombre de asignatura dura, pero en cinco minutos vas a ver que es la forma más natural del mundo de modelar datos.\n\n---\n\n## 6.1. Tipos Producto (Registros): Tus `struct` de toda la vida, pero con superpoderes\n\nCuando quieres agrupar varios datos que pertenecen a una misma entidad (por ejemplo, un servidor con su nombre, su IP y su puerto), defines un **`type`** con sus campos:\n\n```ridgun\ntype Servidor = host: String, puerto: Int, tls_activo: Bool\n```\n\nCon solo escribir esa línea, Ridgun te regala **cuatro cosas** automáticamente:\n\n### 1. El constructor `Servidor`\n```ridgun\nfn :: mi nodo => Servidor\n      mi nodo =  Servidor \"api.ejemplo.com\" 443 True\n```\n\n### 2. Una función *getter* pura para cada campo (`host`, `puerto`, `tls_activo`)\nNo tienes que escribir `s.getHost()` ni nada parecido; cada nombre de campo es directamente una función que extrae ese dato:\n\n```ridgun\nfn :: url conexion Servidor => String\n      url conexion srv      =  \"Conectar a \" + (host srv) + \" en el puerto {puerto srv}\"\n```\n\n### 3. Actualización funcional de registros (`with campo: valor`)\nImagina un registro de configuración con 12 o 15 campos (como las opciones de un comando `ls` o de un servidor web) y quieres cambiar solo uno o dos campos sin tocar el resto. En vez de reconstruir el registro pasando los 15 campos a mano, usas **`with`** y dos puntos **`:`** (exactamente igual que en la definición del `type`):\n\n```ridgun\nfn :: activar modo dev Servidor => Servidor\n      activar modo dev srv      =  srv with puerto: 8080, tls_activo: False\n```\n\nLo mejor de los dos mundos:\n- En tu código es **100% inmutable y seguro** (el compilador comprueba que `puerto` y `tls_activo` existan en `Servidor` y tengan el tipo correcto).\n- Por debajo, si `srv` no está compartido con nadie más, el ejecutable nativo reutiliza su memoria *in-place* (`Arc::try_unwrap`) sin copiar el resto de campos.\n\n### 4. *Pattern matching* completo por si quieres abrir el registro en canal\n```ridgun\nfn :: es puerto seguro Servidor              => Bool\n      es puerto seguro (Servidor _ 443 True) =  True\n      es puerto seguro _                     =  False\n```\n\n---\n\n## 6.2. Tipos Suma (Variantes con `|`): Cómo jubilar a `null`, a las excepciones y a la herencia\n\nAhora viene lo bueno.\nUn registro normal tiene `host` **Y** `puerto` **Y** `tls_activo`.\nPero en el mundo real muchas veces necesitas decir: *\"Un método de pago es **O BIEN** una tarjeta con su número, **O BIEN** una transferencia con su IBAN, **O BIEN** efectivo (que no lleva ningún dato extra)\"*.\n\nEn orientación a objetos tendrías que crear una interfaz `MetodoPago`, tres subclases en tres archivos distintos, constructores, `instanceof`... En Ridgun es **una línea**:\n\n```ridgun\ntype MetodoPago = Tarjeta String Int | Transferencia String | Efectivo\n```\n\nY mira qué pasa cuando procesas un `MetodoPago` en una función:\n\n```ridgun\nfn :: describir pago MetodoPago           => String\n      describir pago (Tarjeta num _)      =  \"Pago con tarjeta terminada en {num}\"\n      describir pago (Transferencia iban) =  \"Transferencia desde la cuenta {iban}\"\n      describir pago Efectivo             =  \"Pago en metálico en ventanilla\"\n```\n\nCada variante (`Tarjeta`, `Transferencia`, `Efectivo`) lleva pegados únicamente los datos que tienen sentido para ella. Es **imposible** construir un pago en `Efectivo` que tenga un `iban` colgado por error.\n\n---\n\n## 6.3. \"¿Y cómo meto `[1, \"dos\"]` en una lista sin usar `Any`?\"\n\nVolvamos a la pregunta del millón. Imagina que estás leyendo un archivo CSV o JSON donde una celda puede ser un número entero, un texto o estar vacía.\n\nSi tuvieras un tipo `Any`, meterías `[1, \"dos\"]` y perderías toda la ayuda del compilador: a partir de ese momento cualquier operación sobre la lista sería caminar con los ojos vendados.\n\nEn Ridgun (igual que en Haskell o Rust), creas en dos segundos un tipo suma que explica exactamente qué cosas pueden vivir dentro de esa lista:\n\n```ridgun\ntype ValorCelda = Entero Int | Texto String | Vacio\n\nfn :: formatear celda ValorCelda => String\n      formatear celda (Entero n) =  \"Número: {n}\"\n      formatear celda (Texto s)  =  \"Texto: {s}\"\n      formatear celda Vacio      =  \"(vacío)\"\n\nfn :: mi fila => [ValorCelda]\n      mi fila =  [Entero 1, Texto \"dos\", Vacio]\n```\n\n¿Ves la diferencia?\n- Con `Any`, el compilador no sabe si en la lista hay enteros, cadenas o una cafetera conectada por USB.\n- Con `[ValorCelda]`, puedes mezclar números y textos en la misma lista, **pero el compilador sabe al 100% que solo existen esas tres posibilidades** y te obliga a desempaquetar cada caso (`Entero n`, `Texto s`, `Vacio`) antes de usarlo. Seguridad total sin perder ni un ápice de flexibilidad.\n\n---\n\n## 6.4. `Option` y `Result`: Cuando algo puede no estar o puede fallar\n\nComo en Ridgun no existe `null` ni existen excepciones que salten por los aires (`throw new Exception()`), el lenguaje trae integrados dos tipos suma universales:\n\n1. **`Option`**: o tienes **`Some valor`**, o tienes **`None`** (nada).\n2. **`Result`**: o la operación salió bien (**`Ok valor`**), o falló por un motivo concreto (**`Err error`**).\n\n```ridgun\nfn :: buscar division Int Int => Result\n      buscar division _   0   =  Err \"¡Eh! No se puede dividir por cero\"\n      buscar division a   b   =  Ok (a / b)\n\nfn :: imprimir res Result    => ()\n      imprimir res (Ok n)    =  echo \"El resultado es {n}\"\n      imprimir res (Err msg) =  echo \"Fallo controlado: {msg}\"\n```\n\nNadie puede ignorar un error por descuido porque el propio tipo `Result` te obliga a mirar si dentro hay un `Ok` o un `Err`.\n\n---\n\n## 6.5. Polimorfismo Paramétrico: Funciones genéricas con `A`, `B`, `T`...\n\nSupón que escribes una función que invierte un par `(x, y)` o que saca el primer elemento de una lista. ¿De verdad importa si la lista es de `Int`, de `String` o de `Servidor`? ¡Para nada! El algoritmo es idéntico.\n\nEn Ridgun, **cualquier letra mayúscula individual (`A` a `Z`)** en una firma de tipos funciona automáticamente como un **tipo comodín polimórfico (variable de tipo)**:\n\n```ridgun\nfn :: cabeza segura [A]   A       => A\n      cabeza segura []    defecto =  defecto\n      cabeza segura (x:_) _       =  x\n\nfn :: girar par (A B)  => B A\n      girar par (x, y) =  (y, x)\n```\n\nFíjate en la magia de `cabeza segura [A] A => A` y `girar par (A B) => B A`:\n- No es un `Any` descontrolado: dice que **el tipo de la lista `[A]`, el tipo del valor `defecto` (`A`) y el tipo devuelto (`A`) tienen que ser el mismo**.\n- Si llamas a `cabeza segura [10, 20] 0`, el compilador ata cabos (`A = Int`) y te devuelve un `Int`.\n- Si llamas a `cabeza segura [\"a\", \"b\"] \"ninguno\"`, ata cabos (`A = String`) y te devuelve un `String`.\n- Pero si intentas hacer trampa y llamas a `cabeza segura [10, 20] \"ninguno\"`, ¡zas! El compilador te frena en seco porque el primer argumento dice que `A` es `Int` y el segundo dice que `A` es `String`.\n\n---\n\n## 6.6. Crea tus propios operadores (`op ::`): Desde vectores hasta frases a medida\n\n¿Por qué solo los números nativos iban a tener derecho a usar `+` o `*`? ¿Y por qué conformarse con los operadores de siempre cuando puedes inventar la sintaxis perfecta para tu problema?\n\nCon **`op ::`** (o directamente sin prefijo si usas patrones de operador) puedes hacer dos virguerías:\n\n### 1. Enseñarle a `+`, `-`, `*`, `/`, `%` a operar con tus propios tipos\n```ridgun\ntype Complejo = real: Int, imag: Int\n\nop :: Complejo + Complejo => Complejo\n      a        + b        =  Complejo ((real a) + (real b)) ((imag a) + (imag b))\n```\n\n### 2. Crear operadores *Mixfix* (que se leen como frases naturales, incluidos `type` y `with`)\nEn una firma de operador, **las palabras con mayúscula inicial (`Int`, `String`, `A`..`Z`) o entre corchetes/paréntesis (`[Int]`, `(A, B)`) son los huecos para los argumentos**, y **las palabras en minúscula son parte de la frase del operador** (incluso palabras tan habituales como `type` o `with`, que en Ridgun son contextuales y nunca te bloquean):\n\n```ridgun\nop :: si Bool entonces A sino A => A\n      si True entonces v sino _ =  v\n      si False entonces _ sino f = f\n\nop :: format String type String with Int => String\n      format label  type kind   with w   =  \"{label} ({kind}, width={w})\"\n\nmain => ()\nmain =\n  mensaje = si (10 > 5) entonces \"¡Diez gana!\" sino \"Imposible\"\n  echo mensaje\n  echo (format \"panel\" type \"bordered\" with 80)\n```\n\nAcabas de fabricarte tu propio operador ternario polimórfico y un DSL de formateo en **3 líneas** de Ridgun.\n\n---\n\n## 6.7. Constructores compartidos, variantes de tipo directo, `expand type` y espacios naturales en `fn ::`\n\nRidgun lleva los tipos algebraicos y las funciones un paso más allá en expresividad y extensibilidad:\n\n1. **Constructores compartidos entre distintos `type`**: Varios tipos suma pueden reutilizar el mismo nombre de constructor (`Error`, `Var`, `Lit`) con igual o distinta aridad; el verificador de tipos los distingue por la columna de la firma.\n2. **Variantes con nombre de tipo directo (`type Something = String | Int | MyStruct Float Int`)**: Cuando una variante es un tipo primitivo (`String`, `Int`, `Float`/`Real`, `Bool`, `Char`), no necesitas repetir `Int Int` ni `String String`. Puedes pasar valores directos (`\"hola\"`, `42`) o constructores explícitos (`String \"hola\"`, `Int 42`), y hacer pattern matching tanto con literales (`\"admin\"`, `0`) como con patrones tipados (`(String s)`, `(Int n)`).\n3. **Extensión abierta de tipos (`expand type`) y fusión automática de cláusulas `fn ::`**: Con `expand type` puedes añadir nuevas variantes a un tipo suma o nuevos campos a un registro. Al volver a declarar `fn ::` para la misma función, las nuevas cláusulas se fusionan automáticamente **antes** de cualquier cláusula comodín `_` (sin necesidad de escribir `expand fn`).\n4. **Espacios naturales `\" \"` en lugar de `_` en `fn ::`, funciones nativas y nombres de archivo**: Igual que en `op ::`, los nombres de función en `fn ::`, las llamadas a funciones nativas (`assert equals`, `str len`, `read file`) y los archivos `.rg` (`test core language.rg`) pueden escribirse co
