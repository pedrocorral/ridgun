dimensiones forman parte de la firma de tipos:\n\n```ridgun\n-- Si entra (N × K) y (K × M), ¡por narices sale (N × M)!\nmultiplicar_matrices Tensor[N, K] Tensor[K, M] => Tensor[N, M]\nmultiplicar_matrices a            b            =  a_ik @ b_kj\n```\n\nFíjate en dos detalles espectaculares:\n1. **Verificación estática de dimensiones (`Tensor[N, K]`)**: el eje interno `K` de la primera matriz tiene que coincidir con el primer eje `K` de la segunda. Si intentas pasar dimensiones incompatibles, `ridgunc check` te detiene antes de ejecutar nada.\n2. **Notación de subíndices de Einstein (`a_ik @ b_kj`) y Hadamard (`a_ij * b_j`)**:\n   - Con **`@`**, los subíndices repetidos en todos los operandos (`k`) se contraen (se suman) y los únicos (`i`, `j`) sobreviven en el tensor resultado.\n   - Con **`+`, `-`, `*`, `/`**, los subíndices alinean dimensiones y hacen *broadcasting* automático (`a_ij * b_j` multiplica cada fila `i` de `a` por el vector `b_j` sin necesidad de escribir `unsqueeze` ni `reshape`).\n3. **Mutación *in-place* para algoritmos numéricos**:\n   ```ridgun\n   crear_matriz_identidad => Tensor\n   crear_matriz_identidad =\n     m = Tensor [[1.0, 0.0], [0.0, 1.0]]\n     m[0, 1] = 0.5\n     m\n   ```\n\n---\n\n## 8.4. Variables de Contexto (`context ::`) y Estado Compartido Atómico (`shared ::`)\n\nEn el 99% de tu código pasarás datos por parámetro. Pero para ese 1% donde necesitas configuración de entorno o un contador global entre hilos sin contaminar 40 firmas intermedias, Ridgun ofrece dos mecanismos explícitos y seguros:\n\n### 1. `context ::` — Ámbito dinámico aislado por tarea (`with ... = ... do`)\n```ridgun\ncontext :: ruta_log : String = \"/var/log/app.log\"\n\nregistrar_evento String => ()\nregistrar_evento msg    =  echo \"[{ruta_log}] {msg}\"\n\nmain => ()\nmain =\n  registrar_evento \"Arranque normal\"\n  with ruta_log = \"/tmp/test.log\" do\n    registrar_evento \"Dentro del test aislado\"\n```\n\n### 2. `shared ::` y `atomic` — Estado concurrente con bloqueo atómico por línea\n```ridgun\nshared :: peticiones_totales : Int = 0\n\ncontabilizar_visita => Int\ncontabilizar_visita =\n  atomic peticiones_totales = peticiones_totales + 1\n  peticiones_totales\n```\n\n---\n\n## 8.5. Acceso a Hardware (`hardware ::`) y Primitivas POSIX de Sistemas\n\nEl propio compilador `ridgunc`, el gestor `stable` y utilidades de sistemas Unix están escritos en Ridgun. Para ello, el lenguaje incluye bloques de registros mapeados en memoria (`hardware ::`) y primitivas POSIX directas:\n\n```ridgun\nhardware :: UART0 @ 0x1000_0000\n  tx_data : Int @ 0x00\n  status  : Int @ 0x04\n```\n\nY para trabajar con el sistema operativo:\n\n| Primitiva | Firma | Qué hace |\n|---|---|---|\n| `cli_args` | `=> [String]` | Argumentos de línea de comandos (`argv`). |\n| `read_file` / `write_file` | `String => String` / `String String => ()` | Lectura y escritura íntegra de archivos en disco. |\n| `read_bytes` / `write_bytes` | `String => [Int]` / `String [Int] => ()` | Lectura y escritura binaria exacta byte a byte (`0..255`). |\n| `list_dir` / `file_lstat` | `String => [String]` / `String => ...` | Listado de directorios e inspección de metadatos POSIX (`lstat`). |\n| `sha256_file` / `sha256_str` | `String => String` | Hash criptográfico SHA-256 nativo. |\n| `sys_exec` / `shell_exec` | `... => Int` | Ejecución de procesos del sistema operativo. |\n| `sys_getcwd` / `sys_chdir` | `=> String` / `String => Int` | Consultar o cambiar el directorio de trabajo. |\n| `sys_getenv` / `sys_setenv` | `String => String` / `String String => Int` | Variables de entorno del proceso. |\n| `sys_getuid` / `sys_getgid` | `=> Int` | UID y GID reales del proceso (`doas`, herramientas de seguridad). |\n| `sys_exit` | `Int => ()` | Terminar el proceso con código de salida. |\n\n---\n\n## 8.6. Caso de Estudio Real: Construyendo `rg-wc`, una utilidad Unix paralela\n\nVamos a unir todo lo aprendido desde el Capítulo 01 hasta aquí en un programa real de sistemas: una versión paralela de la herramienta Unix `wc` (contador de líneas y bytes para múltiples archivos) escrita en Ridgun puro:\n\n```ridgun\n-- 1. Modelamos las métricas de un archivo con un registro ADT (Capítulo 06)\ntype Metricas = archivo: String, lineas: Int, bytes: Int\n\n-- 2. Contamos saltos de línea (código ASCII 10) con recursión de cola TCO (Capítulo 04)\nfn :: contar_saltos String Int Int Int => Int\n      contar_saltos texto  pos fin acum =\n        | pos >= fin                   = acum\n        | (str_char_at texto pos) == 10 = contar_saltos texto (pos + 1) fin (acum + 1)\n        | otherwise                    = contar_saltos texto (pos + 1) fin acum\n\nfn :: numero_de_lineas String => Int\n      numero_de_lineas texto  =  contar_saltos texto 0 (str_len texto) 0\n\n-- 3. Analizamos un archivo y devolvemos su estructura Metricas\nfn :: analizar_archivo String => Metricas\n      analizar_archivo ruta   =\n        contenido = read_file ruta\n        || numero_de_lineas contenido -> n_lineas\n        || str_len contenido          -> n_bytes ||.\n        Metricas ruta n_lineas n_bytes\n\n-- 4. Formateamos cada fila y sumamos totales con `fold` y `||` (Capítulo 07)\nfn :: formatear_metrica Metricas => String\n      formatear_metrica m        =  \"{lineas m}\\t{bytes m}\\t{archivo m}\"\n\nfn :: sumar_lineas Int Metricas => Int\n      sumar_lineas acc m        =  acc + (lineas m)\n\nfn :: sumar_bytes Int Metricas => Int\n      sumar_bytes acc m        =  acc + (bytes m)\n\nfn :: generar_informe [String] => String\n      generar_informe rutas    =\n        metricas = map analizar_archivo rutas\n        || map formatear_metrica metricas -> filas\n        || fold sumar_lineas 0 metricas   -> total_l\n        || fold sumar_bytes 0 metricas    -> total_b ||.\n        \"{filas}\\nTotal: {total_l} líneas, {total_b} bytes\"\n\nfn :: main => ()\n      main =\n        echo (generar_informe [\"README.md\", \"AGENTS.md\"])\n```\n\nPárate un segundo a mirar esas ~40 líneas de código:\n- No hay ni un solo `null`, ni una excepción descontrolada, ni un `Mutex`.\n- `contar_saltos` se compila a un `loop` nativo con 0 bytes de pila gracias al TCO automático.\n- `map analizar_archivo rutas` procesa los archivos en paralelo en todos los núcleos de tu CPU, y el bloque `||` calcula simultáneamente las filas formateadas, el total de líneas y el total de bytes.\n- La memoria temporal se libera determinísticamente mediante **`RMM1`/`RMM2`**.\n- Y cuando ejecutas `ridgunc build rg_wc.rg -o rg-wc`, obtienes un binario nativo autónomo de ~350 KB listo para copiar a `/usr/local/bin`.\n\n---\n\n## 8.7. Hoja de Ruta Final: Las 10 Reglas de Oro del Programador Ridgun\n\n1. **Escribe siempre primero el contrato (`=>`) y después las ecuaciones (`=`):** pensar en los tipos primero hace que el compilador trabaje para ti.\n2. **Deja que `stable format` maquete tus tablas:** escribe con un espacio y deja que la herramienta alinee columnas, `=>`, `=` y `->`.\n3. **Recuerda la regla universal del `=`:** detrás de cualquier `=` puedes abrir un bloque secuencial, un árbol de guardas `|` o un grafo paralelo `||`.\n4. **Usa `|.` y `||.` solo cuando cierres un bloque anidado para volver a un nivel superior:** mantén los árboles de decisión profundos compactos y sin ambigüedad.\n5. **Inmutable por defecto (`x = ...`), mutable explícito (`mut x = ...`):** usa `mut` únicamente cuando un acumulador local lo pida de verdad.\n6. **Usa operadores booleanos claros en minúsculas (`and`, `or`, `xor`, `not`) y cierra siempre tus guardas con `| otherwise =`.**\n7. **Modela tu dominio con ADTs (`type`):** usa registros con `with campo: valor` y tipos suma (`Option`, `Result`) en lugar de `null`.\n8. **Paraleliza declarando dependencias con `|| expr -> var` y `map` / `filter`:** deja que el compilador verifique que no hay ciclos y reparta el trabajo entre los núcleos.\n9. **Ponle dimensiones simbólicas a tus Tensores (`Tensor[N, K]`) y subíndices a tus contracciones (`a_ik @ b_kj`).**\n10. **Confía en `RMM` (`RMM1`/`RMM2`), acota entradas externas con `with region` y verifica siempre con `stable check` y `stable test`.**\n\n¡Feliz viaje programando en Ridgun!\n"}];
    const UI_STRINGS = {"copy_label": "Copiar", "copied_label": "¡Copiado!", "prev_label": "&larr; Capítulo anterior", "next_label": "Siguiente capítulo &rarr;", "search_hits_label": "Resultados para", "search_empty_label": "No se encontraron coincidencias para"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        // Strings
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        // Keywords
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|do|global|context|shared|atomic|hardware|echo|and|or|xor|not)\b/g, '<span class="rg-kw">$1</span>');
        // Types & constructors
        html = html.replace(/\b(Int|Real|String|Char|Bool|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        // Operators
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        // Numbers & byte units
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      out = out.replace(/\$1024\^2\$/g, "1024<sup>2</sup>");
      out = out.replace(/\$1024\^3\$/g, "1024<sup>3</sup>");
      out = out.replace(/\$1024\$/g, "1024");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        // Fenced code block
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++; // skip closing ```
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        // Horizontal rule
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        // Headings
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        // Table
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        // Blockquote
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        // Unordered list
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        // Ordered list
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        // Empty line
        if (!line.trim()) {
          i++;
          continue;
        }
        // Paragraph
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    // Initial load from URL hash if present
    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
