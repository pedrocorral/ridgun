ícitos e seguros:\n\n### 1. `context ::` — Ámbito dinámico illado por tarefa (`with ... = ... do`)\n```ridgun\ncontext :: ruta_log : String = \"/var/log/app.log\"\n\nrexistrar_evento String => ()\nrexistrar_evento msg    =  echo \"[{ruta_log}] {msg}\"\n\nmain => ()\nmain =\n  rexistrar_evento \"Arrinque normal\"\n  with ruta_log = \"/tmp/test.log\" do\n    rexistrar_evento \"Dentro da proba illada\"\n```\n\n### 2. `shared ::` e `atomic` — Estado concorrente con bloqueo atómico por liña\n```ridgun\nshared :: peticions_totais : Int = 0\n\ncontabilizar_visita => Int\ncontabilizar_visita =\n  atomic peticions_totais = peticions_totais + 1\n  peticions_totais\n```\n\n---\n\n## 8.5. Acceso a Hardware (`hardware ::`) e Primitivas POSIX de Sistemas\n\nO propio compilador `ridgunc`, o xestor `stable` e utilidades de sistemas Unix están escritos en Ridgun. Para iso, a linguaxe inclúe bloques de rexistros mapeados en memoria (`hardware ::`) e primitivas POSIX directas:\n\n```ridgun\nhardware :: UART0 @ 0x1000_0000\n  tx_data : Int @ 0x00\n  status  : Int @ 0x04\n```\n\nE para traballar co sistema operativo:\n\n| Primitiva | Sinatura | Que fai |\n|---|---|---|\n| `cli_args` | `=> [String]` | Argumentos de liña de comandos (`argv`). |\n| `read_file` / `write_file` | `String => String` / `String String => ()` | Lectura e escritura íntegra de ficheiros en disco. |\n| `read_bytes` / `write_bytes` | `String => [Int]` / `String [Int] => ()` | Lectura e escritura binaria exacta byte a byte (`0..255`). |\n| `list_dir` / `file_lstat` | `String => [String]` / `String => ...` | Listaxe de directorios e inspección de metadatos POSIX (`lstat`). |\n| `sha256_file` / `sha256_str` | `String => String` | Hash criptográfico SHA-256 nativo. |\n| `sys_exec` / `shell_exec` | `... => Int` | Execución de procesos do sistema operativo. |\n| `sys_getcwd` / `sys_chdir` | `=> String` / `String => Int` | Consultar ou mudar o directorio de traballo. |\n| `sys_getenv` / `sys_setenv` | `String => String` / `String String => Int` | Variables de contorno do proceso. |\n| `sys_getuid` / `sys_getgid` | `=> Int` | UID e GID reais do proceso (`doas`, ferramentas de seguridade). |\n| `sys_exit` | `Int => ()` | Rematar o proceso con código de saída. |\n\n---\n\n## 8.6. Caso de Estudo Real: Construíndo `rg-wc`, unha utilidade Unix paralela\n\nImos unir todo o aprendido desde o Capítulo 01 ata aquí nun programa real de sistemas: unha versión paralela da ferramenta Unix `wc` (contador de liñas e bytes para múltiples ficheiros) escrita en Ridgun puro:\n\n```ridgun\n-- 1. Modelamos as métricas dun ficheiro cun rexistro ADT (Capítulo 06)\ntype Metricas = ficheiro: String, linas: Int, bytes: Int\n\n-- 2. Contamos saltos de liña (código ASCII 10) con recursión de cola TCO (Capítulo 04)\nfn :: contar_saltos String Int Int Int => Int\n      contar_saltos texto  pos fin acum =\n        | pos >= fin                    = acum\n        | (str_char_at texto pos) == 10 = contar_saltos texto (pos + 1) fin (acum + 1)\n        | otherwise                     = contar_saltos texto (pos + 1) fin acum\n\nfn :: numero_de_linas String => Int\n      numero_de_linas texto  =  contar_saltos texto 0 (str_len texto) 0\n\n-- 3. Analizamos un ficheiro e devolvemos a súa estrutura Metricas\nfn :: analizar_ficheiro String => Metricas\n      analizar_ficheiro ruta   =\n        contido = read_file ruta\n        || numero_de_linas contido -> n_linas\n        || str_len contido         -> n_bytes ||.\n        Metricas ruta n_linas n_bytes\n\n-- 4. Formatamos cada fila e sumamos totais con `fold` e `||` (Capítulo 07)\nfn :: formatar_metrica Metricas => String\n      formatar_metrica m        =  \"{linas m}\\t{bytes m}\\t{ficheiro m}\"\n\nfn :: sumar_linas Int Metricas => Int\n      sumar_linas acc m        =  acc + (linas m)\n\nfn :: sumar_bytes Int Metricas => Int\n      sumar_bytes acc m        =  acc + (bytes m)\n\nfn :: xerar_informe [String] => String\n      xerar_informe rutas    =\n        metricas = ||map analizar_ficheiro rutas\n        || map formatar_metrica metricas -> filas\n        || fold sumar_linas 0 metricas   -> total_l\n        || fold sumar_bytes 0 metricas   -> total_b ||.\n        \"{filas}\\nTotal: {total_l} liñas, {total_b} bytes\"\n\nfn :: main => ()\n      main =\n        echo (xerar_informe [\"README.md\", \"AGENTS.md\"])\n```\n\nPárate un segundo a mirar esas ~40 liñas de código:\n- Non hai nin un só `null`, nin unha excepción descontrolada, nin un `Mutex`.\n- `contar_saltos` compílase a un `loop` nativo con 0 bytes de pila grazas ao TCO automático.\n- `||map analizar_ficheiro rutas` procesa os ficheiros en paralelo en todos os núcleos da túa CPU, e o bloque `||` calcula simultaneamente as filas formatadas, o total de liñas e o total de bytes.\n- A memoria temporal libérase deterministicamente mediante **`RMM1`/`RMM2`**.\n- E cando executas `ridgunc build rg_wc.rg -o rg-wc`, obtés un binario nativo autónomo de ~350 KB listo para copiar a `/usr/local/bin`.\n\n---\n\n## 8.7. Folla de Ruta Final: As 10 Regras de Ouro do Programador Ridgun\n\n1. **Escribe sempre primeiro o contrato (`=>`) e despois as ecuacións (`=`):** pensar nos tipos primeiro fai que o compilador traballe para ti.\n2. **Deixa que `stable format` maquete as túas táboas:** escribe cun espazo e deixa que a ferramenta aliñe columnas, `=>`, `=` e `->`.\n3. **Lembra a regra universal do `=`:** detrás de calquera `=` podes abrir un bloque secuencial, unha árbore de gardas `|` ou un grafo paralelo `||`.\n4. **Usa `|.` e `||.` só cando peches un bloque aniñado para volver a un nivel superior:** mantén as árbores de decisión profundas compactas e sen ambigüidade.\n5. **Inmutable por defecto (`x = ...`), mutable explícito (`mut x = ...`):** usa `mut` unicamente cando un acumulador local o pida de verdade.\n6. **Usa operadores booleanos claros en minúsculas (`and`, `or`, `xor`, `not`) e pecha sempre as túas gardas con `| otherwise =`.**\n7. **Modela o teu dominio con ADTs (`type`):** usa rexistros con `with campo: valor` e tipos suma (`Option`, `Result`) en lugar de `null`.\n8. **Paraleliza declarando dependencias con `|| expr -> var` e `||map` / `||filter`:** deixa que o compilador verifique que non hai ciclos e reparta o traballo entre os núcleos.\n9. **Ponlle dimensións simbólicas aos teus Tensores (`Tensor[N, K]`) e subíndices ás túas contraccións (`a_ik @ b_kj`).**\n10. **Confía en `RMM` (`RMM1`/`RMM2`), acouta entradas externas con `with region` e verifica sempre con `stable check` e `stable test`.**\n\nFeliz viaxe programando en Ridgun!\n"}];
    const UI_STRINGS = {"copy_label": "Copiar", "copied_label": "Copiado!", "prev_label": "&larr; Capítulo anterior", "next_label": "Seguinte capítulo &rarr;", "search_hits_label": "Resultados para", "search_empty_label": "Non se atoparon coincidencias para"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        // Strings
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        // Keywords
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|do|global|context|shared|atomic|hardware|echo|and|or|xor|not)\b/g, '<span class="rg-kw">$1</span>');
        // Types & constructors
        html = html.replace(/\b(Int|Real|String|Char|Bool|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        // Operators
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        // Numbers & byte units
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      out = out.replace(/\$1024\^2\$/g, "1024<sup>2</sup>");
      out = out.replace(/\$1024\^3\$/g, "1024<sup>3</sup>");
      out = out.replace(/\$1024\$/g, "1024");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        // Fenced code block
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++; // skip closing ```
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        // Horizontal rule
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        // Headings
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        // Table
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        // Blockquote
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        // Unordered list
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        // Ordered list
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        // Empty line
        if (!line.trim()) {
          i++;
          continue;
        }
        // Paragraph
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    // Initial load from URL hash if present
    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
</body>
</html>
