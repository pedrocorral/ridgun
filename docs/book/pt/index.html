) }`. O ramo não escolhido é libertado no instante e o escolhido sobrevive intacto.\n\n### Política `RMM2` — Contagem por Atribuição e Cascata Estrutural\nE o que acontece quando coloca estruturas dentro de outras estruturas (`xs = [a, b]`), reatribui variáveis mutáveis (`mut x = ...`) ou encadeia chamadas complexas? Aí entra a **`RMM2`**, que governa todo o ciclo de vida com quatro regras matemáticas sem falhas:\n\n1. **Os argumentos de entrada de uma função não são tocados (`+0` ao entrar, `-0` ao sair)**: passar uma lista ou um registo a uma função jamais incrementa nem decrementa contadores em vão.\n2. **Toda a atribuição a uma variável local interna ou célula de contentor soma `+1`**:\n   - `a = [10, 20]` $\\rightarrow$ o bloco `M1` nasce com contador `1`.\n   - `xs = [a, b]` $\\rightarrow$ a lista `xs` nasce com `1`, e como guarda referências a `a` e `b`, ambos sobem para `2`.\n   - Se reatribuir uma variável mutável (`mut x = ...` e depois `x = novo`), a `RMM2` aplica primeiro **`+1`** ao valor novo antes de aplicar **`-1`** ao antigo.\n3. **Ao sair da função, as variáveis locais que NÃO são devolvidas recebem `-1`**: se o contador de uma estrutura chegar a `0`, liberta-se a sua memória na hora e **propaga `-1` em cascata, um por um, a cada um dos seus filhos diretos**.\n4. **O valor devolvido pela função fica isento em trânsito**: recebe o seu `-1` de variável local mas não é destruído ao cruzar o retorno, de modo que quando quem chamou faz `c = minha_funcao ()`, esse `+1` da atribuição deixa-o exatamente em `1`.\n\n```ridgun\nescolher Bool [Int] [Int] => [Int]\nescolher cond a     b     =\n  | cond      = a\n  | otherwise = b\n\nexemplo_rmm2 Bool => Int\nexemplo_rmm2 cond =\n  a = [10, 20, 30]         -- M1 (rc = 1)\n  b = [40, 50, 60]         -- M2 (rc = 1)\n  c = escolher cond a b    -- `c` recebe +1; o não escolhido morre aqui mesmo (rc -> 0)\n  (contar a) + (contar c)  -- Ao terminar, `a` e `c` recebem -1 e tudo fica com 0 blocos vivos\n```\n\n---\n\n## 8.2. Regiões Léxicas com Quota (`with region`): Corta-fogos de memória em $O(1)$\n\nAlém da `RMM1` e da `RMM2`, quando está a processar um pacote de rede externo, um ficheiro gigante ou um lote de dados não confiáveis e quer impor um **teto estrito de memória RAM**, envolve o cálculo num bloco **`with region`**:\n\n```ridgun\nprocessar_trama String => Result\nprocessar_trama bruto  =\n  with region 64_KB do\n    limpas = map limpar_linha (dividir_linhas bruto)\n    contar_validos limpas\n```\n\n1. **Quota garantida em hardware/runtime**: se dentro do bloco se tentar reservar nem que seja um único byte acima de `64_KB` (`65.536` bytes), o runtime aborta de forma limpa o bloco, liberta toda a arena temporária em tempo constante $O(1)$ e devolve `Err OutOfMemory` sem derrubar o processo.\n2. **Libertação instantânea ao sair**: assim que termina o bloco `with region`, toda a memória temporária da arena desaparece de uma só vez sem deixar fragmentação.\n\n---\n\n## 8.3. Tensores Nativos, Contração de Einstein (`@`) e Dimensões Simbólicas\n\nSe alguma vez programou em Python com NumPy ou PyTorch, de certeza que já sofreu o clássico erro ao minuto 41 de execução:\n\n```text\nRuntimeError: mat1 and mat2 shapes cannot be multiplied (128x64 and 32x128)\n```\n\nEm Ridgun, os **`Tensor`** são cidadãos nativos de primeira classe e as suas dimensões fazem parte da assinatura de tipos:\n\n```ridgun\n-- Se entra (N × K) e (K × M), obrigatoriamente sai (N × M)!\nmultiplicar_matrizes Tensor[N, K] Tensor[K, M] => Tensor[N, M]\nmultiplicar_matrizes a            b            =  a_ik @ b_kj\n```\n\nRepare em dois detalhes espetaculares:\n1. **Verificação estática de dimensões (`Tensor[N, K]`)**: o eixo interno `K` da primeira matriz tem de coincidir com o primeiro eixo `K` da segunda. Se tentar passar dimensões incompatíveis, o `ridgunc check` detém-no antes de executar o que quer que seja.\n2. **Notação de subscritos de Einstein (`a_ik @ b_kj`) e Hadamard (`a_ij * b_j`)**:\n   - Com **`@`**, os subscritos repetidos em todos os operandos (`k`) contraem-se (somam-se) e os únicos (`i`, `j`) sobrevivem no tensor resultado.\n   - Com **`+`, `-`, `*`, `/`**, os subscritos alinham dimensões e fazem *broadcasting* automático (`a_ij * b_j` multiplica cada linha `i` de `a` pelo vetor `b_j` sem necessidade de escrever `unsqueeze` nem `reshape`).\n3. **Mutação *in-place* para algoritmos numéricos**:\n   ```ridgun\n   criar_matriz_identidade => Tensor\n   criar_matriz_identidade =\n     m = Tensor [[1.0, 0.0], [0.0, 1.0]]\n     m[0, 1] = 0.5\n     m\n   ```\n\n---\n\n## 8.4. Variáveis de Contexto (`context ::`) e Estado Partilhado Atómico (`shared ::`)\n\nEm 99% do seu código passará dados por parâmetro. Mas para esse 1% onde precisa de configuração de ambiente ou de um contador global entre threads sem contaminar 40 assinaturas intermédias, o Ridgun oferece dois mecanismos explícitos e seguros:\n\n### 1. `context ::` — Âmbito dinâmico isolado por tarefa (`with ... = ... do`)\n```ridgun\ncontext :: caminho_log : String = \"/var/log/app.log\"\n\nregistar_evento String => ()\nregistar_evento msg    =  echo \"[{caminho_log}] {msg}\"\n\nmain => ()\nmain =\n  registar_evento \"Arranque normal\"\n  with caminho_log = \"/tmp/test.log\" do\n    registar_evento \"Dentro do teste isolado\"\n```\n\n### 2. `shared ::` e `atomic` — Estado concorrente com bloqueio atómico por linha\n```ridgun\nshared :: pedidos_totais : Int = 0\n\ncontabilizar_visita => Int\ncontabilizar_visita =\n  atomic pedidos_totais = pedidos_totais + 1\n  pedidos_totais\n```\n\n---\n\n## 8.5. Acesso a Hardware (`hardware ::`) e Primitivas POSIX de Sistemas\n\nO próprio compilador `ridgunc`, o gestor `stable` e utilitários de sistemas Unix estão escritos em Ridgun. Para tal, a linguagem inclui blocos de registos mapeados em memória (`hardware ::`) e primitivas POSIX diretas:\n\n```ridgun\nhardware :: UART0 @ 0x1000_0000\n  tx_data : Int @ 0x00\n  status  : Int @ 0x04\n```\n\nE para trabalhar com o sistema operativo:\n\n| Primitiva | Assinatura | O que faz |\n|---|---|---|\n| `cli_args` | `=> [String]` | Argumentos de linha de comandos (`argv`). |\n| `read_file` / `write_file` | `String => String` / `String String => ()` | Leitura e escrita integral de ficheiros em disco. |\n| `read_bytes` / `write_bytes` | `String => [Int]` / `String [Int] => ()` | Leitura e escrita binária exata byte a byte (`0..255`). |\n| `list_dir` / `file_lstat` | `String => [String]` / `String => ...` | Listagem de diretórios e inspeção de metadados POSIX (`lstat`). |\n| `sha256_file` / `sha256_str` | `String => String` | Hash criptográfico SHA-256 nativo. |\n| `sys_exec` / `shell_exec` | `... => Int` | Execução de processos do sistema operativo. |\n| `sys_getcwd` / `sys_chdir` | `=> String` / `String => Int` | Consultar ou alterar o diretório de trabalho. |\n| `sys_getenv` / `sys_setenv` | `String => String` / `String String => Int` | Variáveis de ambiente do processo. |\n| `sys_getuid` / `sys_getgid` | `=> Int` | UID e GID reais do processo (`doas`, ferramentas de segurança). |\n| `sys_exit` | `Int => ()` | Terminar o processo com código de saída. |\n\n---\n\n## 8.6. Caso de Estudo Real: Construindo `rg-wc`, um utilitário Unix paralelo\n\nVamos unir tudo o que aprendemos desde o Capítulo 01 até aqui num programa real de sistemas: uma versão paralela da ferramenta Unix `wc` (contador de linhas e bytes para múltiplos ficheiros) escrita em Ridgun puro:\n\n```ridgun\n-- 1. Modelamos as métricas de um ficheiro com um registo ADT (Capítulo 06)\ntype Metricas = ficheiro: String, linhas: Int, bytes: Int\n\n-- 2. Contamos quebras de linha (código ASCII 10) com recursão de cauda TCO (Capítulo 04)\nfn :: contar_quebras String Int Int Int  => Int\n      contar_quebras texto  pos fim acum =\n        | pos >= fim                    = acum\n        | (str_char_at texto pos) == 10 = contar_quebras texto (pos + 1) fim (acum + 1)\n        | otherwise                     = contar_quebras texto (pos + 1) fim acum\n\nfn :: numero_de_linhas String => Int\n      numero_de_linhas texto  =  contar_quebras texto 0 (str_len texto) 0\n\n-- 3. Analisamos um ficheiro e devolvemos a sua estrutura Metricas\nfn :: analisar_ficheiro String   => Metricas\n      analisar_ficheiro caminho  =\n        conteudo = read_file caminho\n        || numero_de_linhas conteudo -> n_linhas\n        || str_len conteudo          -> n_bytes ||.\n        Metricas caminho n_linhas n_bytes\n\n-- 4. Formatamos cada linha e somamos totais com `fold` e `||` (Capítulo 07)\nfn :: formatar_metrica Metricas => String\n      formatar_metrica m        =  \"{linhas m}\\t{bytes m}\\t{ficheiro m}\"\n\nfn :: somar_linhas Int Metricas => Int\n      somar_linhas acc m        =  acc + (linhas m)\n\nfn :: somar_bytes Int Metricas => Int\n      somar_bytes acc m        =  acc + (bytes m)\n\nfn :: gerar_relatorio [String] => String\n      gerar_relatorio caminhos =\n        metricas = ||map analisar_ficheiro caminhos\n        || map formatar_metrica metricas -> linhas_fmt\n        || fold somar_linhas 0 metricas  -> total_l\n        || fold somar_bytes 0 metricas   -> total_b ||.\n        \"{linhas_fmt}\\nTotal: {total_l} linhas, {total_b} bytes\"\n\nfn :: main => ()\n      main =\n        echo (gerar_relatorio [\"README.md\", \"AGENTS.md\"])\n```\n\nPare um segundo para olhar para essas ~40 linhas de código:\n- Não há um único `null`, nem uma exceção descontrolada, nem um `Mutex`.\n- `contar_quebras` é compilada para um `loop` nativo com 0 bytes de pilha graças ao TCO automático.\n- `||map analisar_ficheiro caminhos` processa os ficheiros em paralelo em todos os núcleos do seu CPU, e o bloco `||` calcula simultaneamente as linhas formatadas, o total de linhas e o total de bytes.\n- A memória temporária é libertada de forma determinística mediante **`RMM1`/`RMM2`**.\n- E quando executa `ridgunc build rg_wc.rg -o rg-wc`, obtém um binário nativo autónomo de ~350 KB pronto para copiar para `/usr/local/bin`.\n\n---\n\n## 8.7. Roteiro Final: As 10 Regras de Ouro do Programador Ridgun\n\n1. **Escreva sempre primeiro o contrato (`=>`) e depois as equações (`=`):** pensar nos tipos primeiro faz com que o compilador trabalhe para si.\n2. **Deixe que o `stable format` pagine as suas tabelas:** escreva com um espaço e deixe que a ferramenta alinhe colunas, `=>`, `=` e `->`.\n3. **Lembre-se da regra universal do `=`:** atrás de qualquer `=` pode abrir um bloco sequencial, uma árvore de guardas `|` ou um grafo paralelo `||`.\n4. **Use `|.` e `||.` apenas quando fechar um bloco aninhado para voltar a um nível superior:** mantenha as árvores de decisão profundas compactas e sem ambiguidade.\n5. **Imutável por omissão (`x = ...`), mutável explícito (`mut x = ...`):** use `mut` unicamente quando um acumulador local o exigir de verdade.\n6. **Use operadores booleanos claros em minúsculas (`and`, `or`, `xor`, `not`) e feche sempre as suas guardas com `| otherwise =`.**\n7. **Modele o seu domínio com ADTs (`type`):** use registos com `with campo: valor` e tipos soma (`Option`, `Result`) em vez de `null`.\n8. **Paralelize declarando dependências com `|| expr -> var` e `||map` / `||filter`:** deixe que o compilador verifique que não há ciclos e distribua o trabalho pelos núcleos.\n9. **Ponha dimensões simbólicas nos seus Tensores (`Tensor[N, K]`) e subscritos nas suas contrações (`a_ik @ b_kj`).**\n10. **Confie no `RMM` (`RMM1`/`RMM2`), limite entradas externas com `with region` e verifique sempre com `stable check` e `stable test`.**\n\nBoa viagem a programar em Ridgun!\n"}];
    const UI_STRINGS = {"copy_label": "Copiar", "copied_label": "Copiado!", "prev_label": "&larr; Capítulo anterior", "next_label": "Próximo capítulo &rarr;", "search_hits_label": "Resultados para", "search_empty_label": "Nenhuma correspondência encontrada para"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        // Strings
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        // Keywords
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|do|global|context|shared|atomic|hardware|echo|and|or|xor|not)\b/g, '<span class="rg-kw">$1</span>');
        // Types & constructors
        html = html.replace(/\b(Int|Real|String|Char|Bool|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        // Operators
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        // Numbers & byte units
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      out = out.replace(/\$1024\^2\$/g, "1024<sup>2</sup>");
      out = out.replace(/\$1024\^3\$/g, "1024<sup>3</sup>");
      out = out.replace(/\$1024\$/g, "1024");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        // Fenced code block
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++; // skip closing ```
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        // Horizontal rule
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;

        }
        // Headings
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        // Table
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        // Blockquote
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        // Unordered list
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        // Ordered list
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        // Empty line
        if (!line.trim()) {
          i++;
          continue;
        }
        // Paragraph
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    // Initial load from URL hash if present
    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
</body>
</html>
