.. do`)\n```ridgun\ncontext :: log_path : String = \"/var/log/app.log\"\n\nlog_event String => ()\nlog_event msg    =  echo \"[{log_path}] {msg}\"\n\nmain => ()\nmain =\n  log_event \"Normal startup\"\n  with log_path = \"/tmp/test.log\" do\n    log_event \"Inside isolated test\"\n```\n\n### 2. `shared ::` and `atomic` — Concurrent state with per-line atomic locking\n```ridgun\nshared :: total_requests : Int = 0\n\nrecord_visit => Int\nrecord_visit =\n  atomic total_requests = total_requests + 1\n  total_requests\n```\n\n---\n\n## 8.5. Hardware Access (`hardware ::`) and POSIX Systems Primitives\n\nThe `ridgunc` compiler itself, the `stable` build manager, and Unix systems utilities are written in Ridgun. To make that possible, the language includes memory-mapped register blocks (`hardware ::`) and direct POSIX primitives:\n\n```ridgun\nhardware :: UART0 @ 0x1000_0000\n  tx_data : Int @ 0x00\n  status  : Int @ 0x04\n```\n\nAnd for interacting with the operating system:\n\n| Primitive | Signature | What It Does |\n|---|---|---|\n| `cli_args` | `=> [String]` | Command-line arguments (`argv`). |\n| `read_file` / `write_file` | `String => String` / `String String => ()` | Full file reading and writing on disk. |\n| `read_bytes` / `write_bytes` | `String => [Int]` / `String [Int] => ()` | Exact byte-by-byte binary reading and writing (`0..255`). |\n| `list_dir` / `file_lstat` | `String => [String]` / `String => ...` | Directory listing and POSIX metadata inspection (`lstat`). |\n| `sha256_file` / `sha256_str` | `String => String` | Native SHA-256 cryptographic hash. |\n| `sys_exec` / `shell_exec` | `... => Int` | Operating system process execution. |\n| `sys_getcwd` / `sys_chdir` | `=> String` / `String => Int` | Query or change the current working directory. |\n| `sys_getenv` / `sys_setenv` | `String => String` / `String String => Int` | Process environment variables. |\n| `sys_getuid` / `sys_getgid` | `=> Int` | Real process UID and GID (`doas`, security tools). |\n| `sys_exit` | `Int => ()` | Terminate the process with an exit code. |\n\n---\n\n## 8.6. Real-World Case Study: Building `rg-wc`, a Parallel Unix Utility\n\nLet's bring together everything we have learned from Chapter 01 to Chapter 08 in a real systems program: a parallel version of the Unix `wc` utility (line and byte counter across multiple files) written in pure Ridgun:\n\n```ridgun\n-- 1. Model file metrics using an ADT record (Chapter 06)\ntype Metrics = file: String, lines: Int, bytes: Int\n\n-- 2. Count newline characters (ASCII code 10) with TCO tail recursion (Chapter 04)\nfn :: count_newlines String Int Int Int => Int\n      count_newlines text   pos end acc =\n        | pos >= end                    = acc\n        | (str_char_at text pos) == 10  = count_newlines text (pos + 1) end (acc + 1)\n        | otherwise                     = count_newlines text (pos + 1) end acc\n\nfn :: line_count String => Int\n      line_count text   =  count_newlines text 0 (str_len text) 0\n\n-- 3. Analyze a file and return its Metrics record\nfn :: analyze_file String => Metrics\n      analyze_file path   =\n        content = read_file path\n        || line_count content -> n_lines\n        || str_len content    -> n_bytes ||.\n        Metrics path n_lines n_bytes\n\n-- 4. Format each row and sum totals using `fold` and `||` (Chapter 07)\nfn :: format_metric Metrics => String\n      format_metric m       =  \"{lines m}\\t{bytes m}\\t{file m}\"\n\nfn :: sum_lines Int Metrics => Int\n      sum_lines acc m       =  acc + (lines m)\n\nfn :: sum_bytes Int Metrics => Int\n      sum_bytes acc m       =  acc + (bytes m)\n\nfn :: generate_report [String] => String\n      generate_report paths    =\n        metrics = ||map analyze_file paths\n        || map format_metric metrics -> rows\n        || fold sum_lines 0 metrics  -> total_l\n        || fold sum_bytes 0 metrics  -> total_b ||.\n        \"{rows}\\nTotal: {total_l} lines, {total_b} bytes\"\n\nfn :: main => ()\n      main =\n        echo (generate_report [\"README.md\", \"AGENTS.md\"])\n```\n\nPause for a second and look at those ~40 lines of code:\n- There is not a single `null`, unchecked exception, or `Mutex`.\n- `count_newlines` compiles down to a native `loop` using 0 bytes of stack thanks to automatic TCO.\n- `||map analyze_file paths` processes files in parallel across all cores of your CPU, and the `||` block computes the formatted rows, total lines, and total bytes simultaneously.\n- Temporary memory is freed deterministically via **`RMM1`/`RMM2`**.\n- And when you run `ridgunc build rg_wc.rg -o rg-wc`, you get a self-contained ~350 KB native binary ready to copy into `/usr/local/bin`.\n\n---\n\n## 8.7. Final Roadmap: The 10 Golden Rules of the Ridgun Programmer\n\n1. **Always write the contract (`=>`) first and the equations (`=`) second:** thinking about types first makes the compiler work for you.\n2. **Let `stable format` typeset your tables:** type with single spaces and let the tool align columns, `=>`, `=`, and `->`.\n3. **Remember the universal `=` rule:** after any `=` you can open a sequential block, a `|` guard tree, or a parallel `||` graph.\n4. **Use `|.` and `||.` only when closing a nested block to return to an outer level:** keep deep decision trees compact and unambiguous.\n5. **Immutable by default (`x = ...`), explicitly mutable (`mut x = ...`):** reach for `mut` only when a local accumulator genuinely calls for it.\n6. **Use clear lowercase boolean operators (`and`, `or`, `xor`, `not`) and always close your guards with `| otherwise =`.**\n7. **Model your domain with ADTs (`type`):** use records with `with field: value` and sum types (`Option`, `Result`) instead of `null`.\n8. **Parallelize by declaring dependencies with `|| expr -> var` and `||map` / `||filter`:** let the compiler verify acyclicity and distribute work across cores.\n9. **Give your Tensors symbolic dimensions (`Tensor[N, K]`) and your contractions explicit indices (`a_ik @ b_kj`).**\n10. **Trust `RMM` (`RMM1`/`RMM2`), bound untrusted inputs with `with region`, and always verify with `stable check` and `stable test`.**\n\nHappy hacking in Ridgun!\n"}];
    const UI_STRINGS = {"copy_label": "Copy", "copied_label": "Copied!", "prev_label": "&larr; Previous chapter", "next_label": "Next chapter &rarr;", "search_hits_label": "Results for", "search_empty_label": "No matches found for"};
    let currentIdx = 0;

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlightRidgun(code) {
      return code.split("\n").map(line => {
        const comIdx = (() => {
          let inD = false, inS = false;
          for (let i = 0; i < line.length - 1; i++) {
            if (line[i] === "\\") { i++; continue; }
            if (line[i] === '"' && !inS) inD = !inD;
            else if (line[i] === "'" && !inD) inS = !inS;
            else if (!inD && !inS && line[i] === "-" && line[i+1] === "-") return i;
          }
          return -1;
        })();
        const codePart = comIdx >= 0 ? line.slice(0, comIdx) : line;
        const comPart = comIdx >= 0 ? line.slice(comIdx) : "";
        let html = escapeHtml(codePart);
        // Strings
        html = html.replace(/("([^"\\]|\\.)*"|'[^']*')/g, '<span class="rg-str">$1</span>');
        // Keywords
        html = html.replace(/\b(fn|op|type|import|mut|otherwise|with|region|do|global|context|shared|atomic|hardware|echo|and|or|xor|not)\b/g, '<span class="rg-kw">$1</span>');
        // Types & constructors
        html = html.replace(/\b(Int|Real|String|Char|Bool|Tensor|Option|Result|Some|None|Ok|Err|OutOfMemory|Timeout|True|False)\b/g, '<span class="rg-ty">$1</span>');
        // Operators
        html = html.replace(/(::|=&gt;|-&gt;|&lt;-|\|\|\.|\|\||\|\.)/g, '<span class="rg-op">$1</span>');
        // Numbers & byte units
        html = html.replace(/\b(0x[0-9a-fA-F_]+|[0-9][0-9_]*(_KB|_MB|_GB)?(\.[0-9]+)?)\b/g, '<span class="rg-num">$1</span>');
        if (comPart) {
          html += '<span class="rg-com">' + escapeHtml(comPart) + '</span>';
        }
        return html;
      }).join("\n");
    }

    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\$O\(([^)]+)\)\$/g, "<code>O($1)</code>");
      out = out.replace(/\$\\rightarrow\$/g, "&rarr;");
      out = out.replace(/\$1024\^2\$/g, "1024<sup>2</sup>");
      out = out.replace(/\$1024\^3\$/g, "1024<sup>3</sup>");
      out = out.replace(/\$1024\$/g, "1024");
      return out;
    }

    function renderMarkdown(md) {
      const lines = md.split("\n");
      let html = "";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        // Fenced code block
        if (line.startsWith("```")) {
          const lang = line.slice(3).trim() || "ridgun";
          i++;
          const buf = [];
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i++;
          }
          i++; // skip closing ```
          const rawCode = buf.join("\n");
          const bodyHtml = (lang === "ridgun" || lang === "") ? highlightRidgun(rawCode) : escapeHtml(rawCode);
          html += `<div class="code-wrapper"><div class="code-header"><span>${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">${escapeHtml(UI_STRINGS.copy_label)}</button></div><pre data-raw="${ encodeURIComponent(rawCode) }"><code>${bodyHtml}</code></pre></div>`;
          continue;
        }
        // Horizontal rule
        if (/^---+$/.test(line.trim())) {
          html += "<hr />";
          i++;
          continue;
        }
        // Headings
        if (line.startsWith("# ")) {
          html += `<h1>${formatInline(line.slice(2).trim())}</h1>`;
          i++;
          continue;
        }
        if (line.startsWith("## ")) {
          html += `<h2>${formatInline(line.slice(3).trim())}</h2>`;
          i++;
          continue;
        }
        if (line.startsWith("### ")) {
          html += `<h3>${formatInline(line.slice(4).trim())}</h3>`;
          i++;
          continue;
        }
        // Table
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i+1].trim())) {
          const headers = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            rows.push(lines[i].trim().slice(1, -1).split("|").map(c => formatInline(c.trim())));
            i++;
          }
          html += '<div class="table-wrap"><table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join("") + '</tr></thead><tbody>' +
                  rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join("") + '</tr>').join("") + '</tbody></table></div>';
          continue;
        }
        // Blockquote
        if (line.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].startsWith(">")) {
            qLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          html += `<blockquote><p>${qLines.map(formatInline).join("<br/>")}</p></blockquote>`;
          continue;
        }
        // Unordered list
        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*-\s+/, "")));
            i++;
          }
          html += "<ul>" + items.map(it => `<li>${it}</li>`).join("") + "</ul>";
          continue;
        }
        // Ordered list
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(formatInline(lines[i].replace(/^\s*\d+\.\s+/, "")));
            i++;
          }
          html += "<ol>" + items.map(it => `<li>${it}</li>`).join("") + "</ol>";
          continue;
        }
        // Empty line
        if (!line.trim()) {
          i++;
          continue;
        }
        // Paragraph
        const pLines = [];
        while (i < lines.length && lines[i].trim() && !lines[i].startsWith("#") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !lines[i].trim().startsWith("|") && !/^---+$/.test(lines[i].trim()) && !/^\s*(-|\d+\.)\s+/.test(lines[i])) {
          pLines.push(formatInline(lines[i]));
          i++;
        }
        html += `<p>${pLines.join(" ")}</p>`;
      }
      return html;
    }

    window.copyCode = function(btn) {
      const pre = btn.closest(".code-wrapper").querySelector("pre");
      const raw = decodeURIComponent(pre.getAttribute("data-raw"));
      navigator.clipboard.writeText(raw);
      const old = btn.textContent;
      btn.textContent = UI_STRINGS.copied_label;
      setTimeout(() => { btn.textContent = old; }, 1400);
    };

    function renderSidebar() {
      const nav = document.getElementById("navList");
      nav.innerHTML = CHAPTERS.map((ch, idx) => `
        <li class="nav-item">
          <button class="nav-btn ${idx === currentIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
            <span class="nav-num">${ch.num}</span>
            <span>${escapeHtml(ch.short_title)}</span>
          </button>
        </li>
      `).join("");
    }

    window.selectChapter = function(idx) {
      currentIdx = idx;
      const ch = CHAPTERS[idx];
      location.hash = ch.slug;
      renderSidebar();
      let pagerHtml = '<div class="pager">';
      if (idx > 0) {
        pagerHtml += `<button class="pager-btn prev" onclick="selectChapter(${idx - 1})"><span class="pager-label">${UI_STRINGS.prev_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx - 1].title)}</span></button>`;
      } else {
        pagerHtml += '<div></div>';
      }
      if (idx + 1 < CHAPTERS.length) {
        pagerHtml += `<button class="pager-btn next" onclick="selectChapter(${idx + 1})"><span class="pager-label">${UI_STRINGS.next_label}</span><span class="pager-title">${escapeHtml(CHAPTERS[idx + 1].title)}</span></button>`;
      }
      pagerHtml += '</div>';
      document.getElementById("chapterContent").innerHTML = renderMarkdown(ch.markdown) + pagerHtml;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length < 2) {
        selectChapter(currentIdx);
        return;
      }
      const hits = [];
      CHAPTERS.forEach((ch, idx) => {
        const lines = ch.markdown.split("\n");
        for (const l of lines) {
          if (l.toLowerCase().includes(q)) {
            hits.push({ idx, title: ch.title, snippet: l.replace(/^[#>*-]+\s*/, "").slice(0, 140) });
            break;
          }
        }
      });
      const box = hits.length
        ? `<div class="search-results"><strong>${escapeHtml(UI_STRINGS.search_hits_label)} "${escapeHtml(q)}" (${hits.length}):</strong>` +
          hits.map(h => `<div class="search-hit" onclick="document.getElementById('searchInput').value=''; selectChapter(${h.idx})"><div class="search-hit-title">${escapeHtml(h.title)}</div><div class="search-hit-snippet">${escapeHtml(h.snippet)}</div></div>`).join("") +
          `</div>`
        : `<div class="search-results">${escapeHtml(UI_STRINGS.search_empty_label)} "${escapeHtml(q)}".</div>`;
      document.getElementById("chapterContent").innerHTML = box + renderMarkdown(CHAPTERS[currentIdx].markdown);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    // Initial load from URL hash if present
    const initialSlug = location.hash.replace(/^#/, "");
    const foundIdx = CHAPTERS.findIndex(c => c.slug === initialSlug);
    selectChapter(foundIdx >= 0 ? foundIdx : 0);
  </script>
